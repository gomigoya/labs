<!doctype html><html lang="ko"><meta charset="utf-8"><title>학생 직접 조작 검수 기록</title><style>body{font:18px/1.6 system-ui;padding:30px}button{font:inherit;padding:14px}pre{white-space:pre-wrap}</style><h1>학생 직접 조작 검수 기록</h1><p>현재 테스트 포트에서 실제 학생 UI로 작성한 기록을 검증·보관합니다. 조건 구성이나 실험 실행을 대신하지 않습니다.</p><button id="save">실제 조작 기록 검증·저장</button><pre id="result"></pre><script type="module">
import {STORAGE,validate,COURSES} from '/labs/force-equilibrium/curriculum-model.js';
import {lessonFor,frameEvidence} from '/labs/force-equilibrium/lesson-content.js';
document.getElementById('save').onclick=async()=>{try{const report=validate(JSON.parse(localStorage.getItem(STORAGE))),activities=Object.entries(COURSES).flatMap(([cid,c])=>c.activities.map(a=>{const e=report.courses[cid].experiments[a.id],l=lessonFor(cid,a.id),evidence=frameEvidence(l,e);return {course:cid,id:a.id,title:a.title[0],pass:evidence.every(Boolean),conditions:l.frames.map((f,i)=>({id:f.id,pass:evidence[i],pointer:e.trials.some(t=>t.frameId===f.id&&t.interaction?.method==='pointer')})),trials:e.trials.length,methods:[...new Set(e.trials.map(t=>t.interaction?.method||'button'))]};})),data={pass:activities.every(a=>a.pass&&a.conditions.every(f=>f.pointer)),activities,report};await fetch('/__save/student-pointer-v7.json',{method:'POST',body:JSON.stringify(data,null,2)});document.getElementById('result').textContent=JSON.stringify({pass:data.pass,activities:activities.length,conditions:activities.reduce((n,a)=>n+a.conditions.length,0),failed:activities.filter(a=>!a.pass||a.conditions.some(f=>!f.pointer))},null,2);}catch(e){document.getElementById('result').textContent=e.stack;}};
</script></html>
