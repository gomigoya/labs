<!doctype html><meta charset="utf-8"><title>Local validation harness</title>
<style>body{margin:0}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#panel{position:fixed;z-index:100;left:5px;bottom:5px;background:white;padding:5px;width:250px;opacity:.85}textarea{width:230px;height:50px}output{display:block;font:10px monospace;max-height:120px;overflow:auto;white-space:pre-wrap}button{min-height:32px}</style>
<iframe id="lab" title="Force laboratory"></iframe>
<div id="panel"><textarea aria-label="Validation command">{"op":"status"}</textarea><button id="run">Run validation</button><button id="hide">Hide panel</button><output></output></div>
<script>
const p=new URLSearchParams(location.search);document.querySelector('iframe').src='/labs/force-equilibrium/?'+p.toString();
let errors=[];document.querySelector('iframe').onload=()=>{const w=document.querySelector('iframe').contentWindow;w.addEventListener('error',e=>errors.push(e.message));const original=w.console.error.bind(w.console);w.console.error=(...a)=>{errors.push(a.map(String).join(' '));original(...a)}};
document.getElementById('hide').onclick=()=>document.getElementById('panel').style.display='none';
document.getElementById('run').onclick=async()=>{const out=document.querySelector('output');try{const command=JSON.parse(document.querySelector('textarea').value),w=document.querySelector('iframe').contentWindow,L=w.__lab;let result;
 const tick=n=>{for(let done=0;done<n;done+=120)L.step(Math.min(120,n-done),1/60)};
 if(command.op==='status')result={...L.diagnostics(),audit:L.textAudit(),scroll:w.document.documentElement.scrollWidth-w.innerWidth,viewport:[w.innerWidth,w.innerHeight],errors};
 if(command.op==='hero'){L.pauseLoop();L.mode('explore');w.document.getElementById('free').click();L.preset(command.preset??0);L.shot(command.shot??0);tick(2);result=await L.capture(command.name||'hero')}
 if(command.op==='set'){L.pauseLoop();if(command.mode)L.mode(command.mode);if(command.free)w.document.getElementById('free').click();if(command.preset!==undefined)L.preset(command.preset);for(const [k,v] of Object.entries(command.values||{}))L.set(k,v);for(const [k,v] of Object.entries(command.layers||{}))L.layer(k,v);if(command.shot!==undefined)L.shot(command.shot);tick(command.frames??1);if(command.name)await L.capture(command.name);result={...L.diagnostics(),audit:L.textAudit()}}
 if(command.op==='quests'){L.pauseLoop();const results=[];for(let i=0;i<5;i++){L.mode('explore');L.quest.go(i);tick(115);await L.capture('q'+i+'-predict');const a0=L.textAudit();L.quest.pick([1,0,0,1,0][i]);await L.capture('q'+i+'-before');const goals=[{'0.mag':6},{'0.mag':4},{'1.mag':4},{'1.attach':.65},{'2.mag':5,'2.angle':216.86989764584402}];for(const [k,v] of Object.entries(goals[i]))L.set(k,v);tick(75);await L.capture('q'+i+'-event');const evidence=L.diagnostics();L.quest.advance();const a1=L.textAudit();await L.capture('q'+i+'-compare');L.quest.advance();const a2=L.textAudit();await L.capture('q'+i+'-card');results.push({i,phase:L.quest.phase,passed:[...L.quest.passed],physics:evidence.physics,audits:[a0,a1,a2],completion:evidence.quest.phase})}result={results,errors};await fetch('/__save/quests.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='physics'){const cases=[{f:[{mag:4,angle:0,attach:0},{mag:4,angle:180,attach:0},{mag:0,angle:0,attach:0}],R:0,t:0},{f:[{mag:4,angle:0,attach:.65},{mag:4,angle:180,attach:-.65},{mag:0,angle:0,attach:0}],R:0,t:-5.2},{f:[{mag:4,angle:0,attach:0},{mag:3,angle:90,attach:0},{mag:5,angle:216.86989764584402,attach:0}],R:0,t:0}];result=cases.map(c=>{const p=L.PHYSICS.solve({forces:c.f,mass:2});return{input:c.f,computed:{R:p.resultant,torque:p.torque},hand:{R:c.R,torque:c.t},pass:Math.abs(p.resultant-c.R)<1e-10&&Math.abs(p.torque-c.t)<1e-10}});await fetch('/__save/physics.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='audits'){L.pauseLoop();const r=[];const goals=[{'0.mag':6},{'0.mag':4},{'1.mag':4},{'1.attach':.65},{'2.mag':5,'2.angle':216.86989764584402}];for(const mode of ['explore','present'])for(let i=0;i<5;i++){L.mode(mode);L.quest.go(i);const phases=[];const audit=phase=>phases.push({phase,words:L.textAudit()});audit('intro');tick(115);audit('predict');L.quest.pick(0);audit('manipulate');for(const [k,v] of Object.entries(goals[i]))L.set(k,v);tick(65);audit('observe');L.quest.advance();audit('compare');L.quest.advance();audit('principle');r.push({mode,i,phases,passed:L.quest.passed.includes(i)})}result={results:r,errors};await fetch('/__save/audits.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='tools'){L.pauseLoop();L.mode('present');w.document.getElementById('free').click();const r=[];for(const name of ['segments','limit','trails','lens','note','ab','numeric']){L.layer(name,true);tick(2);await L.capture('tool-'+name);r.push({name,audit:L.textAudit(),on:L.state.layers[name]});L.layer(name,false)}L.quality('low');tick(2);result={tools:r,low:L.diagnostics(),audit:L.textAudit(),errors};await fetch('/__save/tools.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='attract'){L.pauseLoop();L.state.lastInput=performance.now()-91000;tick(3);await L.capture('attract');result={attract:L.state.attract,audit:L.textAudit()}}
 if(command.op==='resume'){L.resumeLoop();result=true}
 if(command.op==='step'){L.pauseLoop();tick(command.frames||120);result={phase:L.quest.phase,physics:L.diagnostics().physics,audit:L.textAudit()}}
 if(command.op==='perf'){L.quality('low');w.document.getElementById('free').click();L.resumeLoop();const start=performance.now();await new Promise(r=>setTimeout(r,5000));result={duration:performance.now()-start,...L.diagnostics(),errors};await fetch('/__save/perf.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='ui'){const els=['top','bottom','cards','teacher-tools'];result={rects:els.map(id=>{const e=w.document.getElementById(id),r=e.getBoundingClientRect();return {id,x:r.x,y:r.y,w:r.width,h:r.height,display:w.getComputedStyle(e).display}}),audit:L.textAudit(),scroll:w.document.documentElement.scrollWidth-w.innerWidth,viewport:[w.innerWidth,w.innerHeight],projection:L.projection(),errors};await fetch('/__save/'+(command.name||'ui')+'.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 out.textContent=JSON.stringify(result);out.dataset.done=String(Date.now());
}catch(e){out.textContent='ERROR '+e.stack}};
</script>
