<!doctype html><meta charset="utf-8"><title>Local validation harness</title>
<style>body{margin:0}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#panel{position:fixed;z-index:100;left:5px;bottom:5px;background:white;padding:5px;width:250px;opacity:.85}textarea{width:230px;height:50px}output{display:block;font:10px monospace;max-height:120px;overflow:auto;white-space:pre-wrap}button{min-height:32px}</style>
<iframe id="lab" title="Force laboratory"></iframe>
<div id="panel"><textarea aria-label="Validation command">{"op":"status"}</textarea><button id="run">Run validation</button><button id="hide">Hide panel</button><output></output></div>
<script>
const p=new URLSearchParams(location.search);document.querySelector('iframe').src='/labs/force-equilibrium/?'+p.toString();
let errors=[];document.querySelector('iframe').onload=()=>{const w=document.querySelector('iframe').contentWindow;w.addEventListener('error',e=>errors.push(e.message));const original=w.console.error.bind(w.console);w.console.error=(...a)=>{errors.push(a.map(String).join(' '));original(...a)}};
document.getElementById('hide').onclick=()=>document.getElementById('panel').style.display='none';
document.getElementById('run').onclick=async()=>{const out=document.querySelector('output');out.textContent='Running...';try{const command=JSON.parse(document.querySelector('textarea').value),w=document.querySelector('iframe').contentWindow,L=w.__lab;if(!L){out.textContent='Loading laboratory. Run again when controls appear.';return}let result;
 const tick=n=>{for(let done=0;done<n;done+=120)L.step(Math.min(120,n-done),1/60)};
 if(command.op==='status')result={...L.diagnostics(),audit:L.textAudit(),scroll:w.document.documentElement.scrollWidth-w.innerWidth,viewport:[w.innerWidth,w.innerHeight],errors};
 if(command.op==='clarity'){
 L.pauseLoop();const S=L.lesson;S.start(true);tick(1);const checks=[];S.stage(1);S.representation(0,{onBody:true,direction:1,magnitude:1});S.start(false);checks.push({name:'existing-drawing-record-rescued',pass:S.state.stage===2&&S.state.representations[0]?.onBody===true});S.start(true);tick(1);checks.push({name:'direct-entry-without-drawing',pass:S.state.stage===2&&w.document.getElementById('lesson-run')!==null});checks.push({name:'named-controls',pass:w.document.querySelector('#lesson-plus .lesson-label').textContent.includes('힘')&&w.document.getElementById('lesson-title').textContent.length>5});
 const click=id=>w.document.getElementById(id).click();
 for(const mag of [1,2,4]){S.setMagnitude(mag);click('lesson-predict-'+(mag===1?0:mag===2?1:2));click('lesson-run');checks.push({name:'one-click-release-'+mag,pass:S.state.stage===3&&S.state.phase==='release'});tick(130);const t=S.state.trials.at(-1);checks.push({name:'plain-result-'+mag,pass:S.state.phase==='result'&&t.magnitude===mag&&t.observedDirection===Math.sign(mag-2)&&w.document.getElementById('lesson-title').textContent.includes('관찰 결과')&&w.document.getElementById('lesson-instruction').textContent.length>10});if(mag===2)checks.push({name:'balance-unlocks-explanation-without-third-trial',pass:!w.document.getElementById('lesson-next').disabled&&w.document.getElementById('lesson-response').textContent.includes('목표 달성')});click('lesson-another')}
 result={checks,state:S.state,errors};await fetch('/__save/clarity-qa.json',{method:'POST',body:JSON.stringify(result,null,2)});
 }
 if(command.op==='lesson'){
  L.pauseLoop();const S=L.lesson;S.start(true);tick(1);const checks=[];const check=(name,pass,detail)=>checks.push({name,pass,detail});const audits=[];const audit=()=>audits.push({stage:S.state.stage,words:L.textAudit()});
  S.stage(0);S.target('arrow');S.target('cart');S.stage(1);S.representation(0,{onBody:true,direction:1,magnitude:1});S.representation(1,{onBody:true,direction:-1,magnitude:2});S.checkRepresentation();audit();S.stage(2);
  for(const magnitude of [1,2,4]){S.setMagnitude(magnitude);S.predict(1);S.stage(3);const before=structuredClone(L.state.forces);S.release();tick(130);const t=S.state.trials.at(-1);const expected={R:magnitude-2,v:(magnitude-2)*t.elapsed,x:.5*(magnitude-2)*t.elapsed*t.elapsed};check('trial-'+magnitude,S.state.phase==='result'&&t.fixedMagnitude===2&&t.mass===1&&Math.abs(t.resultant-expected.R)<1e-10&&Math.abs(t.vx-expected.v)<1e-8&&Math.abs(t.x-expected.x)<.015,{trial:t,expected,forces:before});audit();if(command.capture)await L.capture('lesson-trial-'+magnitude);S.stage(2)}
  S.stage(4);S.chooseEvidence(1);S.chooseReason('no-forces');S.explain();S.chooseEvidence(2);S.chooseReason('equal-opposite');S.explain();check('explanation-and-revision',S.report().assessment.scores.explanation===2&&S.state.explanationAttempts[0].reason==='no-forces'&&S.state.explanationAttempts.length===2,S.state.explanationAttempts);audit();if(command.capture)await L.capture('lesson-evidence');S.stage(5);S.setMagnitude(2);S.predict(0);S.transfer();S.setMagnitude(3);S.predict(0);S.transfer();tick(1);audit();check('transfer-and-assessment',S.report().assessment.scores.transfer===2&&S.state.transferAttempts.length===2,S.report().assessment);check('unpenalized-prediction',S.state.trials[0].prediction===1&&S.state.trials[0].observedDirection===-1,S.state.trials[0]);check(p.get('wordless')==='1'?'wordless':'readable-instructions',audits.every(a=>p.get('wordless')==='1'?a.words.length===0:a.words.length>0),audits);const before=JSON.stringify(S.report());S.start(false);tick(1);check('reload-local-record',JSON.stringify(S.report())===before,{stage:S.state.stage,completed:S.state.completed});
  result={checks,audits,report:S.report(),diagnostics:L.diagnostics(),errors};await fetch('/__save/lesson-qa.json',{method:'POST',body:JSON.stringify(result,null,2)})
 }
 if(command.op==='lessonView'){L.pauseLoop();if(command.fresh)L.lesson.start(true);if(command.stage!==undefined)L.lesson.stage(command.stage);if(command.magnitude)L.lesson.setMagnitude(command.magnitude);tick(1);if(command.capture)await L.capture(command.capture);result={stage:L.lesson.state.stage,phase:L.lesson.state.phase,audit:L.textAudit(),rects:['lesson-nav','lesson-tools','lesson-panel'].map(id=>{const r=w.document.getElementById(id).getBoundingClientRect();return{id,x:r.x,y:r.y,w:r.width,h:r.height}}),projection:L.projection(),scroll:w.document.documentElement.scrollWidth-w.innerWidth,errors};await fetch('/__save/'+(command.name||'lesson-view')+'.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='lessonPerf'){L.quality('low');L.lesson.start(true);L.lesson.stage(2);L.resumeLoop();let frames=0,active=true;const count=()=>{if(active){frames++;w.requestAnimationFrame(count)}};w.requestAnimationFrame(count);const started=performance.now();await new Promise(r=>setTimeout(r,5000));active=false;const duration=performance.now()-started;L.pauseLoop();result={duration,frames,measuredFps:frames*1000/duration,diagnostics:L.diagnostics(),errors};await fetch('/__save/lesson-perf.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='learn'){
  L.pauseLoop();const rows=[];for(let i=0;i<3;i++){L.learn.start(i);tick(2);const stages=[{phase:L.learn.state.phase,audit:L.textAudit()}];await L.capture('learn-'+i+'-before');if(i>0){L.learn.pick(i===1?-1:1);tick(1);stages.push({phase:L.learn.state.phase,audit:L.textAudit()})}const fixed=JSON.stringify(L.state.forces[1-(i===2?1:0)]);L.learn.set(3);tick(60);stages.push({phase:L.learn.state.phase,audit:L.textAudit()});tick(60);stages.push({phase:L.learn.state.phase,audit:L.textAudit()});const during={...L.diagnostics().learn,pinned:L.state.pinned,x:L.state.dynamics.x};await L.capture('learn-'+i+'-watch');tick(120);const d=L.diagnostics();stages.push({phase:d.learn.phase,audit:L.textAudit()});await L.capture('learn-'+i+'-after');rows.push({i,stages,during,learn:d.learn,physics:d.physics,dynamics:{...L.state.dynamics},fixedForcePreserved:JSON.stringify(L.state.forces[1-(i===2?1:0)])===fixed,pass:d.learn.phase==='result'&&d.learn.cart&&d.learn.arrows.filter(Boolean).length===2&&!d.learn.resultArrow&&(i===2?Math.abs(L.state.dynamics.x)<1e-8:L.state.dynamics.x>.2)})}result={rows,errors};await fetch('/__save/learn-v2.json',{method:'POST',body:JSON.stringify(result,null,2)})
 }
 if(command.op==='learnStart'){L.pauseLoop();L.learn.start(command.task||0);tick(1);if(command.resume)L.resumeLoop();if(command.name)await L.capture(command.name);result={...L.diagnostics(),audit:L.textAudit(),speech:('speechSynthesis'in w),voices:('speechSynthesis'in w)?w.speechSynthesis.getVoices().map(v=>v.lang):[],errors}}
 if(command.op==='learnPerf'){L.quality('low');L.learn.start(0);L.resumeLoop();let frames=0,active=true;const count=()=>{if(active){frames++;w.requestAnimationFrame(count)}};w.requestAnimationFrame(count);const started=performance.now();await new Promise(r=>setTimeout(r,5000));active=false;const duration=performance.now()-started;L.pauseLoop();result={duration,frames,measuredFps:frames*1000/duration,...L.diagnostics(),errors};await fetch('/__save/learn-perf.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='learnView'){L.pauseLoop();tick(command.frames||1);if(command.name)await L.capture(command.name);result={...L.diagnostics(),audit:L.textAudit(),rects:['learn-top','learn-panel','learn-help','learn-level'].map(id=>{const r=w.document.getElementById(id).getBoundingClientRect();return{id,x:r.x,y:r.y,w:r.width,h:r.height}}),scroll:w.document.documentElement.scrollWidth-w.innerWidth,errors};await fetch('/__save/'+(command.name||'learn-view')+'.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='hero'){L.pauseLoop();L.mode('explore');w.document.getElementById('free').click();L.preset(command.preset??0);L.shot(command.shot??0);tick(2);result=await L.capture(command.name||'hero')}
 if(command.op==='set'){L.pauseLoop();if(command.mode)L.mode(command.mode);if(command.free)w.document.getElementById('free').click();if(command.preset!==undefined)L.preset(command.preset);for(const [k,v] of Object.entries(command.values||{}))L.set(k,v);for(const [k,v] of Object.entries(command.layers||{}))L.layer(k,v);if(command.shot!==undefined)L.shot(command.shot);tick(command.frames??1);if(command.name)await L.capture(command.name);result={...L.diagnostics(),audit:L.textAudit()}}
 if(command.op==='quests'){L.pauseLoop();const results=[];for(let i=0;i<5;i++){L.mode('explore');L.quest.go(i);tick(115);await L.capture('q'+i+'-predict');const a0=L.textAudit();L.quest.pick([1,0,0,1,0][i]);await L.capture('q'+i+'-before');const goals=[{'0.mag':6},{'0.mag':4},{'1.mag':4},{'1.attach':.65},{'2.mag':5,'2.angle':216.86989764584402}];for(const [k,v] of Object.entries(goals[i]))L.set(k,v);tick(75);await L.capture('q'+i+'-event');const evidence=L.diagnostics();L.quest.advance();const a1=L.textAudit();await L.capture('q'+i+'-compare');L.quest.advance();const a2=L.textAudit();await L.capture('q'+i+'-card');results.push({i,phase:L.quest.phase,passed:[...L.quest.passed],physics:evidence.physics,audits:[a0,a1,a2],completion:evidence.quest.phase})}result={results,errors};await fetch('/__save/quests.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='physics'){const cases=[{f:[{mag:4,angle:0,attach:0},{mag:4,angle:180,attach:0},{mag:0,angle:0,attach:0}],R:0,t:0},{f:[{mag:4,angle:0,attach:.65},{mag:4,angle:180,attach:-.65},{mag:0,angle:0,attach:0}],R:0,t:-5.2},{f:[{mag:4,angle:0,attach:0},{mag:3,angle:90,attach:0},{mag:5,angle:216.86989764584402,attach:0}],R:0,t:0}];result=cases.map(c=>{const p=L.PHYSICS.solve({forces:c.f,mass:2});return{input:c.f,computed:{R:p.resultant,torque:p.torque},hand:{R:c.R,torque:c.t},pass:Math.abs(p.resultant-c.R)<1e-10&&Math.abs(p.torque-c.t)<1e-10}});await fetch('/__save/physics.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='audits'){L.pauseLoop();const r=[];const goals=[{'0.mag':6},{'0.mag':4},{'1.mag':4},{'1.attach':.65},{'2.mag':5,'2.angle':216.86989764584402}];for(const mode of ['explore','present'])for(let i=0;i<5;i++){L.mode(mode);L.quest.go(i);const phases=[];const audit=phase=>phases.push({phase,words:L.textAudit()});audit('intro');tick(115);audit('predict');L.quest.pick(0);audit('manipulate');for(const [k,v] of Object.entries(goals[i]))L.set(k,v);tick(65);audit('observe');L.quest.advance();audit('compare');L.quest.advance();audit('principle');r.push({mode,i,phases,passed:L.quest.passed.includes(i)})}result={results:r,errors};await fetch('/__save/audits.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='tools'){L.pauseLoop();L.mode('present');w.document.getElementById('free').click();const r=[];for(const name of ['segments','limit','trails','lens','note','ab','numeric']){L.layer(name,true);tick(2);await L.capture('tool-'+name);r.push({name,audit:L.textAudit(),on:L.state.layers[name]});L.layer(name,false)}L.quality('low');tick(2);result={tools:r,low:L.diagnostics(),audit:L.textAudit(),errors};await fetch('/__save/tools.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='attract'){L.pauseLoop();L.state.lastInput=performance.now()-91000;tick(3);await L.capture('attract');result={attract:L.state.attract,audit:L.textAudit()}}
 if(command.op==='resume'){L.resumeLoop();result=true}
 if(command.op==='step'){L.pauseLoop();tick(command.frames||120);result={phase:L.quest.phase,physics:L.diagnostics().physics,audit:L.textAudit()}}
 if(command.op==='perf'){L.quality('low');w.document.getElementById('free').click();L.resumeLoop();const start=performance.now();await new Promise(r=>setTimeout(r,5000));result={duration:performance.now()-start,...L.diagnostics(),errors};await fetch('/__save/perf.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 if(command.op==='ui'){const els=['top','bottom','cards','teacher-tools'];result={rects:els.map(id=>{const e=w.document.getElementById(id),r=e.getBoundingClientRect();return {id,x:r.x,y:r.y,w:r.width,h:r.height,display:w.getComputedStyle(e).display}}),audit:L.textAudit(),scroll:w.document.documentElement.scrollWidth-w.innerWidth,viewport:[w.innerWidth,w.innerHeight],projection:L.projection(),errors};await fetch('/__save/'+(command.name||'ui')+'.json',{method:'POST',body:JSON.stringify(result,null,2)})}
 out.textContent=JSON.stringify(result);out.dataset.done=String(Date.now());
}catch(e){out.textContent='ERROR '+e.stack}};
</script>
