<!doctype html><html lang="en"><meta charset="utf-8"><title>Curriculum QA</title><style>body{font:16px system-ui;margin:20px}iframe{width:100%;height:760px}button{padding:12px}output{display:block;white-space:pre-wrap}</style><button id="run">Run all course checks</button><button id="thumb">Capture thumbnail</button><output id="result">Ready</output><iframe title="Lab under test" src="/labs/force-equilibrium/?lite=1"></iframe><script type="module">
import {COURSES,validate} from '/labs/force-equilibrium/curriculum-model.js';
document.getElementById('thumb').onclick=async()=>{document.getElementById('result').textContent=JSON.stringify(await document.querySelector('iframe').contentWindow.__lab.capture('thumb'))};
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');out.textContent='Running';try{const w=document.querySelector('iframe').contentWindow,L=w.__lab,C=L.curriculum,checks=[];L.pauseLoop();const test=(name,pass,detail)=>checks.push({name,pass,detail});const tick=n=>{for(let i=0;i<n;i++)L.step(1,1/60)};const near=(a,b,e=.02)=>Math.abs(a-b)<e;
for(const [course,definition]of Object.entries(COURSES)){await new Promise(r=>setTimeout(r,0));C.chooseCourse(course);for(const activity of definition.activities){C.chooseActivity(activity.id);C.reset();if(activity.id==='friction')C.set('surface',.2);if(activity.id==='scale'){test('scale-needs-zero-and-load',w.document.getElementById('course-run').disabled);C.zero();C.place()}C.run();tick(80);const e=C.state.courses[course].experiments[activity.id],r=e.trials.at(-1);test(course+'/'+activity.id,C.phase==='result'&&r.courseId===course&&r.schoolBand===definition.band&&r.result.metrics.every(m=>Number.isFinite(m.value)),{metrics:r.result.metrics,dynamics:{...L.state.dynamics},time:L.state.time});if(activity.id==='push')test('cart-actual-displacement',near(L.state.dynamics.x,r.result.metrics[0].value),{actual:L.state.dynamics.x,expected:r.result.metrics[0].value});if(activity.id==='vectors')test('vector-actual-velocity',near(L.state.dynamics.vx,3.6)&&near(L.state.dynamics.vy,4.8));if(activity.id==='friction')test('friction-stop-no-reversal',L.state.dynamics.vx===0&&near(L.state.dynamics.x,1.5**2/(2*.2*9.8),.02));}}
C.chooseCourse('middle');C.chooseActivity('parallel');C.set('right',2);C.set('initial',1);C.run();tick(80);test('actual-constant-velocity',near(L.state.dynamics.vx,1,1e-8)&&near(L.state.dynamics.x,1.2,.001));const before=JSON.stringify(C.report());C.chooseCourse('elementary');C.set('mass',3);C.chooseCourse('middle');test('course-restores-inputs',C.state.courses.middle.experiments.parallel.inputs.right===2&&C.state.courses.middle.experiments.parallel.inputs.initial===1);const report=C.report();test('validated-export',JSON.stringify(validate(report))===JSON.stringify(report));test('local-persistence',JSON.parse(w.localStorage.getItem('force-lab-curriculum-v1')).course==='middle');test('notebook-initially-collapsed',!w.document.getElementById('course-notebook').open);test('no-horizontal-overflow',w.document.documentElement.scrollWidth<=w.innerWidth);const d=L.diagnostics();test('low-quality-settings',d.pixelRatio===1&&d.shadow===1024&&!d.ao&&!d.dof);C.chooseCourse('middle');C.chooseActivity('parallel');C.set('initial',0);L.step(1);L.resumeLoop();const result={checks,pass:checks.every(c=>c.pass),diagnostics:d};out.textContent=JSON.stringify(result,null,2);await fetch('/__save/curriculum-qa.json',{method:'POST',body:JSON.stringify(result,null,2)});}catch(e){out.textContent=e.stack}};
</script></html>
