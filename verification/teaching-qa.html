<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지도서 과정 검증</title><style>body{font:17px/1.5 system-ui;margin:20px}iframe{width:100%;height:760px;border:1px solid #ccc}button{padding:14px;margin-bottom:12px}output{display:block;white-space:pre-wrap;max-height:320px;overflow:auto}</style><h1>지도서 과정 통합 검증</h1><p>전용 테스트 포트에서 실행합니다. 테스트는 이 포트의 실험 기록을 초기화합니다.</p><button id="run">전체 안내 실험 검증</button><button id="mobile">모바일 390px 검증</button><button id="mobile-run">390px 전체 과정 검증</button><output id="result">실험실 로드 중</output><iframe title="검증용 실험실" src="/labs/force-equilibrium/?lite=1&course=elementary"></iframe><script type="module">
import {COURSES,validate} from '/labs/force-equilibrium/curriculum-model.js';
import {lessonFor,learningStatus} from '/labs/force-equilibrium/lesson-content.js';
const frame=document.querySelector('iframe'),out=document.getElementById('result');
frame.onload=()=>{out.textContent='Ready';};
document.getElementById('mobile-run').onclick=async()=>{await document.getElementById('mobile').onclick();await document.getElementById('run').onclick();};
document.getElementById('mobile').onclick=async()=>{Object.assign(frame.style,{width:'390px',height:'680px',position:'fixed',top:'0',left:'0',zIndex:'100'});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const w=frame.contentWindow,data={pass:w.innerWidth===390&&w.document.documentElement.scrollWidth<=390,viewport:w.innerWidth,pageWidth:w.document.documentElement.scrollWidth,height:w.innerHeight};out.textContent=JSON.stringify(data);await fetch('/__save/teaching-mobile-qa.json',{method:'POST',body:JSON.stringify(data,null,2)});};
document.getElementById('run').onclick=async()=>{const checks=[];out.textContent='Running';const test=(name,pass,detail)=>checks.push({name,pass,detail});try{
 const w=frame.contentWindow,L=w.__lab,C=L.curriculum;if(!C)throw Error('Lab not ready');L.pauseLoop();const tick=n=>{for(let i=0;i<n;i++)L.step(1,1/60);};let trialCount=0;
 for(const [cid,definition]of Object.entries(COURSES)){C.chooseCourse(cid);for(const a of definition.activities){C.chooseActivity(a.id);C.reset();const l=lessonFor(cid,a.id);C.stage('investigate');for(const [i,f]of l.frames.entries()){
  C.chooseFrame(i);C.state.courses[cid].experiments[a.id].learning.predictions[f.id]='Predicted before measurement';for(const key of l.setup||[])if(key!=='baseline')C.setup(key);if(l.zero)C.zero();if(l.setup?.includes('baseline'))C.setup('baseline');if(f.requiresBag){C.bag();C.zero();}
  for(const [key,value]of Object.entries(f.inputs))C.set(key,value);if(['scale','spring-scale'].includes(a.id)&&C.state.courses[cid].experiments[a.id].placed===!!f.empty)C.place();if(l.draw)C.draw([.5,.5,.5+C.state.courses[cid].experiments[a.id].inputs.direction*C.state.courses[cid].experiments[a.id].inputs.magnitude*.075,.5]);
  tick(1);const direct=L.directInput();test('scene-targets-'+cid+'/'+a.id+'/'+f.id,direct.targets.length>0&&direct.visible.length>0&&direct.targets.every(t=>t.valid),direct);const before=C.state.courses[cid].experiments[a.id].trials.length;C.run();tick(80);const e=C.state.courses[cid].experiments[a.id],r=e.trials.at(-1);if(l.requiresReading)C.read(r.result.metrics.find(m=>m.key==='reading').value);trialCount++;test(cid+'/'+a.id+'/'+f.id,C.phase==='result'&&e.trials.length===before+1&&r.frameId===f.id&&r.result.metrics.every(m=>Number.isFinite(m.value)),r?.result.metrics);test('finite-apparatus-'+trialCount,L.apparatus().invalid.length===0,L.apparatus().invalid);
  if(r?.result.dynamic){const rr=r.result,fx=rr.forces.reduce((n,f)=>n+f.mag*Math.cos(f.angle*Math.PI/180),0),fy=rr.forces.reduce((n,f)=>n+f.mag*Math.sin(f.angle*Math.PI/180),0);test('integrated-motion-'+trialCount,Math.abs(L.state.dynamics.x-(rr.initialVelocity*1.2+.5*fx/rr.mass*1.2**2))<.025&&Math.abs(L.state.dynamics.y-.5*fy/rr.mass*1.2**2)<.025,{actual:L.state.dynamics,fx,fy});}
 }
 const e=C.state.courses[cid].experiments[a.id];e.note='Measured conditions were compared.';e.learning.reflection='Compared prediction with measurement.';if(l.plan)e.learning.plan='User, purpose and controlled test.';for(const q of [...l.questions,l.transfer])C.answer(q.id,q.correct);test('evidence-complete-'+cid+'/'+a.id,learningStatus(l,e).complete,learningStatus(l,e));test('export-validated-'+cid+'/'+a.id,JSON.stringify(validate(C.report()))===JSON.stringify(C.report()));await new Promise(r=>setTimeout(r,0));}}
 const diag=L.diagnostics();test('low-quality-contract',diag.pixelRatio===1&&diag.shadow===1024&&!diag.ao&&!diag.dof,diag);test('no-horizontal-overflow',w.document.documentElement.scrollWidth<=w.innerWidth);test('notebook-collapsed',!w.document.getElementById('course-notebook').open);
 C.chooseCourse('middle');C.chooseActivity('elastic');C.stage('explain');tick(1);L.resumeLoop();const data={pass:checks.every(c=>c.pass),viewport:w.innerWidth,activities:Object.values(COURSES).reduce((n,c)=>n+c.activities.length,0),guidedTrials:trialCount,checks,diagnostics:diag};out.textContent=JSON.stringify(data,null,2);await fetch('/__save/teaching-qa.json',{method:'POST',body:JSON.stringify(data,null,2)});
}catch(error){out.textContent=JSON.stringify({pass:false,error:error.stack,checks},null,2);}};
</script></html>
