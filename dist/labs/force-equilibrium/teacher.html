<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>힘의 작용 실험실 · 학습 기록</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4ec;color:#2b4138;font:16px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px 80px}h1{font-size:32px;line-height:1.3}h2{margin-top:38px;font-size:22px}nav,.actions{display:flex;gap:16px;flex-wrap:wrap}a{color:#347563}button,.file{border:1px solid #b6c8b0;background:#e5edde;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit}input[type=file]{max-width:100%}aside{background:#e6ecdf;border-left:4px solid #8ba67c;padding:16px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #ccd6c5}.scroll{overflow:auto}#status{min-height:2em}#evidence{white-space:pre-wrap}small{color:#526b5a}@media print{nav,.actions,#status{display:none}main{padding:0}tr{break-inside:avoid}h2{break-after:avoid}}
</style><link rel="stylesheet" href="teacher-studio.css"></head><body><main><nav><a href="?lang=ko">한국어</a><a href="?lang=en">English</a><a id="guide" href="guide.html"></a><a id="lab" href="index.html"></a></nav><h1 id="title"></h1><p id="intro"></p><div class="actions"><button id="reload" type="button"></button><label><span id="import-label"></span> <input id="import" type="file" accept=".json,application/json"></label><button id="download" type="button" disabled></button><button id="print" type="button"></button></div><p id="status" role="status"></p><aside id="scope"></aside><section id="result" hidden><h2 id="rubric-title"></h2><p id="rubric-note"></p><table id="rubric"></table><h2 id="trials-title"></h2><div class="scroll"><table id="trials"></table></div><h2 id="evidence-title"></h2><p id="evidence"></p><h2 id="talk-title"></h2><ul id="talk"></ul></section><h2 id="sources-title"></h2><ul id="sources"></ul><p><small id="privacy"></small></p></main>
<script type="module">
import {validateReport,SOURCES} from './lesson-model.js';
const en=new URLSearchParams(location.search).get('lang')==='en',t=(ko,eng)=>en?eng:ko,$=id=>document.getElementById(id);document.documentElement.lang=en?'en':'ko';
const text={title:['학습 기록과 형성 평가','Learning records and formative assessment'],intro:['예상·실험·수정의 과정을 확인하고 학생의 구두 설명과 함께 사용하세요.','Review prediction, investigation and revision alongside the learner’s spoken explanation.'],guide:['교사 안내서','Teacher guide'],lab:['실험실','Laboratory'],reload:['이 브라우저의 마지막 기록 읽기','Read this browser’s latest record'],'import-label':['다른 컴퓨터의 JSON 기록 열기','Open a JSON record from another computer'],download:['기록 내려받기','Download record'],print:['인쇄 / PDF 저장','Print / save PDF'],scope:['2022 개정 중학교 [9과05-01] 중 힘의 표현과 나란한 두 힘의 평형을 다룹니다. 전체 수업은 45분이며 기본 빠른 경로는 그 일부를 사용합니다. 특정 출판사 지도서의 원차시 전체를 구현한 것은 아닙니다. 예측 오답은 감점하지 않습니다.','An adapted activity on force representation and parallel two-force equilibrium within Korean 2022 middle-school standard [9과05-01]. The full lesson is 45 minutes; the default quick route uses a subset. It does not reproduce an entire publisher lesson. Incorrect predictions are not penalized.'],'rubric-title':['교사 보조 점검표 · 항목별 0–2','Teacher checklist · 0–2 per dimension'],'rubric-note':['아래 수준은 제작자가 제안한 형성 평가 보조 기준이며 공식 성취수준·성적이 아닙니다. 마지막으로 제출한 응답을 계산하고 이전 시도도 남깁니다. 총점이나 학생 순위를 만들지 않습니다.','These are proposed formative checkpoints, not official attainment levels or grades. Scores use the latest submitted responses; earlier attempts are retained. No total or ranking is produced.'],'trials-title':['실험 증거 · 매번 질량 1 kg, 정지 출발, 호박 2 N 왼쪽','Trial evidence · 1 kg, initially at rest, amber 2 N left'],'evidence-title':['설명과 전이 응답','Explanation and transfer responses'],'talk-title':['학생에게 확인할 발문','Follow-up questions'],'sources-title':['근거 자료와 확인 범위','Sources and verified scope'],privacy:['이름·학번을 수집하지 않습니다. 기록은 이 브라우저의 localStorage에만 저장되며 자동 전송되지 않습니다. 기기·브라우저·사이트 주소가 바뀌면 JSON 파일을 옮겨 여세요. 공용 기기에서는 새 수업 시작으로 초기화하세요. 브라우저 저장이 차단되면 새로고침 전에 파일로 저장하세요.','No names or student IDs are collected. Records stay in this browser’s localStorage and are not uploaded. To change devices, browsers or site origins, export and import the JSON file. Reset the lesson on shared devices. If browser storage is blocked, download before reloading.']};
for(const [id,value]of Object.entries(text))$(id).textContent=t(...value);$('guide').href='guide.html'+(en?'?lang=en':'');$('lab').href='index.html'+(en?'?lang=en':'');document.title=t('힘의 작용 실험실 · 학습 기록','Force laboratory · Learning records');
for(const source of SOURCES){const li=document.createElement('li'),link=document.createElement('a');link.href=source.url;link.textContent=source.title;link.target='_blank';link.rel='noopener';li.append(link,document.createTextNode(' — '+source.locator+' ['+source.kind+']'));$('sources').append(li)}
let current=null;const motion=v=>v===0?t('정지 유지','Stayed at rest'):v<0?t('왼쪽','Left'):t('오른쪽','Right');
function table(target,head,rows){target.replaceChildren();const tr=document.createElement('tr');for(const v of head){const th=document.createElement('th');th.textContent=v;tr.append(th)}target.append(tr);for(const row of rows){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}target.append(tr)}}
function show(data){current=validateReport(data);const s=current.session,scores=current.assessment.scores;$('result').hidden=false;$('download').disabled=false;$('status').textContent=t('기록을 읽었습니다. 건너뛴 활동은 미실시로 표시합니다. 완료 여부: ','Record loaded. Skipped activities are marked not attempted. Completed: ')+(s.completed?t('제출됨','Submitted'):t('진행 중','In progress'));
const rubric=[['body',t('힘을 받는 물체','Receiving body'),t('0: 미확인 / 1: 수정 후 확인 / 2: 첫 응답 확인','0: not identified / 1: identified after revision / 2: identified first time')],['representation',t('화살표 표현','Force representation'),t('0–2: 시작 물체·방향·크기가 모두 맞는 화살표 수','0–2: number of arrows with correct body, direction and magnitude')],['investigation',t('비교 실험','Controlled investigation'),t('0: 없음 / 1: 일부 / 2: 왼쪽·정지·오른쪽 증거 모두','0: none / 1: some / 2: left, rest and right evidence')],['explanation',t('근거와 설명','Evidence and explanation'),t('평형 실험 선택 1 + 같은 크기·반대 방향 설명 1','1 for balanced trial evidence + 1 for equal/opposite explanation')],['transfer',t('새 물체 적용','Transfer'),t('평형 설정 1 + 그 설정에서 정지 예상 1','1 for balancing forces + 1 for predicting rest with that setup')]];
table($('rubric'),[t('항목','Dimension'),t('점검','Check'),t('제안 기준','Proposed criterion')],rubric.map(([key,name,desc])=>[name,({body:s.targetAttempts,representation:s.representationAttempts,investigation:s.trials,explanation:s.explanationAttempts,transfer:s.transferAttempts}[key].length?scores[key]:t('— 미실시','— not attempted')),desc]));
table($('trials'),[t('회','Trial'),t('청록 오른쪽 N','Cyan right N'),t('예상','Prediction'),t('관찰','Observation'),t('합력 N','Net force N'),t('시간 s','Time s'),t('위치 m','Position m'),t('속도 m/s','Velocity m/s')],s.trials.map(x=>[x.id,x.magnitude,motion(x.prediction),motion(x.observedDirection),x.resultant,x.elapsed.toFixed(3),x.x.toFixed(3),x.vx.toFixed(3)]));
const e=s.explanationAttempts.at(-1),tr=s.transferAttempts.at(-1),reason=v=>v==='equal-opposite'?t('같은 크기·반대 방향','Equal and opposite'):v==='unequal-opposite'?t('다른 크기·반대 방향','Unequal and opposite'):t('힘 없음','No forces');
$('evidence').textContent=[t('화살표 제출 횟수: ','Arrow submissions: ')+s.representationAttempts.length,t('설명 제출: ','Explanation: ')+(e?`${t('실험','trial')} ${e.evidenceId}, ${reason(e.reason)} (${s.explanationAttempts.length})`:t('미제출','Not submitted')),t('새 상자 제출: ','Crate transfer: ')+(tr?`${t('호박','amber')} ${tr.magnitude} N ${tr.direction<0?t('왼쪽','left'):t('오른쪽','right')}, ${t('예상','prediction')} ${motion(tr.prediction)} (${s.transferAttempts.length})`:t('미제출','Not submitted'))].join('\n');
const questions=[t('같은 물체에 작용하는 힘끼리 비교했나요? 작용·반작용의 두 힘과 어떻게 다른가요?','Are these forces acting on the same body? How does this differ from an action–reaction pair?'),t('왜 질량과 출발 속도를 같게 했나요? 한쪽 힘만 바꾼 까닭은 무엇인가요?','Why keep mass and initial velocity fixed? Why vary only one force?'),t('멈춰 있다고 힘이 없는 것인가요? 집게를 놓기 전의 정지를 근거로 써도 될까요?','Does rest mean no forces act? Is rest before releasing the clamp evidence for equilibrium?'),t('이미 움직이던 물체에 합력이 0이면 바로 멈출까요? 실제 수레의 마찰이 있으면 결과는 어떻게 다를까요?','Would a moving body stop immediately at zero net force? How would real cart friction change the outcome?')];$('talk').replaceChildren();for(const q of questions){const li=document.createElement('li');li.textContent=q;$('talk').append(li)}}
function error(){current=null;$('result').hidden=true;$('download').disabled=true;$('status').textContent=t('읽을 수 있는 기록이 없습니다. 수업을 진행하거나 이 실험실에서 저장한 JSON 파일을 여세요.','No readable record. Complete an activity or open a JSON exported from this lab.')}
function read(){try{show(JSON.parse(localStorage.getItem('force-lab-lesson-v2')))}catch{error()}}
$('reload').onclick=read;$('import').onchange=async()=>{try{const f=$('import').files[0];if(!f||f.size>1000000)throw Error();show(JSON.parse(await f.text()))}catch{error()}};
$('download').onclick=()=>{if(!current)return;const u=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='force-lab-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('print').onclick=()=>window.print();read();
</script></body></html>
