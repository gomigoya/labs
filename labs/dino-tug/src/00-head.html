<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e8d3"><title></title>
<style>
:root{--ui-scale:1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e8d3}
[hidden]{display:none!important}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:10;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:2px;padding:3px;border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:18px;background:var(--diagram-paper,#f4efe3);box-shadow:none}
button{border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:13px;min-width:56px;width:56px;height:56px;display:grid;place-items:center;background:var(--diagram-paper,#f4efe3);color:var(--diagram-ink,#221d18);cursor:pointer;padding:8px;touch-action:manipulation;flex-shrink:0}
button[aria-pressed=true]{background:#e8b23a;color:var(--diagram-ink,#221d18)}button:focus-visible{outline:2px solid #221d18;outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#quests{top:max(12px,env(safe-area-inset-top));max-width:calc(100% - 16px)}
.quest-row{display:flex;max-width:calc(100vw - 196px);overflow:auto;scrollbar-width:none;gap:2px}
.quest{position:relative;opacity:.85}.quest[aria-disabled=true]{opacity:.65;background:#deded6}.quest.current{opacity:1;color:var(--diagram-ink,#221d18);background:#e8b23a;box-shadow:none}.quest.complete{opacity:1;background:#c7d4b4}.quest.complete svg{fill:#c7d4b4}
.q-dots{display:flex;gap:2px;position:absolute;bottom:5px}.q-dots i{width:3px;height:3px;border-radius:50%;background:currentColor}
#tools{bottom:max(12px,env(safe-area-inset-bottom));flex-direction:column;max-width:calc(100% - 16px)}
.tool-row{display:flex;gap:0;min-height:56px;justify-content:center}
#tools .grammar-tool{border-top:2px solid #7863a6}
#tools button[id^=tool-s] svg{width:40px;height:40px;stroke-width:2.6}
#q-pictures{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:148px;display:flex;align-items:center;justify-content:center;gap:8px;width:min(780px,calc(100% - 16px));color:var(--diagram-ink,#221d18)}
#q-pictures:empty,#q-pictures.act,#q-pictures.observe{display:none}
#q-pictures button[data-candidate]{width:calc((100% - 16px)/3);max-width:230px;height:80px;padding:3px;background:var(--diagram-paper,#f4efe3);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18)}
#q-pictures button[data-candidate] svg{width:100%;height:100%;stroke-width:3}
.q-principle,.q-compare{background:var(--diagram-paper,#f4efe3);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:16px;padding:6px;display:flex;align-items:center;position:relative;width:500px;max-width:calc(100% - 64px);animation:q-arrive .5s ease-out}
.q-principle{flex-direction:column}.q-principle>svg{width:100%;height:72px}
.q-stars{display:flex;color:#936114;gap:8px}.q-stars svg{width:16px;height:16px;fill:#93611455}
.q-compare>svg{width:50%;height:72px}.q-compare.matched>svg:nth-child(2){position:absolute;inset:6px;width:calc(100% - 12px);opacity:.55}.q-compare.matched>svg:first-child{width:100%}.q-compare.matched>svg:last-child{position:absolute;right:5px;top:5px;width:32px;height:32px;color:#37795d}
#q-archive{right:12px;left:auto;bottom:150px;transform:none;max-width:180px;overflow:auto;justify-content:flex-start}
#q-overlay{position:fixed;inset:0;pointer-events:none;z-index:20;color:#936114}#q-overlay>svg{width:100%;height:100%}#q-overlay>svg>svg{stroke-width:3}
body:not([data-qphase=free]) #tools button{opacity:.48}body:not([data-qphase=free]) #tool-sound,body[data-focus=play] #tool-play,body[data-focus=species] #tools button[id^=tool-s],body[data-focus=ground] #tools button[id^=tool-g],body[data-focus=rail] #tool-play{opacity:1;box-shadow:none}
.q-bars:before,.q-bars:after{content:'';position:fixed;left:0;right:0;height:8vh;background:#e9e8d3;z-index:15;pointer-events:none}.q-bars:before{top:0}.q-bars:after{bottom:0}
/* Fixed event explanation lane; only the apparatus remains active for this beat. */
.q-event .hud,.q-event #teacher-strip,.q-event #teacher-numbers,.q-event #teacher-class{visibility:hidden;pointer-events:none}.q-event #q-pictures{display:none}
.hide-ui .hud,.hide-ui #q-pictures,.hide-ui #q-overlay,.hide-ui #teacher-strip,.hide-ui #teacher-numbers,.hide-ui #teacher-class{visibility:hidden;pointer-events:none}
body[data-mode=teacher] button{min-width:72px;min-height:72px;height:72px;background:var(--diagram-paper,#f4efe3);color:var(--diagram-ink,#221d18);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18)}
body[data-mode=teacher] svg{width:calc(24px * var(--ui-scale));height:calc(24px * var(--ui-scale));stroke-width:calc(2 * var(--ui-scale))}
body[data-mode=teacher] svg path,body[data-mode=teacher] svg circle,body[data-mode=teacher] svg rect{vector-effect:non-scaling-stroke}
body[data-mode=teacher] button[aria-pressed=true]{background:#e8b23a;color:var(--diagram-ink,#221d18);border-color:var(--diagram-ink,#221d18)}
body[data-mode=teacher] #quests{left:12px;right:328px;transform:none;max-width:none;justify-content:flex-start;padding:4px}
body[data-mode=teacher] #quests button{width:72px}body[data-mode=teacher] #quests .quest-row,body[data-mode=teacher] #tools{display:none}
#teacher-strip{position:fixed;z-index:22;right:12px;top:12px;display:grid;grid-template-columns:repeat(4,72px);gap:2px;width:316px;max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y;padding:7px;background:var(--diagram-paper,#f4efe3);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:18px;scrollbar-width:thin}
.teacher-grid{display:contents}
#teacher-strip button{min-width:72px;width:72px;height:72px;padding:10px}
#teacher-numbers{position:fixed;z-index:20;left:12px;right:344px;top:108px;height:58px;padding:6px;display:flex;justify-content:space-around;gap:6px;background:var(--diagram-paper,#f4efe3);color:var(--diagram-ink,#221d18);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:14px;pointer-events:none;font:18px monospace;font-variant-numeric:tabular-nums}
#teacher-numbers>div{display:flex;align-items:center;gap:4px;min-height:42px}#teacher-numbers svg{width:22px;height:22px}
#teacher-spot{position:fixed;inset:0;z-index:25;pointer-events:none;background:#000c;mask-image:radial-gradient(circle 140px at var(--pointer-x,50%) var(--pointer-y,50%),transparent 65%,black 100%)}
#teacher-laser{position:fixed;inset:0;width:100%;height:100%;z-index:26;pointer-events:none}
#teacher-class{position:fixed;inset:auto 344px 12px 12px;height:120px;z-index:24;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 80px 8px 8px;background:var(--diagram-paper,#f4efe3);color:var(--diagram-ink,#221d18);border:var(--diagram-border,1.5px) solid var(--diagram-ink,#221d18);border-radius:16px}
#teacher-class>button:first-child{position:absolute;right:6px;top:8px}
#teacher-class>button[data-choice]{width:30%;height:100%;min-height:72px;padding:4px}
#teacher-class>button[data-choice] svg{width:100%;height:100%}
.class-result{width:100%;height:100%}.class-result .q-compare{position:relative;width:100%;max-width:100%;height:100%;display:grid;animation:q-arrive .5s ease-out}
.class-result .q-compare>svg{grid-area:1/1;width:100%!important;height:100%!important;opacity:.65}.class-result .q-compare>svg:first-child{stroke-dasharray:5 5;color:var(--diagram-ink,#221d18)}
#kiosk-recover{position:fixed;inset:0;width:100%;height:100%;z-index:40;background:#f4efe3f2;color:var(--diagram-ink,#221d18)}#kiosk-recover svg{width:72px;height:72px}
#attract-start{position:fixed;bottom:24px;left:calc(50% - 36px);width:72px;height:72px;z-index:30;color:var(--diagram-ink,#221d18);background:#f4efe3}
#touch-pulse{position:fixed;z-index:35;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:3px solid #221d18;border-radius:50%;display:grid;place-items:center;color:var(--diagram-ink,#221d18);pointer-events:none;animation:touch-pulse .8s both}#touch-pulse svg{width:48px;height:48px}
@keyframes q-arrive{from{transform:translateY(12px);opacity:.2}to{transform:translateY(0);opacity:1}}
@keyframes touch-pulse{0%{transform:scale(.65);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
@media(max-width:980px){
 #quests{width:348px;max-width:calc(100vw - 16px)}#quests>.quest-row{max-width:156px}
 #tools{width:348px}#q-pictures{gap:3px}#q-pictures button[data-candidate]{height:72px;width:calc((100% - 6px)/3)}
 #q-archive{max-width:120px}
 body[data-mode=teacher] #quests{top:12px;left:8px;right:auto;width:auto}
 #teacher-strip{display:flex;flex-wrap:nowrap;top:auto;bottom:8px;left:8px;right:8px;width:auto;height:88px;max-height:88px;overflow-x:auto;overflow-y:hidden;gap:2px;padding:3px}
 #teacher-numbers{left:8px;right:8px;top:100px;font-size:11px;gap:2px;padding:3px}#teacher-numbers>div{gap:2px}#teacher-numbers svg{width:16px;height:16px}
 #teacher-class{inset:auto 8px 108px 8px;height:96px;padding:8px 80px 8px 8px;gap:4px}
 #teacher-class>button[data-choice]{min-width:72px;min-height:72px;max-height:72px;width:30%;padding:2px}
}
@media(prefers-reduced-motion:reduce){#touch-pulse,#q-pictures *,.class-result *{animation:none!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script>
</head><body><canvas id="gl"></canvas><div id="quests" class="hud" aria-hidden="true"></div><div id="tools" class="hud"></div>
