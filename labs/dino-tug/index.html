</head><body><canvas id="gl"></canvas><div id="quests" class="hud" aria-hidden="true"></div><div id="tools" class="hud"></div>
<script type="module">
// 이 파일은 src/의 조각을 tools/assemble.mjs로 이어 붙여 만든다. 수정은 src/에서.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const THEME = Object.freeze({ kids: 0xf4a04d, dino: 0x7ac59d, muscle: 0xb296e0, friction: 0xf29db5,
 brass: 0xb79859, graphite: 0x303943, chrome: 0xbcc7cc, warm: 0xffb36b, cool: 0x7dd3fc,
 bone: 0xe2d7ba, wood: 0x644936, wall: 0x746657, navy: 0x303e50, rubber: 0x262a2c,
 background: 0x514b43, fog: 0x776e60, screen: 0x11232e, grid: 0x385363, reference: 0xe1e9e6,
 glass: 0xb6e0ed, sand: 0xc6a36e, gravel: 0x999c94, asphalt: 0x41494e, leaf: 0x587e66 });

// ==== 1 PHYSICS ====
const PHYS = (() => {
  const C = Object.freeze({
    g: 9.81, // m/s²
    adultMass: 70, kidMass: 35, // kg
    adultPullRatio: 0.5, kidPullRatio: 0.4, // 추정: 체중 대비 근육 힘
    tieN: 1, // N
    kidsMin: 1, kidsMax: 100, increaseQ5: 10, designKids: 30,
    muscleExponent: 2 / 3,
    railRoundoffUlps: 8,
    kidHeight: 1.3, // m, 비교용 눈금이며 공룡 키를 추론하지 않는다.
    forceLinearBeads: 10, forceTailBeads: 5, // 추정: 표시 공간 배분
    detentKids: Object.freeze([1, 10, 20, 30, 49, 59, 68, 100]),
    get k() { return this.adultPullRatio * this.adultMass * this.g / this.adultMass ** this.muscleExponent; }, // N/kg^(2/3), 추정
    get kidMuscle() { return this.kidPullRatio * this.kidMass * this.g; }, // N, 추정
  });
  const SPECIES = Object.freeze({
    '벨로키랍토르': 15, '딜로포사우루스': 400, '스테고사우루스': 3000,
    '트리케라톱스': 6000, '티라노사우루스': 8000, '아르젠티노사우루스': 70000,
  }); // kg, 명세의 대표 질량
  const GROUNDS = Object.freeze({ '유리': 0.05, '모래': 0.35, '자갈': 0.55, '아스팔트': 0.8 });
  const RANGE = Object.freeze({ kids: Object.freeze([C.kidsMin, C.kidsMax]) });
  const muscle = mass => C.k * mass ** C.muscleExponent;
  const friction = (mass, mu) => mu * mass * C.g;
  const kidCap = (n, mu) => n * Math.min(C.kidMuscle, friction(C.kidMass, mu));
  const dinoCap = (species, mu) => Math.min(muscle(SPECIES[species]), friction(SPECIES[species], mu));
  const weightRatio = species => muscle(SPECIES[species]) / (SPECIES[species] * C.g);
  function outcome(n, species, mu) {
    const kids = kidCap(n, mu), dino = dinoCap(species, mu), net = kids - dino;
    const winner = Math.abs(net) <= C.tieN ? 'tie' : net > 0 ? 'kids' : 'dino';
    // 비김에는 패자가 없다. 작은 한계 쪽, 정확히 같으면 아이 쪽을 진단한다.
    const kidsLimited = kids <= dino;
    const fm = kidsLimited ? C.kidMuscle : muscle(SPECIES[species]);
    const ff = friction(kidsLimited ? C.kidMass : SPECIES[species], mu);
    return { kids, dino, net, winner, limiter: ff <= fm ? 'friction' : 'muscle' };
  }
  function minKidsToWin(species, mu) {
    // 명세의 엄격한 > 정의다. 1 N 비김 띠와는 별개다.
    const n = Math.floor(dinoCap(species, mu) / kidCap(C.kidsMin, mu)) + 1;
    return n <= C.kidsMax ? n : Infinity;
  }
  // 각 정수 칸은 레일의 같은 폭을 차지한다. railX는 칸의 중심이다.
  const railX = n => (n - C.kidsMin + 0.5) / (C.kidsMax - C.kidsMin + 1);
  function kidsFromRailX(x) {
    const scaled = x * (C.kidsMax - C.kidsMin + 1);
    // 정확한 칸 경계가 곱셈 반올림 때문에 왼쪽 칸으로 떨어지지 않게 한다.
    const rounded = scaled + C.railRoundoffUlps * Number.EPSILON * Math.max(1, Math.abs(scaled));
    return Math.max(C.kidsMin, Math.min(C.kidsMax, C.kidsMin + Math.floor(rounded)));
  }
  const DETENTS = Object.freeze(C.detentKids.map(n => Object.freeze({ n, x: railX(n) })));
  // 추정: 열 마디까지 선형, 이후 로그 압축. 끊김과 ⤢를 함께 붙인다.
  function forceVisual(force) {
    const beads = force / C.kidMuscle;
    return { beads, length: beads <= C.forceLinearBeads ? beads
      : C.forceLinearBeads + C.forceTailBeads * Math.log1p((beads - C.forceLinearBeads) / C.forceTailBeads),
    compressed: beads > C.forceLinearBeads };
  }
  // 접촉 한계를 넘는 순간만 사건으로 돌려주며, 속도나 가속도는 만들지 않는다.
  function slipOnset(previousForce, force, mass, mu) {
    if (previousForce === null) return null;
    const threshold = friction(mass, mu);
    return previousForce <= threshold && force > threshold;
  }
  // 검증은 기록·퀘스트 경계에서만 한다. 핵심 계산의 입력은 유효 SI 값이다.
  const validSetup = ({ n, species, mu }) => Number.isInteger(n) && n >= C.kidsMin && n <= C.kidsMax
    && Object.hasOwn(SPECIES, species) && Object.values(GROUNDS).includes(mu);
  const validObservation = o => o != null && Number.isInteger(o.run) && o.run > 0 && validSetup(o);
  const judgeQ1 = s => validSetup(s) && s.n === C.kidsMin && s.species === '벨로키랍토르'
    && s.mu === GROUNDS['자갈'] && outcome(s.n, s.species, s.mu).winner === 'kids';
  const judgeQ2 = s => validSetup(s) && s.species === '트리케라톱스' && s.mu === GROUNDS['자갈']
    && s.n >= minKidsToWin(s.species, s.mu) && outcome(s.n, s.species, s.mu).winner === 'kids';
  const judgeQ3 = s => validSetup(s) && s.species === '티라노사우루스' && s.mu === GROUNDS['자갈']
    && s.n >= minKidsToWin(s.species, s.mu);
  function judgeQ4({ observations = [] }) {
    const valid = observations.filter(validObservation);
    return valid.some(a => a.mu === GROUNDS['자갈'] && outcome(a.n, a.species, a.mu).winner === 'kids'
      && valid.some(b => b.run !== a.run && b.n === a.n && b.species === a.species
        && b.mu === GROUNDS['유리'] && outcome(b.n, b.species, b.mu).winner === 'dino'));
  }
  function judgeQ5({ before = null, after = null }) {
    return validObservation(before) && validObservation(after) && after.run > before.run
      && before.species === after.species && before.mu === GROUNDS['유리'] && after.mu === before.mu
      && after.n - before.n >= C.increaseQ5
      && [before, after].every(s => outcome(s.n, s.species, s.mu).limiter === 'friction');
  }
  const judgeQ6 = ({ visited = [], compareOpen = false }) => compareOpen === true
    && ['벨로키랍토르', '아르젠티노사우루스'].every(s => visited.includes(s))
    && weightRatio('벨로키랍토르') > weightRatio('아르젠티노사우루스');
  function judgeQ7(s) {
    if (!validSetup(s) || s.n !== C.designKids || s.mu !== GROUNDS['자갈']) return false;
    const winners = Object.keys(SPECIES).filter(t => outcome(s.n, t, s.mu).winner === 'kids');
    return winners.includes(s.species) && !winners.some(t => SPECIES[t] > SPECIES[s.species]);
  }
  // R1 display mappings only. Dimensions are schematic exhibition units, not recovered anatomy.
  const SCENE = Object.freeze({ top: 1.10, trackWidth: 6.0, trackDepth: 1.24, railStart: -2.70,
    railWidth: 2.2, railY: 1.36, railZ: 0.76, consoleZ: 1.04, barWidth: 2.35,
    min: Object.freeze([-3.2, 0.035, -0.80]), max: Object.freeze([3.2, 3.25, 1.30]),
    modelScales: Object.freeze([0.46, 0.66, 0.77, 0.82, 0.98, 0.96]),
    // body length, body height, leg height, neck rise, head length, tail length; estimated models.
    forms: Object.freeze([[0.78,0.34,0.37,0.17,0.30,0.65],[0.85,0.43,0.48,0.25,0.36,0.70],
      [1.02,0.54,0.27,0.10,0.26,0.75],[1.02,0.58,0.28,0.10,0.48,0.56],
      [1.00,0.60,0.58,0.23,0.48,0.75],[1.08,0.56,0.42,1.15,0.30,0.85]].map(Object.freeze)),
    comparisonScale: 0.18, flagTravel: 0.40, kidSceneHeight: 0.16, stakeScale: 0.30 });
  const railWorldX = x => SCENE.railStart + x * SCENE.railWidth;
  const massGraphX = species => Math.log(SPECIES[species] / 15) / Math.log(70000 / 15);
  const forceSceneLength = force => SCENE.barWidth * forceVisual(force).length / forceVisual(muscle(70000)).length;
  const pegPosition = i => ({ x: -2.68 + (i % 10) * 0.205, y: SCENE.top + 0.13, z: -0.43 + Math.floor(i / 10) * 0.085 });
  function displayState(n, species, mu, phase = 0) {
    const result = outcome(n, species, mu), i = Object.keys(SPECIES).indexOf(species);
    return { n, speciesIndex: i, scale: SCENE.modelScales[i], form: SCENE.forms[i],
      kidsLength: forceSceneLength(result.kids), dinoLength: forceSceneLength(result.dino),
      kidsCompressed: forceVisual(result.kids).compressed, dinoCompressed: forceVisual(result.dino).compressed,
      flagX: (result.winner === 'tie' ? 0 : result.winner === 'kids' ? -1 : 1) * SCENE.flagTravel * (0.5 - 0.5 * Math.cos(phase)),
      slip: result.winner !== 'tie' && result.limiter === 'friction', ...result };
  }
  // R2 schematic mappings. Bounds/caps belong here, never in scene callers.
  const VIS = Object.freeze({ cells: 30, width: 2.35, kidHeight: .22, grains: 180, streamCount: 96, dustCount: 48, recordCap: 3,
    min: Object.freeze([-3.25,.035,-.8]), max: Object.freeze([3.25,3.65,1.30]),
    lensWidth: 1.60, lensHeight: .66, ratioHeight: .58, trailCount: 9 });
  const modelScale = species => .38 + .64 * Math.cbrt(SPECIES[species] / 70000);
  function teamLayout(n, i) {

  scale(value){S.lineScale=value;if(value===1){camera.clearViewOffset();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
    for(const grip of [RAIL_HANDLE,SLIDER.handle,DIAL.knob,PLAY_BUTTON,SWITCH])grip.scale.setScalar(value);

  },
  ghost(snapshot){if(snapshot)GRAMMAR.pin();else GRAMMAR.unpin();},
  predict(open=false,choice=null,dt=0){
    const d=QUESTS[Q.i],f=Q.flags;
    if(open){Q.phase='predict';Q.pick=null;f.classElapsed=0;}
    if(choice!==null){

        const s=QUEST.sample();if(command.pull)observations.push({n:s.n,species:s.species,mu:s.mu});
        if(command.compare)GRAMMAR.set({[GRAMMAR.LAYERS[6]]:true});
      }

    return {phase:Q.phase,candidates:d.candidates,picture:c=>CARDS.picture(d.id,c,DIRECTOR.clock,QUEST.sample()),compare:()=>{
      const c=d.candidates.find(c=>c.key===Q.pick)||d.candidates[0];return `<div class="q-compare">${CARDS.picture(d.id,c)}${CARDS.actual(d.id,f.classSample||QUEST.sample())}</div>`;
    }};
  }
};

const T = { mode: 'student', slow: false, spotlight: false, laser: false, numbers: false, ab: null, layerStep: 0 };

const TEACHER_LABELS = {

  laser: { ko: '레이저 포인터', en: 'Laser pointer' }, numbers: { ko: '수치 층', en: 'Numeric layer' },

Object.assign(LABELS, TEACHER_LABELS);
Object.assign(ICONS, {
  teacher: 'M6 3h12v18H6zM9 6h6M9 10h6M9 15h1m4 0h1M9 18h6',
  frame: 'M4 5v14l8-7zM14 5l8 7-8 7z', slow: 'M3 14h18M6 14V9h12v5M8 9V6m8 3V6M7 18h1m8 0h1',
  ab: 'M3 5h7v14H3zM14 5h7v14h-7zM10 12h4', clear: 'M5 5l14 14M19 5L5 19',
  spotlight: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v10M7 12h10',
  laser: 'M3 21l9-9m-2-2 4 4M16 2v4m2 2h4M18 6l3-3',
  numbers: 'M7 3L5 21M16 3l-2 18M2 9h19M1 15h19', predict: 'M3 4h18v13H3zM8 21l4-4 4 4M7 8h3m4 0h3M7 12h10', close: 'M5 5l14 14M19 5L5 19'
});
const TEACHER_KEYS = { Space: 'play', '.': 'frame', '/': 'ui', Escape: 'reset' };
const teacherStrip = document.createElement('aside'); teacherStrip.id = 'teacher-strip'; document.body.append(teacherStrip);

const spotMask = document.createElement('div'); spotMask.id = 'teacher-spot'; document.body.append(spotMask);
const laserCanvas = document.createElement('canvas'); laserCanvas.id = 'teacher-laser'; document.body.append(laserCanvas);
const laserTrail = [];
function teacherButton(label, symbol, fn, parent, dictionary = TEACHER_LABELS) {

const TEACHER = {
  state: T, config: TEACHER_CFG,

    TEACHER_CFG.scale(mode === 'teacher' ? 1.4 : 1);

  },
  layers(names) { for (const name of TEACHER_CFG.layerOrder) TEACHER_CFG.setLayer(name, names.includes(name)); },
  stack() {

    this.render();
  },
  select(i) { TEACHER_CFG.selectQuest(i); T.layerStep = 0; classPanel.hidden = true; this.render(); },
  reset() {
    const mode = T.mode;

    classPanel.hidden = true; laserTrail.length = 0;
    TEACHER_CFG.reset(); T.mode = mode; this.layers([]); TEACHER_CFG.ghost(null); TEACHER_CFG.ui(true);
    if (T.mode === 'student') TEACHER_CFG.startStudent();
    TEACHER_CFG.refresh(); this.render();
  },
  command(name) {
    if (name === 'reset') this.reset();
    else if (name === 'play') TEACHER_CFG.play(!TEACHER_CFG.getPlaying());
    else if (name === 'frame') TEACHER_CFG.oneFrame();
    else if (name === 'stack') this.stack();
    else if (name === 'ab') { T.ab = { closer: TEACHER_CFG.getCloser() }; TEACHER_CFG.ghost(T.ab); }
    else if (name === 'clear') { T.ab = null; TEACHER_CFG.ghost(null); }
    else if (name === 'predict') { TEACHER_CFG.predict(true); classPanel.hidden = false; this.prediction(); }

  },
  render() {

    const section = () => { const g = document.createElement('div'); g.className = 'teacher-grid'; teacherStrip.append(g); return g; };
    let group = section();
    for (const name of ['play', 'frame', 'slow']) {
      const b = teacherButton(name, name === 'play' ? TEACHER_CFG.getPlaying() ? 'pause' : 'play' : name, () => this.command(name), group);
      b.setAttribute('aria-pressed', String(name === 'play' ? TEACHER_CFG.getPlaying() : !!T[name]));
    }

    for (const name of TEACHER_CFG.layerOrder) teacherButton(name, TEACHER_CFG.layerIcons[name], () => {

    }, group, TEACHER_CFG.layerLabels).setAttribute('aria-pressed', String(TEACHER_CFG.layerOn(name)));

    group = section();
    for (const name of ['ab', 'clear', 'spotlight', 'laser', 'numbers']) teacherButton(name, name, () => this.command(name), group).setAttribute('aria-pressed', String(name === 'ab' ? !!T.ab : !!T[name]));
    group = section();
    TEACHER_CFG.quests.forEach((d, i) => { const b = teacherButton('quest', d.icon, () => this.select(i), group); b.setAttribute('aria-label', `${TEACHER_LABELS.quest[TEACHER_CFG.language]} ${i + 1}`); });
    group = section();
    for (const name of ['predict', 'reset']) teacherButton(name, name, () => this.command(name), group);
    if (focusLabel) [...teacherStrip.querySelectorAll('button')].find(b => b.getAttribute('aria-label') === focusLabel)?.focus({ preventScroll: true });

  },
  prediction() {

    teacherButton('close', 'close', () => { classPanel.hidden = true; }, classPanel);
    if (data.phase === 'predict') data.candidates.forEach((c, i) => {
      const b = teacherButton('choice', 'predict', () => { TEACHER_CFG.predict(false, i); this.prediction(); }, classPanel);
      b.dataset.choice = i; b.setAttribute('aria-label', `${TEACHER_LABELS.choice[TEACHER_CFG.language]} ${i + 1}`); b.innerHTML = data.picture(c);
    });

    classPanel.querySelector('button')?.focus({ preventScroll: true });
  },
  update(dt) {
    spotMask.hidden = T.mode !== 'teacher' || !T.spotlight;
    laserCanvas.hidden = T.mode !== 'teacher' || !T.laser;
    numericLayer.hidden = T.mode !== 'teacher' || !T.numbers;
    if (!numericLayer.hidden) numericLayer.innerHTML = TEACHER_CFG.numbers.map(row => `<div>${TEACHER_CFG.icon(row.label)}<span data-numeric>${row.fn().toFixed(2)} ${row.unit}</span></div>`).join('');
    if (!classPanel.hidden) {
      const data = TEACHER_CFG.predict(false, null, dt);
      if (data.phase === 'predict') classPanel.querySelectorAll('[data-choice]').forEach(b => { b.innerHTML = data.picture(data.candidates[+b.dataset.choice]); });
      else classPanel.querySelector('.class-result').innerHTML = data.compare();
    }
    if (!laserCanvas.hidden) {
      if (laserCanvas.width !== innerWidth || laserCanvas.height !== innerHeight) { laserCanvas.width = innerWidth; laserCanvas.height = innerHeight; }
      const c = laserCanvas.getContext('2d'), now = performance.now(); c.clearRect(0, 0, innerWidth, innerHeight);
      while (laserTrail.length > 1 && now - laserTrail[0].t > 160) laserTrail.shift();

        c.strokeStyle = '#ff3838'; c.fillStyle = '#ff3838'; c.lineWidth = 4; c.shadowColor = '#ff0000'; c.shadowBlur = 12;

};
window.addEventListener('pointermove', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('pointerdown', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('keydown', e => {
  if (T.mode !== 'teacher' || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  const command = TEACHER_KEYS[e.code === 'Space' ? 'Space' : e.key];

  if (command && command !== 'ui') { e.preventDefault(); TEACHER.command(command); }
});
Object.assign(window.__lab, { teacher: TEACHER });

// Portable kiosk controller: only TEACHER_CFG knows the apparatus.
const A = { active: false, t: 0, stage: 0 };
const ATTRACT_LABELS = {
  recover: { ko: '처음부터 다시 시작', en: 'Restart from the beginning' },
  start: { ko: '만져서 시작', en: 'Touch to start' }
};
const recovery = document.createElement('button'); recovery.id = 'kiosk-recover'; recovery.hidden = true;
recovery.setAttribute('aria-label', ATTRACT_LABELS.recover[TEACHER_CFG.language]); recovery.innerHTML = TEACHER_CFG.icon('reset'); document.body.append(recovery);
const touchPulse = document.createElement('div'); touchPulse.id = 'touch-pulse'; touchPulse.hidden = true;
touchPulse.setAttribute('aria-hidden', 'true'); touchPulse.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(touchPulse);
const attractStart = document.createElement('button'); attractStart.id = 'attract-start'; attractStart.hidden = true;
attractStart.setAttribute('aria-label', ATTRACT_LABELS.start[TEACHER_CFG.language]); attractStart.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(attractStart);
let lastInput = performance.now(), stalledFrames = 0, pulseUntil = 0;
const idleOption = Number(new URLSearchParams(location.search).get('idle'));
const idleSeconds = Number.isFinite(idleOption) && idleOption > 0 ? idleOption : TEACHER_CFG.idleSeconds;
const ATTRACT = {
  state: A,
  start(stage = 0) {
    if (!Number.isInteger(stage) || !TEACHER_CFG.attract[stage]) throw new RangeError('stage');
    if (T.mode === 'teacher') return;
    A.active = true; A.t = 0; A.stage = stage;
    document.body.classList.add('attract'); attractStart.hidden = false;
    TEACHER_CFG.questMode(true); TEACHER_CFG.play(true); TEACHER_CFG.ui(false); this.stage();
  },
  stage() {
    const row = TEACHER_CFG.attract[A.stage];
    TEACHER.layers(row.layers); TEACHER_CFG.fly(TEACHER_CFG.shotForStage(row), Math.min(3, row.seconds / 2));
  },
  wake(pulse = true) {
    A.active = false; A.t = 0; A.stage = 0;
    document.body.classList.remove('attract'); attractStart.hidden = true; recovery.hidden = true;
    stalledFrames = 0; lastInput = performance.now();
    TEACHER.reset(); TEACHER.mode('student'); TEACHER_CFG.startStudent();
    if (pulse) { pulseUntil = performance.now() + 800; touchPulse.hidden = false; touchPulse.style.animation = 'none'; void touchPulse.offsetWidth; touchPulse.style.animation = ''; }
  },
  fail() {
    A.active = false; recovery.hidden = false; attractStart.hidden = true;
    document.body.classList.remove('attract'); TEACHER_CFG.play(false);
  },
  health(ms) { stalledFrames = ms > 1000 ? stalledFrames + 1 : 0; if (stalledFrames >= 5) this.fail(); },
  update(dt) {
    if (!touchPulse.hidden && performance.now() >= pulseUntil) touchPulse.hidden = true;
    if (!recovery.hidden) return;
    if (!A.active) {
      if (T.mode !== 'teacher' && !TEACHER_CFG.cardBusy() && performance.now() - lastInput >= idleSeconds * 1000) this.start();
      return;
    }
    const row = TEACHER_CFG.attract[A.stage], before = A.t; A.t = Math.min(row.seconds, A.t + dt);
    const ease = t => { const x = t / row.seconds; return x * x * (3 - 2 * x); };
    const mix = (ease(A.t) - ease(before)) / Math.max(1e-9, 1 - ease(before));
    TEACHER_CFG.setCloser(TEACHER_CFG.getCloser() + (row.closer - TEACHER_CFG.getCloser()) * mix, true);
    if (A.t >= row.seconds) {
      TEACHER_CFG.setCloser(row.closer, true); A.stage = (A.stage + 1) % TEACHER_CFG.attract.length; A.t = 0; this.stage();
    }
  }
};
recovery.onclick = () => ATTRACT.wake(); attractStart.onclick = () => ATTRACT.wake();
for (const name of ['pointerdown', 'pointermove', 'touchstart', 'keydown', 'wheel']) window.addEventListener(name, event => {
  lastInput = performance.now();

}, { capture: true, passive: false });

window.addEventListener('click', event => {
  if (event.isTrusted && performance.now() < pulseUntil) { event.preventDefault(); event.stopImmediatePropagation(); }
}, { capture: true });
document.addEventListener('visibilitychange', () => { lastInput = performance.now(); stalledFrames = 0; TEACHER_CFG.visibilityReset(); });
Object.assign(window.__lab, { attract: ATTRACT });
