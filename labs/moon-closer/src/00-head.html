<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#30251f">
<title></title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#30251f}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:10;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;border:1px solid #ffffff29;border-radius:18px;background:#211e23b8;backdrop-filter:blur(14px);box-shadow:0 8px 32px #0004}
#quests{top:max(16px,env(safe-area-inset-top));pointer-events:none;gap:12px;padding:10px 18px;color:#d5d8df6b}
.quest{display:grid;justify-items:center;gap:5px}.quest i{width:4px;height:4px;border-radius:50%;background:#bcbecb55}
#tools{bottom:max(18px,env(safe-area-inset-bottom))}
button{border:0;border-radius:13px;min-width:56px;height:56px;display:grid;place-items:center;background:#ffffff08;color:#e4dfd5;cursor:pointer;padding:8px;touch-action:manipulation}
button[aria-pressed=true]{background:#bc96513d;color:#ffce8b}button:focus-visible{outline:2px solid #ffcf9a;outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#speed{display:flex;gap:4px;min-width:28px;justify-content:center}#speed i{width:4px;height:4px;background:#ffce8b;border-radius:50%}
.hide-ui .hud{visibility:hidden;pointer-events:none}
@media(max-width:980px){#quests{top:max(78px,env(safe-area-inset-top));gap:9px;padding:9px 12px}#quests svg{width:20px;height:20px}#tools{width:260px;flex-wrap:wrap;gap:2px;padding:6px}#speed{width:30px}#tools button{min-width:56px}#tools button:nth-last-child(3){margin-left:20px}#tools button:last-child{margin-right:20px}}
#person-card{position:fixed;z-index:9;right:18px;top:96px;width:min(310px,calc(100vw - 36px));padding:14px;border:1px solid #ffffff38;border-radius:14px;background:#192a36c9;backdrop-filter:blur(14px);box-shadow:0 8px 32px #0004;pointer-events:none}
#person-card svg{display:block;width:100%;height:auto;stroke-width:2}
@media(max-width:980px){#person-card{top:150px;right:12px;width:230px;padding:10px}}
.hide-ui #person-card{visibility:hidden}
</style>
<style>
#quests{pointer-events:auto;gap:3px;padding:5px;color:#d5d8df;max-width:calc(100vw - 16px)}
#quests button{position:relative;min-width:56px;width:56px;height:56px;padding:7px;flex-shrink:0}
#quests .quest{opacity:.3;background:transparent}#quests .current{opacity:1;color:#ffce8b;box-shadow:inset 0 0 15px #ffc47a35}#quests .complete{opacity:1;color:#64ead0}#quests .complete svg{fill:#64ead030}
.q-dots{display:flex;gap:2px;height:4px}.q-dots i{background:currentColor;width:3px;height:3px;border-radius:50%}
#q-pictures{position:fixed;z-index:13;left:50%;bottom:170px;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:12px;width:min(700px,94vw);color:#e5e7ec}
#q-pictures[hidden]{display:none}#q-pictures svg{width:100%;height:auto;stroke-width:2}
#q-pictures button[data-candidate]{width:210px;height:140px;padding:6px;border:1px solid #ffffff45;background:#142c38ed;box-shadow:0 8px 32px #0005}
#q-pictures .q-picked{width:125px;border-radius:10px;background:#182c37d9;padding:3px;animation:q-pick .45s both}
#q-pictures.act,#q-pictures.observe{top:86px;bottom:auto;pointer-events:none}
.q-compare,.q-principle{display:flex;align-items:center;background:#142c38ed;border:1px solid #ffffff45;border-radius:18px;padding:15px;width:500px;max-width:calc(100% - 65px);animation:q-arrive .6s both}
.q-compare>svg{width:50%!important}.q-compare.matched>svg{margin-right:-15%;opacity:.8}.q-compare.matched>svg:last-child{width:56px!important;color:#64ead0;opacity:1;margin:0}
.q-principle{flex-direction:column}.q-stars{display:flex;color:#ffce8b;gap:9px}.q-stars svg{width:24px!important;fill:#ffce8b44}
#q-extra{bottom:86px;z-index:11;gap:2px;padding:4px;max-width:calc(100vw - 16px)}#q-extra .sub{opacity:.35}#q-extra svg{max-height:52px}#q-extra .q-restore{display:none}#q-extra[data-ring] .q-restore{display:grid}
#q-overlay{position:fixed;inset:0;pointer-events:none;z-index:19;color:#fff}#q-overlay>svg{width:100%;height:100%;stroke-width:2}
.q-event .hud,.q-event #q-pictures,.q-event #person-card{opacity:.12;pointer-events:none}
.q-bars:before,.q-bars:after{content:'';position:fixed;left:0;right:0;height:10vh;background:#13191d;z-index:18;pointer-events:none}.q-bars:before{top:0}.q-bars:after{bottom:0}
.hide-ui #q-pictures,.hide-ui #q-overlay{visibility:hidden}
@keyframes q-pick{from{transform:translateY(200px) scale(1.7)}to{transform:translateY(0) scale(1)}}
@keyframes q-arrive{from{transform:translateY(-70px);opacity:.2}to{transform:translateY(0);opacity:1}}
@media(max-width:980px){
 #quests{top:12px;width:348px;display:grid;grid-template-columns:repeat(6,56px);gap:0;padding:5px}#quests button:nth-child(n+7){transform:translateX(56px)}
 #tools{bottom:12px;width:348px;flex-wrap:nowrap;gap:0;padding:4px}#speed{display:none}#tools button:nth-last-child(3),#tools button:last-child{margin:0}#tools button{width:56px}
 #q-extra{bottom:80px;width:348px;display:flex;flex-wrap:wrap;gap:0;padding:4px}#q-extra button{width:56px;min-width:56px;height:56px}#q-extra .sub{display:none}
 #q-pictures{bottom:210px;gap:6px;width:359px}#q-pictures button[data-candidate]{width:115px;min-width:56px;height:88px;padding:3px}
 #q-pictures.act,#q-pictures.observe{top:140px}#q-pictures .q-picked{width:95px}.q-compare,.q-principle{padding:8px;max-width:calc(100% - 62px)}
 #person-card{top:200px;right:12px;width:220px}
}
@media(prefers-reduced-motion:reduce){#q-pictures *{animation-duration:.01ms!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script>
<style>
:root{--ui-scale:1}
[hidden]{display:none!important}
body[data-mode=teacher] button{min-width:72px;min-height:72px;height:72px;background:#11212bf2;color:#fff;border:1px solid #ffffff80}
body[data-mode=teacher] svg{width:calc(24px * var(--ui-scale));height:calc(24px * var(--ui-scale));stroke-width:calc(2 * var(--ui-scale))}
body[data-mode=teacher] svg path,body[data-mode=teacher] svg circle,body[data-mode=teacher] svg rect{vector-effect:non-scaling-stroke}
body[data-mode=teacher] button[aria-pressed=true]{background:#70501d;color:#ffe2a0;border-color:#ffe2a0}
body[data-mode=teacher] #quests{width:auto;display:flex;top:12px;padding:4px}
body[data-mode=teacher] #quests button{width:72px;transform:none}
body[data-mode=teacher] #tools,body[data-mode=teacher] #q-extra{display:none}
#teacher-strip{position:fixed;z-index:22;right:12px;top:12px;bottom:12px;width:244px;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:8px;background:#101b23f2;border:2px solid #ffffff80;border-radius:18px;scrollbar-width:thin}
.teacher-grid{display:grid;grid-template-columns:repeat(3,72px);gap:4px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #ffffff60}
#teacher-strip button{width:72px;padding:10px}
#teacher-numbers{position:fixed;z-index:20;left:14px;top:110px;padding:14px;background:#101b23ed;color:#fff;border:1px solid #ffffff80;border-radius:14px;pointer-events:none;font:24px 'DM Mono',monospace;font-variant-numeric:tabular-nums}
#teacher-numbers>div{display:flex;align-items:center;gap:12px;min-height:48px}
#teacher-spot{position:fixed;inset:0;z-index:25;pointer-events:none;background:#000c;mask-image:radial-gradient(circle 140px at var(--pointer-x,50%) var(--pointer-y,50%),transparent 65%,black 100%)}
#teacher-laser{position:fixed;inset:0;width:100%;height:100%;z-index:26;pointer-events:none}
#teacher-class{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;gap:20px;padding:100px 28px;background:#101b23ed;color:#fff}
#teacher-class>button:first-child{position:absolute;right:16px;top:16px}
#teacher-class>button[data-choice]{width:30%;height:auto;aspect-ratio:300/160;min-height:160px;padding:12px}
#teacher-class>button[data-choice] svg{width:100%;height:auto}
.class-result{width:90%;max-width:1100px}.class-result .q-compare{position:relative;width:100%;max-width:100%;display:grid;min-height:240px;animation:q-arrive .6s both}
.class-result .q-compare>svg{grid-area:1/1;width:100%!important;height:auto!important;opacity:.65}.class-result .q-compare>svg:first-child{stroke-dasharray:5 5;color:#fff}
.hide-ui #teacher-strip,.hide-ui #teacher-numbers,.hide-ui #teacher-class{visibility:hidden;pointer-events:none}
#kiosk-recover{position:fixed;inset:0;width:100%;height:100%;z-index:40;background:#101b23e8;color:#fff}
#kiosk-recover svg{width:72px;height:72px}
#attract-start{position:fixed;bottom:24px;left:calc(50% - 36px);width:72px;height:72px;z-index:30;color:#fff;background:#10232abb}
#touch-pulse{position:fixed;z-index:35;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;color:#fff;pointer-events:none;animation:touch-pulse .8s both}
#touch-pulse svg{width:48px;height:48px}
@keyframes touch-pulse{0%{transform:scale(.65);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
@media(max-width:980px){
 #quests{grid-template-columns:repeat(6,56px);width:348px}
 #quests button:nth-child(n+7){transform:none}
 #teacher-strip{width:88px;right:4px;padding:6px;top:100px;bottom:8px}
 .teacher-grid{grid-template-columns:72px;gap:4px}
 body[data-mode=teacher] #quests{left:8px;transform:none}
 #teacher-numbers{left:8px;top:100px;font-size:18px;padding:8px}
 #teacher-class{flex-direction:column;gap:10px;padding:90px 16px 16px}
 #teacher-class>button[data-choice]{width:100%;max-width:540px;min-height:72px;flex:1;max-height:28vh}
 #teacher-class>button[data-choice] svg{height:100%;width:auto;max-width:100%}
}
@media(prefers-reduced-motion:reduce){#touch-pulse,.class-result *{animation:none!important}}
</style>

<style>
/* 29 controls, eight rows. At 720px: 8*72 + 7*4 + 20 = 624px. */
@media(min-width:981px){
 #teacher-strip{--teacher-cell:clamp(56px,calc((100dvh - 72px)/8),72px);width:calc(4 * var(--teacher-cell) + 32px);display:grid;grid-template-columns:repeat(4,var(--teacher-cell));align-content:start;gap:4px}
 #teacher-strip .teacher-grid{display:contents}
 body[data-mode=teacher] #teacher-strip button{width:var(--teacher-cell);height:var(--teacher-cell);min-width:0;min-height:0;padding:8px}
 body[data-mode=teacher] #teacher-strip svg{width:calc(var(--teacher-cell) * .47);height:calc(var(--teacher-cell) * .47)}
 body[data-mode=teacher] #quests{left:12px;transform:none;max-width:calc(100vw - 360px);flex-wrap:wrap}
}
#q-pictures>button[data-candidate]{width:250px;height:120px;padding:3px}
#q-pictures>button[data-candidate]>svg{width:100%;height:100%;stroke-width:3;fill:none}
body[data-mode=teacher] #teacher-class>button[data-choice]>svg{stroke-width:3;fill:none}
@media(max-width:980px){
 #q-pictures>button[data-candidate]{min-width:0;width:calc((100vw - 32px)/3);height:calc((100vw - 32px)*.1556);padding:2px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="quests" class="hud" aria-hidden="true"></div>
<div id="tools" class="hud"></div>
