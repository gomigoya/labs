    while (DIR.dustAcc > 1) { DIR.dustAcc--; dirDust(); }
  }
  dirCallouts(dt); dirTele(dt); dirLensFrame(dt); noteFrame();
  if (DIR.tone && AUD.ctx) { const k = DIR.grabK, f = k === 'jack' ? 150 + (S.jack.tgt - PC.jack.min) * 900 : 80 + ((S[k] && S[k].tgt) || 0) * 30; DIR.tone.o.frequency.setTargetAtTime(f, AUD.ctx.currentTime, 0.05); }
  if (PIPE.finish) PIPE.finish.uniforms.uVig.value = 0.5 + (1 - DIR.ts) * 0.6;
}

// ==== 13d 묘사 (쉬운 모드): 실험 과정·결과를 한눈에 ====
// docs/experiment-depiction.md 의 원칙을 구현한다.
//  · 돋보기 렌즈: 접촉면·물속을 교과서식 단면 도해(코드로 그린 SVG)로 열어 '보이지 않는 이유'를 보여 준다
//  · 실험 노트: 시행마다 조건(그림)과 잰 값(막대)을 한 줄씩 자동 기록 → 결과를 '비교'로 본다
//    이번에 바꾼 조건만 테두리로 강조하고, 두 개 이상 바꾸면 공정한 실험 안내
const SURF_IMG = { glass: 'micro-glass', wood: 'micro-wood', sand: 'micro-sand' };

// ---- 단면 도해: 모눈 위 선화 + 평면 채색 (실험실 계기판과 같은 시각 언어) ----
function microSVG(k) {
  const W = 200, pts = (f, x0 = -5, x1 = 205, st = 2) => { const a = []; for (let x = x0; st > 0 ? x <= x1 : x >= x1; x += st) a.push(`${x},${f(x).toFixed(1)}`); return a.join(' '); };
  const bg = `<defs><pattern id="mg" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e2e6ec" stroke-width=".7"/></pattern></defs><rect width="${W}" height="${W}" fill="#f8fafc"/><rect width="${W}" height="${W}" fill="url(#mg)"/>`;
  const grain = (y0, y1, c) => Array.from({ length: 5 }, (_, i) => { const y = y0 + (i + 0.5) * (y1 - y0) / 5; return `<path d="M-5 ${y} C 50 ${y - 3} 120 ${y + 3} 205 ${y - 1}" stroke="${c}" stroke-width="1.2" fill="none"/>`; }).join('');
  if (k === 'micro-water') {
    const arrows = (d, l) => `<path d="${d}" stroke="#0284c7" stroke-width="${l}" stroke-linecap="round" fill="none" marker-end="url(#wa)"/>`;
    return `<svg viewBox="0 0 ${W} ${W}" aria-hidden="true">${bg}<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeffa"/><stop offset="1" stop-color="#7cc4ea"/></linearGradient>
      <marker id="wa" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#0284c7"/></marker></defs>
      <rect x="20" y="58" width="160" height="150" fill="url(#wg)"/><path d="M20 58H180" stroke="#38a3d6" stroke-width="2"/>
      <path d="M100 0V74" stroke="#64748b" stroke-width="1.6"/>
      <rect x="80" y="74" width="40" height="56" rx="3" fill="#d6dae0" stroke="#64748b" stroke-width="2"/><path d="M86 80V124" stroke="#eef1f4" stroke-width="3"/>
      ${arrows('M92 50V68', 2.4)}${arrows('M108 50V68', 2.4)}
      ${arrows('M92 176V140', 3.6)}${arrows('M108 176V140', 3.6)}
      ${arrows('M52 96H72', 2.6)}${arrows('M52 112H72', 2.6)}${arrows('M148 96H128', 2.6)}${arrows('M148 112H128', 2.6)}</svg>`;
  }
  // 위: 도막(나무), 아래: 바닥. 맞닿는 선의 모양이 마찰의 크기를 말해 준다
  const blockTop = 24, line = { 'micro-glass': () => 104, 'micro-wood': (x) => 104 + 2.6 * Math.sin(x / 6.5) + 1.6 * Math.sin(x / 2.7 + 1) }[k];
  const block = (f) => `<polygon points="-5,${blockTop} 205,${blockTop} ${pts(f, 205, -5, -2)}" fill="#ecd3ad" stroke="#9a6b3d" stroke-width="2"/>${grain(blockTop + 6, 96, '#d7b689')}`;
  if (k === 'micro-sand') {
    let grit = '';
    for (let i = 0, x = 4; x < 205; i++, x += 19) {
      const h = 24 + (i * 7) % 9, w = 17 + (i * 5) % 6, c = ['#8a7a6d', '#6f6259', '#a08b7b'][i % 3];
      grit += `<polygon points="${x - w / 2},128 ${x + (i % 2 ? 2 : -2)},${128 - h} ${x + w / 2},128" fill="${c}" stroke="#463b33" stroke-width="1.6" stroke-linejoin="round"/>`;
    }
    // 알갱이 끝이 도막 밑면에 박힌다 (맞물림): 도막 밑면을 알갱이 끝보다 아래에 두고 알갱이를 위에 그린다
    const f = () => 112;
    return `<svg viewBox="0 0 ${W} ${W}" aria-hidden="true">${bg}<rect x="-5" y="128" width="210" height="22" fill="#c69a6b" stroke="#8a5f38" stroke-width="2"/><rect x="-5" y="150" width="210" height="60" fill="#e5e7eb"/>${block(f)}${grit}</svg>`;
  }
  const base = k === 'micro-glass'
    ? `<rect x="-5" y="104" width="210" height="66" fill="#d5edf3" stroke="#6aa6b8" stroke-width="2"/><path d="M14 118H70M24 126H52" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>`
    : `<polygon points="${pts(line)} 205,170 -5,170" fill="#c48b55" stroke="#7a4f27" stroke-width="2"/>${grain(112, 166, '#a7713f')}`;
  return `<svg viewBox="0 0 ${W} ${W}" aria-hidden="true">${bg}${base}<rect x="-5" y="170" width="210" height="40" fill="#e5e7eb"/>${block(line)}</svg>`;
}

// ---- 돋보기 렌즈 ----
const LENS = { cur: null };
function dirLens(at, img, col, dur = 3.4) {
  if (!dirOn()) return;
  const title = ico(img === 'micro-water' ? 'arrowU' : 'hold'); const val = () => `${fx(img === 'micro-water' ? S.hang?.B || 0 : S.F?.fsMax || 0, 2)} N`;
  const L = dirLayer('kcall');
  if (LENS.cur) { const o = LENS.cur.el; o.classList.add('out'); setTimeout(() => o.remove(), 450); }   // 새 돋보기가 열리면 이전 것은 바로 닫는다
  const el = document.createElement('div'); el.className = 'klens'; el.style.setProperty('--c', col);
  el.innerHTML = `<i class="ln"></i><i class="d"></i><div class="lw"><div class="lc">${microSVG(img)}</div><span class="ltag">${ico('eye')}</span></div><div class="lcap"><b>${title}</b><span></span></div>`;
  L.appendChild(el);
  LENS.cur = { el, at, val, t: 0, dur, side: DIR.side = -DIR.side };
  sfx('whoosh');
}
function dirLensFrame(dt) {
  const q = LENS.cur; if (!q) return;
  q.t += dt;
  if (q.t > q.dur + 0.5 || !dirOn()) { q.el.remove(); LENS.cur = null; return; }
  if (q.t > q.dur) q.el.classList.add('out');
  const R = innerWidth < 640 ? 62 : 86, p = khProj(q.at());
  const side = p.x > innerWidth * 0.62 ? -1 : p.x < innerWidth * 0.38 ? 1 : q.side;
  const top = (document.querySelector('#kid .kban')?.getBoundingClientRect().bottom || 120) + R + 14;
  const cx = clamp(p.x + side * (R + 70), R + 12, innerWidth - R - 12), cy = clamp(p.y - R - 40, top, innerHeight - R - 120);
  const dx = cx - p.x, dy = cy - p.y, d = Math.hypot(dx, dy) || 1, len = Math.max(0, d - R), ang = Math.atan2(dy, dx);
  const [ln, dot, w, cap] = q.el.children;
  ln.style.cssText = `left:${p.x}px;top:${p.y}px;width:${len}px;--a:${ang}rad`;
  dot.style.cssText = `left:${p.x}px;top:${p.y}px`;
  w.style.cssText = `left:${cx}px;top:${cy}px;--r:${R}px`;
  cap.style.cssText = `left:${cx}px;top:${cy + R + 10}px`;
  const v = q.val ? q.val() : '', s = cap.lastChild; if (s.textContent !== v) s.textContent = v;
}
// 지금 기구에 맞는 돋보기 (도구대 '돋보기' 버튼)
function lensNow() {
  if (S.station === 'balance') return;
  if (S.station === 'track') dirLens(() => V3(blockX(S.trk.x), TRK_Y + 0.004, TRK.z), SURF_IMG[S.surface], hex(FCOL.f), 4);
  else dirLens(() => LOOK.obj().clone(), 'micro-water', hex(FCOL.B), 4);
}

// ---- 실험 노트: 시행 기록과 비교 막대 ----
const NOTE = { rec: { track: [], hang: [] }, el: null, open: !matchMedia('(max-width:980px)').matches, sig: '', flash: -1 };
const NOTE_Q = new Set(['floor', 'boss', 'weights', 'moon', 'water', 'float']);   // 노트를 보여 줄 퀘스트
const NOTE_KEYS = { track: ['s', 'l'], hang: ['o', 'n', 'f', 'w', 'g'] };
function noteAdd(st, r) {
  const A = NOTE.rec[st], last = A[A.length - 1], key = (q) => NOTE_KEYS[st].map((k) => q[k]).join('|');
  if (last && key(last) === key(r)) { last.v = r.v; NOTE.flash = A.length - 1; }
  else { A.push(r); if (A.length > 6) A.shift(); NOTE.flash = A.length - 1; sfx('pick'); }
  NOTE.sig = '';
}
function noteTrack(e) { if (dirOn()) noteAdd('track', { s: S.surface, l: S.load.tgt, v: e && e.fsMax || 0 }); }
function noteHang() {
  const r = S.hang; if (!r || r.empty || S.settle < 0.5 || KH.drag) return;
  const w = r.floating ? 'float' : r.frac > 0.98 ? 'in' : r.frac < 0.02 ? 'out' : null; if (!w) return;
  noteAdd('hang', { o: S.obj, n: S.obj === 'weights' ? S.n.tgt : 0, f: w === 'out' ? '' : S.fluid, w, g: (PHYS.nearPlanet(S.g.tgt) || {}).id || 'x', v: S.Tlive });
}
function noteShown() {
  const m = KID.missions[KID.i];
  if (S.mode !== 'kid' || document.getElementById('kidIntro').classList.contains('on') || KID.phase() === 'predict' || CAM.fly) return false;
  if (S.station !== 'track' && S.station !== 'hang') return false;
  return KID.free || !!(m && NOTE_Q.has(m.id) && KID.i < KID.missions.length);
}

function setParam(name, v, fromPreset = false) {
  let [lo, hi] = PHYS.RANGE[name];
  if (name === 'jack') hi = PHYS.jackMax(hangParams(S.jack.tgt));
  let nv = clamp(v, lo, hi);
  nv = DEC[name] === 0 ? Math.round(nv) : +nv.toFixed(DEC[name] + (name === 'F1' || name === 'F2' ? 0 : 0));
  if (name === 'F1' || name === 'F2') nv = Math.round(nv * 20) / 20;
  if (nv === S[name].tgt) return;
  S[name].tgt = nv;
  if (name === 'g' || name === 'n' || name === 'jack') S.settle = 0;
  if (!fromPreset) S.preset = -1;
  if (name === 'n' || name === 'g') clampJack();
  UI.$ && UI.syncControls();
  if (!fromPreset) { S._tick = (S._tick || 0) + 1; if (S._tick % 3 === 0) sfx('tick'); }
}
function clampJack() { const jm = PHYS.jackMax(hangParams(S.jack.tgt)); if (S.jack.tgt > jm) S.jack.tgt = jm; }
function setObj(o) { if (S.obj === o) return; S.obj = o; S.settle = 0; S.preset = -1; S.jack.tgt = PC.jack.min; S.hv.v += 0.02; UI.syncControls();  }

function recordHang(r) {
  if (S.settle < 0.4) return;
  if (r.obj === 'weights' && !r.empty && !r.inFluid) {
    const n = Math.round(r.m / PC.weightMass), key = `${n}|${r.g.toFixed(1)}`;
    if (!S.rec.hooke.some((q) => q.key === key)) {
      S.rec.hooke.push({ key, n, m: r.m, g: r.g, F: r.T, x: r.x }); if (S.rec.hooke.length > 14) S.rec.hooke.shift();
      S.newRec = key; sfx('tick');
    }
  }
  if (r.obj !== 'weights') {
    const key = `${r.obj}|${r.fluid}|${r.g.toFixed(1)}|${Math.round(r.s / 0.004)}`;
    if (!S.rec.buoy.some((q) => q.key === key)) {
      S.rec.buoy.push({ key, obj: r.obj, fluid: r.fluid, g: r.g, s: r.s, frac: r.frac, T: r.T, B: r.B, W: r.W, floating: r.floating });
      if (S.rec.buoy.length > 40) S.rec.buoy.shift();
      S.newRec = key;
    }
  }
}
function recordFriction(e) {
  S.rec.fric.push({ key: `${e.surface}|${e.load}|${e.g.toFixed(1)}`, surface: e.surface, load: e.load, g: e.g, N: e.N, F: e.Fa, fsMax: e.fsMax, same: e.same });
  if (S.rec.fric.length > 10) S.rec.fric.shift();
  S.newRec = 'f' + S.rec.fric.length;
}

// Screen A: force bars and numeric readings.
function screenFrame(c, W, H) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#08141b'); g.addColorStop(1, '#050b0f');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
function drawScreenA(c, W, H) {
  screenFrame(c, W, H);
  if (S.station === 'balance' || !S.hang || !S.F) return;
  const hang = S.station === 'hang', r = S.hang, F = S.F, P = trackParams();
  const rows = hang
    ? [[-r.W, FCOL.W], [S.Tlive, FCOL.T], [r.B, FCOL.B]]
    : [[P.same ? P.F1 : -P.F1, FCOL.F], [P.F2, FCOL.F], [F.f, FCOL.f]]
      .concat(Math.abs(F.bump) > 1e-3 ? [[F.bump, FCOL.bump]] : []);
  const net = hang ? S.Tlive + r.B - r.W : F.net;
  const maxF = Math.max(3, Math.abs(net), ...rows.map(([v]) => Math.abs(v))) * 1.08;
  // Fixed number column keeps peak-force readings inside the display.
  const xm = W * 0.48, half = W * 0.30, rowH = Math.min(30, (H - 92) / (rows.length + 1));
  c.textBaseline = 'middle'; c.textAlign = 'left';
  c.font = font('mono', 17); c.fillStyle = '#bae6fd';
  c.fillText(hang ? '\u2191 +' : '\u2192 +', 14, 16);
  c.strokeStyle = 'rgba(186,230,253,0.25)'; c.beginPath(); c.moveTo(xm, 32); c.lineTo(xm, H - 34); c.stroke();
  const bar = (y, v, col, bold = false) => {
    const w = v / maxF * half;
    dot(c, 20, y, hex(col), bold ? 6 : 5);
    c.fillStyle = hex(col); c.globalAlpha = bold ? 1 : 0.85;
    c.fillRect(Math.min(xm, xm + w), y - rowH * 0.3, Math.abs(w), rowH * 0.6); c.globalAlpha = 1;
    c.font = font('mono', 16); c.textAlign = 'right'; c.fillStyle = '#e6f7ff';
    c.fillText(`${v >= 0 ? '+' : '\u2212'}${fx(Math.abs(v), 2)} N`, W - 12, y);
  };
  rows.forEach(([v, col], i) => bar(42 + i * rowH, v, col));
  const yn = 48 + rows.length * rowH;
  c.strokeStyle = 'rgba(255,255,255,0.18)'; c.beginPath(); c.moveTo(14, yn - rowH * 0.5); c.lineTo(W - 14, yn - rowH * 0.5); c.stroke();
  bar(yn, Math.abs(net) < 0.005 ? 0 : net, FCOL.net, true);
  if (!hang) {
    c.font = font('mono', 15); c.textAlign = 'left';
    dot(c, 20, H - 16, hex(FCOL.W), 4); c.fillStyle = '#e6f7ff'; c.fillText(`\u2212${fx(F.W, 2)} N \u2193`, 32, H - 16);
    dot(c, W / 2 + 6, H - 16, '#ffffff', 4); c.fillText(`+${fx(F.N, 2)} N \u2191`, W / 2 + 18, H - 16);
  }
}
function axes(c, x0, y0, x1, y1, nx, ny) {
  c.strokeStyle = 'rgba(125,211,252,0.09)'; c.lineWidth = 1;
  for (let i = 0; i <= nx; i++) { const x = x0 + (x1 - x0) * i / nx; c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke(); }
  for (let i = 0; i <= ny; i++) { const y = y0 + (y1 - y0) * i / ny; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); }
}
function dot(c, x, y, col, r = 5) { c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 8; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.shadowBlur = 0; }
function drawScreenB(c, W, H) {
  if (S.station === 'balance') { screenFrame(c,W,H); return; }
  screenFrame(c, W, H);
  const x0 = 58, x1 = W - 20, y0 = 34, y1 = H - 40;
  c.font = font('mono', 16); c.textBaseline = 'middle';
  axes(c, x0, y0, x1, y1, 5, 5);
  const reading = (t, x, y, al = 'left', col = 'rgba(186,230,253,0.75)') => { c.textAlign = al; c.fillStyle = col; c.fillText(t, x, y); };
  if (S.graph === 'hooke') {
    dot(c, 20, 14, hex(FCOL.T));
    const pts = S.rec.hooke.filter((q) => Math.abs(q.g - S.g.tgt) < 0.05);
    const X = (x) => x0 + x / 0.25 * (x1 - x0), Y = (F) => y1 - F / 5 * (y1 - y0);
    for (let i = 0; i <= 5; i++) { reading(String(i), x0 - 8, Y(i), 'right', 'rgba(186,230,253,0.55)'); reading(String(i * 5), X(i * 0.05), H - 22, 'center', 'rgba(186,230,253,0.55)'); }
    if (pts.length >= 2) { const k = PHYS.fitK(pts); glowStroke(c, 'rgba(134,239,172,0.7)', 2, 8, (c) => { c.moveTo(X(0), Y(0)); c.lineTo(X(Math.min(0.25, 5 / k)), Y(Math.min(5, 0.25 * k))); }); reading(`${fx(k, 1)}`, x0 + 12, y0 + 12, 'left', '#d9f99d'); }
    pts.forEach((q) => dot(c, X(q.x), Y(q.F), q.key === S.newRec ? '#ffffff' : '#a7f3d0'));
    const r = S.hang;
    if (r && r.obj === 'weights' && !r.empty && !r.inFluid) { c.strokeStyle = 'rgba(255,255,255,0.4)'; c.setLineDash([4, 4]); c.beginPath(); c.arc(X(S.hv.x), Y(S.Tlive), 9, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
  } else if (S.graph === 'buoy') {
    dot(c, 20, 14, hex(FCOL.B));
    const r = S.hang, obj = r && r.obj !== 'weights' ? r.obj : 'al';
    const pts = S.rec.buoy.filter((q) => q.obj === obj && q.fluid === S.fluid && Math.abs(q.g - S.g.tgt) < 0.05);
    const W0 = (PHYS.OBJECTS[obj].mass) * S.g.tgt, hcm = PC.objV / (Math.PI * PC.objR ** 2) * 100;
    const ymax = Math.max(3, W0 * 1.15), X = (s) => x0 + s / (hcm / 100) * (x1 - x0), Y = (F) => y1 - F / ymax * (y1 - y0);
    for (let i = 0; i <= 5; i++) { reading(fx(ymax * i / 5, 1), x0 - 8, Y(ymax * i / 5), 'right', 'rgba(186,230,253,0.55)'); reading(fx(hcm * i / 5, 1), X(hcm / 100 * i / 5), H - 22, 'center', 'rgba(186,230,253,0.55)'); }
    c.setLineDash([8, 6]); c.strokeStyle = 'rgba(255,179,107,0.8)'; c.beginPath(); c.moveTo(x0, Y(W0)); c.lineTo(x1, Y(W0)); c.stroke(); c.setLineDash([]);
    reading(`${fx(W0, 2)} N`, x1 - 4, Y(W0) - 12, 'right', 'rgba(255,207,154,0.95)');
    pts.sort((a, b) => a.s - b.s);
    if (pts.length > 1) glowStroke(c, 'rgba(125,211,252,0.7)', 2, 8, (c) => pts.forEach((q, i) => (i ? c.lineTo(X(q.s), Y(q.T)) : c.moveTo(X(q.s), Y(q.T)))));
    pts.forEach((q) => dot(c, X(q.s), Y(q.T), q.key === S.newRec ? '#ffffff' : '#bae6fd', 4));
    if (r && r.obj === obj) { const q = { s: r.s, T: S.Tlive }; c.strokeStyle = 'rgba(255,255,255,0.45)'; c.beginPath(); c.arc(X(q.s), Y(q.T), 8, 0, Math.PI * 2); c.stroke(); if (r.B > 0.01) reading(`+${fx(r.B, 2)} N`, x1 - 4, y1 - 14, 'right', '#bae6fd'); }
  } else {
    dot(c, 20, 14, hex(FCOL.net));
    const pts = S.rec.vt, tN = S.tTrk, span = 10;
    const vmax = Math.max(0.4, ...pts.map((p) => Math.abs(p.v))) * 1.15;
    const X = (t) => x1 - (tN - t) / span * (x1 - x0), Y = (v) => (y0 + y1) / 2 - v / vmax * (y1 - y0) / 2;
    c.strokeStyle = 'rgba(186,230,253,0.35)'; c.beginPath(); c.moveTo(x0, Y(0)); c.lineTo(x1, Y(0)); c.stroke();
    for (const v of [-vmax, 0, vmax]) reading(fx(v / 1.15, 2), x0 - 8, Y(v / 1.15), 'right', 'rgba(186,230,253,0.55)');
    glowStroke(c, 'rgba(253,230,138,0.95)', 3, 10, (c) => { let pen = false; for (const p of pts) { if (tN - p.t > span) continue; const x = X(p.t), y = Y(p.v); if (!pen) { c.moveTo(x, y); pen = true; } else c.lineTo(x, y); } });
    dot(c, x1, Y(S.trk.v), '#fff7d6', 4.5);
    reading(`${S.trk.v >= 0 ? '+' : '\u2212'}${fx(Math.abs(S.trk.v), 2)}`, x1 - 10, Y(S.trk.v) - 14, 'right', '#fff7d6');
  }
}

//  ② 한계 윤곽: 바닥이 붙잡을 수 있는 최대 힘을 점선 화살표로. 붙잡는 힘(실선)이 차오르다 넘치면 미끄러진다
//  ③ 직전 값 윤곽: 조건을 바꾸면 바꾸기 전 힘이 점선으로 남아 커졌는지 작아졌는지 겹쳐 비교

// 퀘스트·단계·기구를 바꿀 때: 이전 실험의 직전 값·잔상을 지운다
function cueReset() {

function cueTrackState(slot, snap, stable) {
  const c = CUE[slot], diff = (a, b) => Object.keys(a).some((k) => Math.abs(a[k] - b[k]) > CUE_EPS);

  setArrow(C.hT, OVL.h.T.o, UP, hb('T', S.Tlive), show && !r.empty && !r.floating);
  // ⑦ 부력 채움
  setArrow(C.hB, OVL.h.T.on ? OVL.h.T.tip : OVL.h.T.o, UP, r.B, show && r.inFluid && !r.floating && r.B > 0.03);
  // ③ 끌기: 무게·받치는 힘의 직전 값 (짐·중력을 바꿀 때)
  const still = S.trk.v === 0;
  const tb = cueTrackState('t', { W: F.W, N: F.N }, still);
  setArrow(C.tW, OVL.t.W.o, DOWN, tb('W', F.W), show);
  setArrow(C.tN, OVL.t.N.o, UP, tb('N', F.N), show);
  // ② 한계 윤곽: 붙잡는 힘이 채울 수 있는 최대
  if (CUE.mode !== 'slide' && F.mode === 'slide') CUE.flash = 1;
  CUE.mode = F.mode; CUE.flash = Math.max(0, CUE.flash - dt * 1.6);
  CUE.cap += (F.fsMax - CUE.cap) * (1 - Math.exp(-dt * 6));
  const pulling = Math.abs(F.Fa) > 0.01 || S.trk.v !== 0, fd = F.f !== 0 ? Math.sign(F.f) : -Math.sign(F.Fa || 1);
  C.cap.mat.uniforms.uGain.value = 1.1 + CUE.flash * 2.4;
  setArrow(C.cap, OVL.t.f.o, fd > 0 ? RIGHT : LEFT, CUE.cap, show && pulling && F.mode !== 'bump');
  // ④ 상쇄: 힘이 걸려 있는데 알짜힘 0, 정지
  const cancel = show && still && Math.abs(F.net) < 1e-3 && F.mode !== 'bump' && (Math.abs(F.Fa) > 0.05 || (!P.same && P.F1 > 0.05 && P.F2 > 0.05));
  const bx = blockX(S.trk.x), cy = OVL.t.net.o.y, L = 0.028 / PC.arrow;
  setArrow(C.c1, _o.set(bx - 0.044, cy, TRK.z), RIGHT, L, cancel);
  setArrow(C.c2, _o.set(bx + 0.044, cy, TRK.z), LEFT, L, cancel);
  // ⑤ 시간 기록 점
  const x = S.trk.x;
  if (CUE.lastX != null && Math.abs(x - CUE.lastX) > 0.06) for (const q of CUE.ghosts) q.age = 99;   // 제자리로 돌아감
  CUE.lastX = x;
  if (Math.abs(S.trk.v) > 0.01) {
    CUE.gT += dt;
    if (CUE.gT >= CUE_GAP) {
      CUE.gT = 0;
      const q = CUE.ghosts.reduce((a, b) => (b.age > a.age ? b : a));
      q.age = 0; q.m.position.set(bx, TRK_Y + 0.0012, TRK.z + Math.sign(S.trk.v) * (PC.block.d / 2 + 0.014));   // 오른쪽으로 갈 때 앞줄, 왼쪽은 뒷줄
    }
  } else CUE.gT = CUE_GAP;   // 출발하는 순간 바로 한 장
  for (const q of CUE.ghosts) {
    q.age += dt; const a = q.age < CUE_LIFE ? 1 - q.age / CUE_LIFE : 0;
    q.m.visible = a > 0; q.m.material.opacity = Math.min(1, a * 1.6);
  }
  // ⑥ 늘어남 계단 (지금 중력에서 잰 추 개수만)
  const on = r.obj === 'weights' && !r.inFluid, got = new Set();
  if (on) for (const q of S.rec.hooke) if (Math.abs(q.g - S.g.cur) < 0.05) got.add(q.n);
  CUE.stairs.forEach((g, n) => {
    const q = S.rec.hooke.find((e) => e.n === n && Math.abs(e.g - S.g.cur) < 0.05);
    g.visible = on && got.size > 0 && (n === 0 || !!q);
    if (g.visible) g.position.y = TOP + PC.hang.hookY0 - (q ? q.x : 0);
  });
}
