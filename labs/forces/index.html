<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>힘의 작용 — 힘이 보인다 | Lumebench</title>
<meta name="theme-color" content="#1a1511">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --warm:#ffb36b; --warm2:#ffcf9a; --cool:#7dd3fc; --cool2:#bae6fd; --violet:#c4b5fd; --green:#86efac; --red:#fca5a5; --yellow:#fde68a;
  --ink:#f4ede4; --quiet:#b9ad9f; --dim:#8a7f73;
  --glass:rgba(24,20,17,.6); --glass-line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.06);
  --mono:"DM Mono",ui-monospace,monospace; --sans:"Noto Sans KR",system-ui,sans-serif; --head:Outfit,"Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1511;color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud *{pointer-events:auto}
.hide-ui .hud,.hide-ui #labels{opacity:0;pointer-events:none!important}
.hide-ui .hud *{pointer-events:none!important}
.hud,#labels{transition:opacity .35s}

/* 좌상단 */
#left{left:28px;top:22px;width:min(390px,33vw);max-height:calc(100vh - 80px);overflow:auto;scrollbar-width:none}
#left::-webkit-scrollbar{display:none}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:12px;padding:9px 11px 8px;min-width:0}
.chip .k{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--quiet);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{font:600 23px/1.15 var(--head);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .v small{font:500 11px var(--mono);color:var(--quiet);margin-left:3px;letter-spacing:.06em}
.chip.c1 .v{color:#d9f99d} .chip.c2 .v{color:var(--cool2)} .chip.c3 .v{color:var(--yellow)}

/* 수업 카드 */
#lesson{margin-top:10px;background:rgba(18,30,38,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(125,211,252,.35);border-radius:12px;padding:12px 14px;display:none}
#lesson.on{display:block}
.tbtn{border:1px solid var(--glass-line);background:rgba(255,255,255,.06);border-radius:8px;padding:6px 10px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.tbtn:hover{border-color:var(--cool)} .tbtn.primary{background:var(--cool);color:#06202c;border-color:var(--cool)}
.tbtn:disabled{opacity:.4;cursor:default}

/* 우상단 패널 */
#panel{right:20px;top:20px;width:396px;max-height:calc(100vh - 92px);overflow:auto;scrollbar-width:thin;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:14px;padding:12px 14px 12px}
.prow{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prow:last-child{border-bottom:0;padding-bottom:2px}
.prow:first-child{padding-top:2px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--quiet);text-transform:uppercase;margin-bottom:7px}
.lab .val{color:var(--ink);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-transform:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:rgba(0,0,0,.25);border-radius:9px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 4px 6px;cursor:pointer;font:500 12px/1.2 var(--sans);color:#d9cec2;position:relative}
.seg button:hover{background:rgba(255,255,255,.06)}
.seg button[aria-pressed="true"]{background:rgba(255,179,107,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,179,107,.55)}
.seg.station button[aria-pressed="true"]{background:rgba(125,211,252,.16);box-shadow:inset 0 0 0 1px rgba(125,211,252,.6)}
.sl{display:grid;grid-template-columns:1fr;gap:2px;margin-top:9px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fill,#ffb36b) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fill,#ffb36b)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#f3f3f3;border:2px solid #2a2420;margin-top:-6px;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#f3f3f3;border:2px solid #2a2420}
input[type=range]:focus-visible{outline:2px solid var(--cool);outline-offset:2px;border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .lab{margin-bottom:2px}
.ticks{display:flex;justify-content:space-between;font:400 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.06em;margin-top:-2px}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;font:500 12px/1 var(--sans);color:#d9cec2}
.tg i{width:8px;height:8px;border-radius:50%;background:#5c544c;flex:none}
.tg[aria-pressed="true"]{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
.tg[aria-pressed="true"] i{background:var(--dot,#7dd3fc);box-shadow:0 0 8px var(--dot,#7dd3fc)}
.r3{display:flex;gap:8px;align-items:center}
.r3 .seg{flex:1}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--glass-line);background:rgba(255,255,255,.05);cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:rgba(255,255,255,.3)}
.ib[aria-pressed="true"]{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.55);color:#fff}
.ib.wide{width:auto;padding:0 10px;display:flex;gap:6px;font:500 12px/1 var(--sans)}
.speed{display:flex;align-items:center;gap:6px;margin-top:9px}
.speed .seg button{padding:6px 2px 5px;font:500 11px/1 var(--mono)}
#panelToggle{display:none}
.grp[hidden]{display:none}

/* 3D 라벨 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;background:rgba(18,15,13,.68);border:1px solid rgba(255,255,255,.12);font:500 10.5px/1.15 var(--mono);letter-spacing:.04em;color:#efe6db;white-space:nowrap;transform:translate(-50%,-50%);will-change:transform;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl i{width:7px;height:7px;border-radius:50%;flex:none}
.lbl b{font-weight:500;color:#fff}
.lbl span{color:var(--cool2);font-variant-numeric:tabular-nums}
.lbl.force{padding:2px 7px 2px 6px;font-size:10px;background:rgba(10,9,8,.55)}
.lbl.hidden{display:none}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--stem,0px);background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}

/* 하단 */
#other{right:20px;bottom:16px;display:flex;gap:8px;align-items:stretch}
#other a.card{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;padding:8px 12px 8px 8px}
#other .share{width:46px;border-radius:12px;height:auto}

/* 쉬운 모드 시작 화면 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,8,7,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{width:min(860px,100%);max-height:90vh;overflow:auto;background:#1f1a16;border:1px solid var(--glass-line);border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
/* 등장 애니메이션 */
.intro #left>*,.intro #panel,.intro #other{opacity:0;transform:translateY(8px)}
#left>*,#panel,#other{transition:opacity .7s ease,transform .7s ease}

/* 모바일 */
@media (max-width:980px){
  #left{left:14px;top:12px;width:calc(100vw - 28px);max-height:none;overflow:visible}
  #chips{gap:6px;margin-bottom:0}
  .chip{padding:6px 8px 6px;border-radius:10px}
  .chip .v{font-size:17px}
    #lesson{position:fixed;left:14px;right:14px;bottom:calc(var(--sheet,128px) + 10px);margin:0;padding:10px 12px;max-height:44vh;overflow:auto}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:16px 16px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
  #panel .more{display:none}
  #panel.open .more{display:block}
  #panelToggle{display:flex;width:100%;justify-content:center;border:0;background:none;padding:0 0 6px;cursor:pointer}
  #panelToggle i{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  #other{display:none}
  .lbl{font-size:9.5px;padding:3px 7px 3px 6px}
  .modal{padding:0}.modal .box{max-height:100vh;height:100%;border-radius:0;padding:16px}
}
@media (max-width:980px) and (orientation:landscape){
  #chips{width:60%}
  #panel{max-height:58vh}
}
@media (max-height:640px){#chips{margin-bottom:8px}}#kid,#legend,#kidhud{display:none}
body.kid #kid:empty{display:none}
#kid:has(.kwin.on) .know,#kid:has(.kwin.on) .kmine{display:none}
body.kid #panel,body.kid #chips,body.kid #lesson,body.kid #other{display:none!important}
body.kid #kid,body.kid #kidhud{display:block}
body.kid #legend{display:flex}
#kid{background:rgba(24,20,17,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 16px 12px;position:relative;margin-bottom:28px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#kid .ktag{display:inline-block;font:700 12px/1 var(--sans);color:#06202c;background:var(--cool);border-radius:999px;padding:5px 10px;letter-spacing:.02em}
#kid .ktag.boss{background:linear-gradient(90deg,#fde68a,#ffb36b);color:#2a1a0c}
#kid .khead{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
#kid .kicon{font-size:32px;line-height:1}
#kid .ktitle{font:800 23px/1.2 var(--sans);color:#fff}
#kid .ksay{font-size:16px;line-height:1.5;color:#f1e9df;margin:6px 0 8px}
#kid .ksay b{color:var(--warm2)}
#kid .kpred{background:linear-gradient(180deg,rgba(196,181,253,.16),rgba(196,181,253,.06));border:1px solid rgba(196,181,253,.45);border-radius:14px;padding:11px 12px;margin-top:6px}
#kid .kopts{display:grid;gap:8px;margin-top:10px}
#kid .kopts.n2{grid-template-columns:1fr 1fr}
#kid .kopts.n3{grid-template-columns:1fr}
.kopt{border:2px solid rgba(196,181,253,.55);background:rgba(18,15,13,.45);color:#fff;border-radius:12px;padding:11px 10px;cursor:pointer;font:700 16px/1.2 var(--sans);transition:transform .08s,background .15s}
.kopt:hover{background:rgba(196,181,253,.22)}
.kopt:active{transform:scale(.96)}
#kid .kmine{display:inline-block;font-size:13px;color:#ddd6fe;background:rgba(196,181,253,.14);border:1px solid rgba(196,181,253,.35);border-radius:999px;padding:4px 11px;margin:0 0 8px}
#kid .kmine b{color:#fff}
#kid .kmeter{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 10px;margin:2px 0 10px;font:500 14px/1.3 var(--sans);color:#efe6db}
#kid .kn{font:800 24px/1 var(--head);font-variant-numeric:tabular-nums;color:#fff}
#kid .keq{font:800 26px/1 var(--head);color:var(--yellow)}
#kid .kchk{background:rgba(0,0,0,.28);border-radius:12px;padding:8px 12px;margin:-4px 0 10px;font-size:15px}
#kid .kstairs{justify-content:space-between;padding:8px 14px}
#kid .kstl{font-size:13.5px;line-height:1.6}
#kid .kstb{display:flex;align-items:flex-end;gap:7px;height:62px}
#kid .kst{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;width:30px}
#kid .kst i{display:block;width:100%;border-radius:5px 5px 2px 2px;border:1.5px dashed rgba(255,255,255,.25)}
#kid .kst.on i{background:linear-gradient(180deg,#bbf7d0,#4ade80);border:0;box-shadow:0 0 10px rgba(134,239,172,.5)}
#kid .kst.cur i{outline:2px solid #fff;outline-offset:2px}
#kid .kst em{font:600 10.5px/1 var(--mono);font-style:normal;color:rgba(255,255,255,.55)}
#kid .kst.on em{color:#bbf7d0}
#kid .kgaugebox{flex-direction:column;align-items:stretch;gap:6px}
#kid .kgl{font-size:14px;text-align:center}
#kid .kgl2{font-size:12.5px;text-align:center;color:var(--quiet)}
#kid .kgauge{position:relative;height:16px;border-radius:9px;background:rgba(255,255,255,.08);margin:22px 4px 2px}
#kid .kgauge i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#fca5a5,#f87171);transition:width .4s}
#kid .kgauge i.ok{background:linear-gradient(90deg,#86efac,#22c55e);box-shadow:0 0 12px rgba(134,239,172,.6)}
#kid .kgauge b{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:#fde68a;border-radius:2px}
#kid .kgauge b em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--mono);font-style:normal;color:#fde68a;white-space:nowrap}
#kid .kbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:12px 10px;cursor:pointer;font:700 16px/1.25 var(--sans);transition:transform .08s,background .15s}
.kbtn:hover{background:rgba(255,255,255,.15)}
.kbtn:active{transform:scale(.96)}
.kbtn.main{background:linear-gradient(180deg,#ffcf9a,#ffb36b);color:#2a1a0c;border-color:#ffcf9a;box-shadow:0 4px 14px rgba(255,179,107,.3)}
.kbtn.main:hover{background:linear-gradient(180deg,#ffd9ad,#ffc283)}
.kbtn.sel{background:rgba(125,211,252,.22);border:2px solid var(--cool)}
.kbtn.wide{grid-column:1/-1}
#kid .kbtns.g6{grid-template-columns:repeat(6,1fr)}
#kid .kbtns.g6 .c2{grid-column:span 2;padding-left:4px;padding-right:4px}
#kid .kbtns.g6 .c3{grid-column:span 3}
#kid .kbtns .kbtn:nth-child(odd):last-child{grid-column:1/-1}
#kid .know{margin-top:10px;border-left:3px solid var(--cool);padding:2px 0 2px 10px;font-size:14.5px;line-height:1.5;color:#e6f1f7}
#kid .know span{display:block;font:600 11px/1.4 var(--sans);color:var(--cool);letter-spacing:.06em}
#kid .kwin{display:none;margin-top:10px;background:rgba(134,239,172,.13);border:1px solid rgba(134,239,172,.55);border-radius:14px;padding:10px 12px}
#kid .kwin.on{display:block;animation:kpop .35s ease}
#kid .kwin .kbtn{width:100%;background:linear-gradient(180deg,#a7f3c0,#86efac);color:#06240f;border-color:#a7f3c0}
#kid .kskip{position:absolute;right:12px;bottom:-24px;border:0;background:none;color:var(--dim);font:500 12px var(--sans);cursor:pointer}
#kid .kfinal{text-align:center}
#kid .ktro{font-size:58px;line-height:1;margin:4px 0 2px;filter:drop-shadow(0 0 18px rgba(253,230,138,.5))}
#kid .kfinal .kbtns{margin-top:10px}
#kid .kreset{margin-top:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#efe6db;border-radius:999px;padding:7px 14px;font:600 13px/1 var(--sans);cursor:pointer}
#kid .kreset:hover{background:rgba(255,255,255,.14)}
#kid .kpred.shake{animation:kshake .4s}
@keyframes kshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#kid .krocket{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font:700 12px/1.2 var(--sans);text-align:center;color:#efe6db}
#kid .krocket>span{font-size:12px;width:34px}
#kid .krk{position:relative;flex:1;height:46px;border-radius:23px;background:linear-gradient(90deg,#3b82f6,#1e1b4b 70%,#475569);cursor:grab;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
#kid .krk.drag{cursor:grabbing}
#kid .krk b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(255,255,255,.5)}
#kid .krk b.mars{background:#f87171}
#kid .krk .kr{position:absolute;top:50%;font-size:30px;font-style:normal;transform:translate(-50%,-50%) rotate(45deg);filter:drop-shadow(0 0 8px rgba(253,230,138,.7));pointer-events:none;transition:left .08s}
@keyframes kpop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
/* 위쪽 진행 지도 + 점수 */
#kidhud{position:fixed;top:12px;left:calc(50% + 200px);transform:translateX(-50%);z-index:11;white-space:nowrap}
#kidhud>*{vertical-align:middle}
#kidhud .kmap{display:inline-flex;align-items:center;background:rgba(18,15,13,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px}
#kidhud .kmap>i{width:9px;height:2px;background:rgba(255,255,255,.18)}
#kidhud .kn2{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:15px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);filter:grayscale(1);opacity:.55}
#kidhud .kn2.done{filter:none;opacity:1;border-color:#fde68a;background:rgba(253,230,138,.16)}
#kidhud .kn2.cur{filter:none;opacity:1;border-color:#fff;background:rgba(255,255,255,.18);transform:scale(1.18);box-shadow:0 0 0 3px rgba(125,211,252,.35);animation:kbob 1.4s ease-in-out infinite}
#kidhud .kn2.boss{width:32px;height:32px;font-size:17px}
#kidhud .kn2 em{position:absolute;right:-5px;top:-6px;font-size:10px;font-style:normal}
@keyframes kbob{50%{transform:scale(1.18) translateY(-2px)}}
#kidhud .ksnd{margin-left:6px;border:1px solid rgba(255,255,255,.16);background:rgba(18,15,13,.6);color:#efe6db;border-radius:999px;padding:7px 11px;font:600 12px/1 var(--sans);cursor:pointer}
body.kid #modeBtn{top:auto;bottom:14px;left:286px;right:auto;transform:none;padding:9px 14px}
#kfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
#kpop{position:fixed;left:calc(50% + 200px);top:26%;transform:translate(-50%,0);z-index:24;pointer-events:none;opacity:0}
#kpop.on{animation:kcard 2.6s ease forwards}
@keyframes kcard{0%{opacity:0;transform:translate(-50%,10px) scale(.7) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,0) scale(1.06) rotate(1deg)}20%{transform:translate(-50%,0) scale(1) rotate(0)}82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
#kpop .kpcard{width:230px;text-align:center;background:linear-gradient(180deg,#2a231d,#1a1512);border:2px solid var(--c);border-radius:16px;padding:14px 16px 16px;box-shadow:0 0 28px -6px var(--c),0 18px 50px rgba(0,0,0,.5)}
/* 힘 카드 모음 (화면 아래) */
#legend{position:fixed;right:16px;bottom:14px;z-index:10;gap:6px 12px;flex-wrap:wrap;justify-content:center;max-width:min(800px,calc(100vw - 500px));background:rgba(18,15,13,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:7px 14px;font:500 12.5px/1.3 var(--sans);color:#efe6db}
#modeBtn{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:11;border:1px solid rgba(255,255,255,.18);background:rgba(18,15,13,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#efe6db;border-radius:999px;padding:7px 14px;font:600 12.5px/1 var(--sans);cursor:pointer}
#modeBtn:hover{border-color:var(--warm)}
.hide-ui #modeBtn,.hide-ui #legend,.hide-ui #kidhud{opacity:0;pointer-events:none}
#kidIntro .box{width:min(580px,100%);padding:26px 30px}
#kidIntro .kstart{width:100%;font-size:20px;padding:16px}
@media (max-height:780px) and (min-width:981px){
  #kid{padding:10px 14px 10px} #kid .ksay{font-size:15px;margin:4px 0 6px} .kbtn{padding:10px 8px;font-size:15px} .kopt{padding:9px 8px;font-size:15px}
  #kid .kmeter{padding:6px 10px;margin:2px 0 8px} #kid .khead{margin:6px 0 2px} #kid .kicon{font-size:28px} #kid .ktitle{font-size:21px} #kid .know{font-size:14px;margin-top:8px}
}
@media (max-height:680px) and (min-width:981px){#kid .ksay{font-size:14.5px} }
@media (max-width:980px){
  body.kid #kid{position:fixed;left:10px;right:10px;bottom:10px;max-height:58vh;overflow:auto;margin:0}
  #legend{display:none!important}
  #kidhud{left:8px;right:8px;transform:none;top:52px;display:flex!important;justify-content:center;gap:6px}
  body:not(.kid) #kidhud{display:none!important}
  #kidhud .ksnd{display:none}
  #kidhud .kmap{padding:4px 6px}
  #kidhud .kn2{width:21px;height:21px;font-size:11.5px;border-width:1px}
  #kidhud .kn2.boss{width:24px;height:24px;font-size:13px}
  #kidhud .kn2.cur{transform:scale(1.12)}
  #kidhud .kmap>i{width:2px}
  body.kid #modeBtn{top:auto;bottom:calc(58vh + 18px);left:auto;right:10px}
  #kpop{left:50%;top:14%}
  #kid .ktitle{font-size:19px} #kid .ksay{font-size:15px} .kbtn{padding:11px 8px;font-size:15px}
  #kid .kskip{position:static;display:block;margin:8px 0 0 auto}
}

/* ===== 쉬운 모드 UI: 디지털 교과서 (흰 카드 + 남색 강조, 측정값은 어두운 계기판) ===== */
:root{--kbg:#fff;--kbg2:#f4f5f9;--kline:rgba(17,24,39,.09);--ktx:#111827;--ksub:#5b6475;--kacc:#4f46e5;--kacc-d:#4338ca;--kacc2:#eef0ff;--kok:#16a34a;--kok2:#e9f8ee;--kgold:#f5b301;--kpull:#6d5ce8;--kglass:rgba(15,18,26,.76);--kshadow:0 1px 2px rgba(16,24,40,.06),0 14px 36px -10px rgba(16,24,40,.38);--kfont:'Noto Sans KR',system-ui,sans-serif;--knum:'Outfit','Noto Sans KR',sans-serif}
body.kid #left{display:none!important}
body.kid #kid{position:fixed!important;inset:0!important;max-height:none!important;overflow:visible!important;margin:0!important;padding:0;background:none;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;z-index:12;font-family:var(--kfont);color:var(--ktx)}
#kid,#kidIntro,#khandles,#kidhud,#legend,#kpop{word-break:keep-all;overflow-wrap:anywhere}
#kid>*{pointer-events:auto}
.ki{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
.ki.f{fill:currentColor;stroke:none}
.ksw{display:inline-block;width:1em;height:1em;border-radius:.24em;box-shadow:inset 0 0 0 1px rgba(17,24,39,.16)}
.ksw.glass{background:linear-gradient(135deg,#eaf7ff 0%,#bfe4f8 42%,#f6fcff 52%,#a7d5ee 100%)}
.ksw.wood{background:repeating-linear-gradient(100deg,#c38c57 0 3px,#a8733f 3px 5px,#cf9c68 5px 9px)}
.ksw.sand{background:radial-gradient(circle at 25% 30%,#6b4527 1px,transparent 1.6px) 0 0/5px 5px,radial-gradient(circle at 70% 65%,#4e311b 1px,transparent 1.6px) 0 0/6px 6px,#a06e45}

/* 공통 표면 */
#kid .kban,#kid .kbox,#kidIntro .box{background:var(--kbg);border:1px solid var(--kline);border-radius:20px;box-shadow:var(--kshadow);color:var(--ktx)}
#kid .keye,#kidIntro .keye{display:flex;align-items:center;gap:7px;font:700 12px/1 var(--kfont);letter-spacing:.06em;color:var(--kacc);text-transform:uppercase}
#kid .keye i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55}
body.kid .kbtn,#kidIntro .kbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--kline);background:#fff;color:var(--ktx);font:600 15px/1 var(--kfont);box-shadow:0 1px 2px rgba(16,24,40,.06);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
body.kid .kbtn:hover,#kidIntro .kbtn:hover{background:var(--kbg2)}
body.kid .kbtn:active,#kidIntro .kbtn:active{transform:scale(.98)}
body.kid .kbtn.main,#kidIntro .kbtn.main{background:var(--kacc);border-color:var(--kacc);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.1),0 8px 18px -8px rgba(79,70,229,.7)}
body.kid .kbtn.main:hover,#kidIntro .kbtn.main:hover{background:var(--kacc-d)}

/* ---- 위: 퀘스트 카드 ---- */
#kid .kban{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:max-content;min-width:min(440px,calc(100vw - 32px));max-width:min(640px,calc(100vw - 32px));display:flex;align-items:flex-start;gap:14px;padding:14px 14px 14px 14px;animation:kin .35s cubic-bezier(.2,.9,.3,1)}
#kid .kbtxt{flex:1;min-width:0}
#kid .kban.boss .keye{color:#c2410c}
#kid .ktitle{display:flex;align-items:center;gap:8px;margin-top:6px;font:700 20px/1.3 var(--kfont);letter-spacing:-.01em;color:var(--ktx)}
#kid .kskip{position:static;right:auto;bottom:auto;flex:none;display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--ksub);font:500 13px/1 var(--kfont);padding:4px 2px;cursor:pointer;white-space:nowrap}
#kid .kskip:hover{color:var(--ktx)}
#kid .ksteps{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#kid .kstep{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:12px;background:var(--kbg2)}
#kid .kstep em{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--kacc);color:#fff;font:700 11px/1 var(--knum);font-style:normal}
#kid .kso{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--kline);font-size:18px;color:var(--ktx)}
#kid .kso.pull{color:var(--kpull)}
#kid .kso .ksw{width:18px;height:18px}
#kid .ksa{display:inline-grid;font-size:20px;color:var(--kacc)}
#kid .ksa.R{animation:knR 1.6s ease-in-out infinite}
#kid .ksa.L{animation:knL 1.6s ease-in-out infinite}
#kid .ksa.U{animation:knU 1.6s ease-in-out infinite}
#kid .ksa.D{animation:knD 1.6s ease-in-out infinite}
#kid .ksa.tap{animation:knT 1.3s ease-in-out infinite}
@keyframes knR{0%,100%{transform:translateX(-2px)}50%{transform:translateX(4px)}}
@keyframes knL{0%,100%{transform:translateX(2px)}50%{transform:translateX(-4px)}}
@keyframes knU{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
@keyframes knD{0%,100%{transform:translateY(-2px)}50%{transform:translateY(4px)}}
@keyframes knT{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
#kid .kban .ksay,#kid .kfoot .know{display:none}

/* ---- 아래: 측정 계기판 (어두운 유리) ---- */
#kid .kfoot{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;gap:8px}
#kid .kfoot .krow{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
#kid .kfoot .kmeterbox{display:flex;flex-direction:column;gap:6px}
#kid .kfoot .kmeter,#kid .kfoot .kchk,#kid .kfoot .kmine,#kid .kfoot .kreset,#kid .kfoot .krocket{margin:0;background:var(--kglass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.1);border-radius:14px;color:#e8eaf0;box-shadow:0 10px 26px -10px rgba(0,0,0,.6)}
#kid .kfoot .kmeter{padding:10px 16px;font:500 14px/1.3 var(--kfont);gap:12px}
#kid .kfoot .kchk{padding:8px 14px;font:500 13.5px/1.4 var(--kfont)}
#kid .kn{font:700 22px/1 var(--knum);font-variant-numeric:tabular-nums;color:#fff}
#kid .keq{font:600 20px/1 var(--knum);color:#fde68a}
#kid .kfoot .kmine{display:flex;align-items:center;gap:8px;padding:0 14px;font:500 12.5px/1 var(--kfont);color:#a9afbd}
#kid .kfoot .kmine .ki,#kid .kfoot .kmine .kpt{font-size:20px;color:#c4b5fd}
#kid .kfoot .kmine .kpt{font:700 18px/1 var(--knum)}
#kid .kfoot .kmine .ksw{width:20px;height:20px}
#kid .kfoot .kreset{display:flex;align-items:center;gap:6px;padding:0 14px;font:500 13px/1 var(--kfont);cursor:pointer}
#kid .kfoot .kreset:hover{background:rgba(30,34,46,.88)}
#kid .kfoot .krocket{display:flex;align-items:center;gap:12px;width:min(460px,100%);padding:6px 16px;font-size:22px;color:#cbd5e1}
#kid .krk{position:relative;flex:1;height:36px;background:none;border:0;box-shadow:none;border-radius:0;cursor:grab;touch-action:none}
#kid .krk::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:linear-gradient(90deg,#60a5fa,#94a3b8)}
#kid .krk b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff}
#kid .krk b.mars{background:#f87171}
#kid .krk .kr{position:absolute;top:50%;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--kpull);font-size:15px;transform:translate(-50%,-50%);filter:none;box-shadow:0 0 0 3px var(--kpull),0 4px 10px rgba(0,0,0,.45)}

/* ---- 가운데 창 (예상·퀴즈·결과) ---- */
#kid .kmodal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,12,20,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#kid .kbox{position:relative;width:min(560px,100%);max-height:calc(100vh - 96px);overflow:auto;padding:22px;text-align:left;animation:kpop2 .32s cubic-bezier(.2,.9,.3,1.12)}
#kid .kmh{display:flex;align-items:center;gap:12px;margin-bottom:18px}
#kid .kmh>div{flex:1;min-width:0}
#kid .kpred{margin:0}
#kid .kopts{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;margin:0}
#kid .kopts.n2{--n:2}
#kid .kopt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:132px;padding:16px 10px 14px;border-radius:16px;border:1.5px solid var(--kline);background:#fff;color:var(--ktx);font:inherit;text-align:center;cursor:pointer;box-shadow:none;transition:border-color .15s,box-shadow .15s,transform .15s}
#kid .kopt:hover{border-color:var(--kacc);box-shadow:0 0 0 4px var(--kacc2);transform:translateY(-2px)}
#kid .kopt:active{transform:translateY(0) scale(.98)}
#kid .kpic{display:grid;place-items:center;height:52px;font-size:46px;color:var(--kacc)}
#kid .kpic .ksw{width:46px;height:46px;border-radius:12px}
#kid .kpt{font:700 34px/1 var(--knum);color:var(--kacc)}
#kid .kpred.shake{animation:kshake .4s}

/* ---- 미션 성공 (아래 띠) ---- */
#kid .kwin{display:none!important;position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));margin:0;padding:0;background:none;border:0}
#kid .kwin.on{display:block!important;animation:kup .35s cubic-bezier(.2,.9,.3,1.1)}
#kid .kwin .kbox{width:100%;max-height:none;overflow:hidden;padding:14px 16px 16px;animation:none}
#kid:has(.kwin.on) .kfoot{display:none}
#kid .kstars{display:inline-flex;gap:2px;margin:0;font-size:18px;color:#e2e5ea}
#kid .kstars i{display:inline-grid;width:auto;height:auto;background:none;clip-path:none;filter:none}
#kid .kstars i.on{color:var(--kgold);animation:kstar2 .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes kstar2{from{transform:scale(0)}to{transform:none}}
#kid .kwin .kgo{width:auto;margin:0;padding:0 18px}
#kid .kauto{position:absolute;left:0;right:0;bottom:0;height:3px;margin:0;background:none;overflow:hidden}
#kid .kauto div{height:100%;border:0;border-radius:0;background:none}
#kid .kauto i{display:block;height:100%;width:0;background:var(--kacc)}
@keyframes kauto{from{width:0}to{width:100%}}

/* ---- 최종 결과 ---- */
#kid .kfinal{text-align:center}
#kid .ktro{display:grid;place-items:center;width:72px;height:72px;margin:2px auto 12px;border-radius:50%;background:#fff5d6;color:#d99a00;font-size:36px;filter:none}
#kid .ktro::before{display:none}
#kid .kfinal .kbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}

/* ---- 위 HUD: 진행·점수·소리 ---- */
body.kid #kidhud{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-family:var(--kfont)}
#kidhud .kprog,#kidhud .ksnd{height:40px;margin:0;background:rgba(255,255,255,.95);border:1px solid var(--kline);border-radius:12px;box-shadow:0 6px 18px -6px rgba(16,24,40,.45)}
#kidhud .kprog{display:flex;align-items:center;gap:10px;padding:0 14px}
#kidhud .kpn{font:500 13px/1 var(--knum);color:var(--ksub);white-space:nowrap}
#kidhud .kpn b{font-size:16px;font-weight:700;color:var(--ktx)}
#kidhud .kseg{display:flex;gap:3px}
#kidhud .kseg i{width:14px;height:6px;border-radius:3px;background:#e5e7eb;transition:width .3s,background .3s}
#kidhud .kseg i.cur{width:26px;background:var(--kacc)}
#kidhud .kseg i.boss{background:#fde3b5}
#kidhud .kseg i.boss.cur{background:#f59e0b}
#kidhud .ksnd{display:grid;place-items:center;width:40px;padding:0;color:var(--ksub);font-size:18px;cursor:pointer}
#kidhud .ksnd:hover{color:var(--kacc)}

/* ---- 새 힘 카드 ---- */
#kpop{left:50%!important;top:18%!important}
#kpop .kpcard{width:260px;padding:0 0 16px;overflow:hidden;text-align:center;background:#fff;border:1px solid var(--kline);border-radius:18px;box-shadow:var(--kshadow)}
#kpop .kpcard::before{content:"";display:block;height:6px;background:var(--c)}

/* ---- 아래 힘 카드 모음 ---- */
body.kid #legend{align-items:center;gap:6px 8px;background:rgba(255,255,255,.95);border:1px solid var(--kline);border-radius:14px;box-shadow:0 6px 18px -6px rgba(16,24,40,.45);backdrop-filter:none;-webkit-backdrop-filter:none;padding:8px 12px;font:500 12.5px/1.3 var(--kfont);color:var(--ktx)}

/* ---- 시작 화면 ---- */
#kidIntro .box{position:relative;width:min(520px,100%);margin:0;padding:28px 28px 20px;text-align:center;font-family:var(--kfont)}
#kidIntro .keye{justify-content:center}
#kidIntro .kitiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
#kidIntro .kitile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border:0;border-radius:14px;background:var(--kbg2);box-shadow:none}
#kidIntro .kstart{width:100%;height:52px;font-size:17px}

/* ---- 장면 속 손잡이 ---- */
#khandles{position:fixed;inset:0;pointer-events:none;z-index:11;transition:opacity .25s;font-family:var(--kfont)}
#khandles.off{opacity:0}
#khandles.off *{pointer-events:none!important}
body:not(.kid) #khandles{display:none}
.khrail .khbar{position:absolute;height:8px;transform-origin:0 50%;border-radius:4px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(17,24,39,.18),0 2px 8px rgba(0,0,0,.4)}
.khrail .khfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#a78bfa,var(--kpull))}
.khrail.water .khfill{background:linear-gradient(90deg,#7dd3fc,#2563eb)}
.khtick{position:absolute;top:calc(100% + 3px);width:1.5px;height:5px;margin-left:-.75px;background:rgba(255,255,255,.9)}
.khtick em{position:absolute;top:7px;left:50%;transform:translateX(-50%);font:600 11.5px/1 var(--knum);font-style:normal;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.khbar.flip .khtick em{transform:translateX(-50%) rotate(180deg)}
.khgoal{position:absolute;bottom:calc(100% + 2px);margin-left:-3px;font-size:18px;line-height:1;color:var(--kgold);filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.khbar.flip .khgoal{transform:rotate(180deg) translateY(-100%)}
.khknob{position:absolute;display:grid;place-items:center;width:48px;height:48px;margin:-24px 0 0 -24px;padding:0;border:0;border-radius:50%;background:#fff;color:var(--kpull);font-size:20px;box-shadow:0 0 0 3px var(--kpull),0 6px 16px rgba(0,0,0,.45);cursor:grab;touch-action:none;pointer-events:auto;transition:transform .12s,box-shadow .12s}
.khknob::before{content:"";position:absolute;inset:-14px;border-radius:50%}
.khknob:hover{transform:scale(1.06)}
.khrail.drag .khknob{cursor:grabbing;transform:scale(1.1);box-shadow:0 0 0 3px var(--kpull),0 0 0 10px rgba(109,92,232,.28),0 8px 20px rgba(0,0,0,.45)}
.khrail.water .khknob{color:#2563eb;box-shadow:0 0 0 3px #2563eb,0 6px 16px rgba(0,0,0,.45)}
#khandles.fresh .khrail.force .khknob{animation:khp 1.6s ease-out infinite}
#khandles.fresh .khrail.water .khknob{animation:khpw 1.6s ease-out infinite}
@keyframes khp{0%{box-shadow:0 0 0 3px var(--kpull),0 0 0 3px rgba(255,255,255,.75),0 6px 16px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 3px var(--kpull),0 0 0 20px rgba(255,255,255,0),0 6px 16px rgba(0,0,0,.45)}}
@keyframes khpw{0%{box-shadow:0 0 0 3px #2563eb,0 0 0 3px rgba(255,255,255,.75),0 6px 16px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 3px #2563eb,0 0 0 20px rgba(255,255,255,0),0 6px 16px rgba(0,0,0,.45)}}
.khval{position:absolute;transform:translate(-50%,-62px);padding:6px 9px;border-radius:8px;background:rgba(17,24,39,.92);color:#fff;font:700 15px/1 var(--knum);white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.khval::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(17,24,39,.92)}
.khval:empty{display:none}
.khrail.drag .khval{background:var(--kpull)}
.khrail.drag .khval::after{border-top-color:var(--kpull)}
.khghost{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.22);pointer-events:none;opacity:0;z-index:2}
#khandles.fresh .khghost{animation:khghost 2s ease-in-out infinite}
.khrail.drag .khghost{display:none}
@keyframes khghost{0%{opacity:0;transform:translate(0,0) scale(1.15)}15%{opacity:1;transform:translate(0,0) scale(.9)}75%{opacity:1;transform:translate(var(--gx),var(--gy)) scale(.9)}100%{opacity:0;transform:translate(var(--gx),var(--gy)) scale(1)}}
.khpick,.khstep{position:absolute;display:flex;align-items:center;gap:4px;padding:5px;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border:1px solid var(--kline);border-radius:14px;box-shadow:0 10px 26px -8px rgba(0,0,0,.6);pointer-events:auto}
.khpick button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:58px;padding:7px 6px 6px;border:0;border-radius:10px;background:none;color:var(--ksub);font:600 11.5px/1 var(--kfont);cursor:pointer;transition:background .15s}

/* ===== 연출 층 (68-director.js) ===== */
/* 레터박스: 결정적 순간·타이틀·시작 화면 */
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#05060a;z-index:14;pointer-events:none;transition:height .7s cubic-bezier(.65,0,.2,1)}
body::before{top:0} body::after{bottom:0}
body.kid.kbars::before,body.kid.kbars::after{height:8vh}
/* 타이틀 카드: 눈썹 글이 올라오고, 제목이 왼쪽부터 닦여 나오고, 밑줄이 그어진 뒤 위로 빠진다 */
#ktc{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;opacity:0;background:radial-gradient(ellipse 60% 45% at center,rgba(5,6,12,.62),rgba(5,6,12,0) 70%);font-family:var(--kfont)}
body:not(.kid) #ktc{display:none}
#ktc.on{animation:ktcFade 2.15s ease forwards}
#ktc .in{text-align:center;color:#fff;padding:0 24px}
#ktc .e{font:700 13px/1 var(--kfont);letter-spacing:.26em;text-transform:uppercase;color:#c7d2fe;opacity:0;transform:translateY(10px)}
#ktc .t{margin-top:16px;font:800 clamp(30px,5.2vw,58px)/1.15 var(--kfont);letter-spacing:-.025em;word-break:keep-all;text-shadow:0 6px 40px rgba(0,0,0,.6);clip-path:inset(-10% 100% -10% 0)}
#ktc .l{display:block;width:0;height:2px;margin:20px auto 0;background:linear-gradient(90deg,transparent,#a5b4fc,transparent)}
#ktc.on .e{animation:ktcUp .55s .12s cubic-bezier(.2,.8,.2,1) forwards}
#ktc.on .t{animation:ktcWipe .75s .28s cubic-bezier(.75,0,.2,1) forwards}
#ktc.on .l{animation:ktcLine .9s .6s cubic-bezier(.2,.8,.2,1) forwards}
#ktc.on .in{animation:ktcOut .45s 1.65s cubic-bezier(.6,0,.4,1) forwards}
@keyframes ktcFade{0%{opacity:0}7%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes ktcUp{to{opacity:1;transform:none}}
@keyframes ktcWipe{to{clip-path:inset(-10% 0 -10% 0)}}
@keyframes ktcLine{to{width:min(320px,60vw)}}
@keyframes ktcOut{to{transform:translateY(-28px) scale(.97);opacity:0}}
/* 컷 동안 화면 UI는 잠시 비켜 있다가 들어온다 */
#kid>*{transition:opacity .45s ease}
body.kcut #kid>*,body.kcut #khandles{opacity:0!important;pointer-events:none!important}
/* 슬로 모션 표시 (중계 화면의 리플레이 표식) */
#kslow{position:fixed;left:12px;bottom:var(--kslow-bottom,100px);z-index:16;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(10,12,20,.78);color:#fff;font:700 12px/1 var(--knum);letter-spacing:.12em;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none}
#kslow svg{width:24px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.kid.kslow #kslow{opacity:1;transform:none}
/* 해설선 */
#kcall{position:fixed;inset:0;z-index:11;pointer-events:none;font-family:var(--kfont)}
.kco .d{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 18px var(--c);animation:kcoDot .4s cubic-bezier(.2,1.7,.4,1) both}
.kco .d::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);animation:kcoPing 1.3s .2s ease-out infinite}
.kco .ln{position:absolute;height:2px;margin-top:-1px;transform-origin:0 50%;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.55);transform:rotate(var(--a)) scaleX(0);animation:kcoLine .38s .18s cubic-bezier(.3,0,.2,1) forwards}
.kco .bx{position:absolute;transform:translate(var(--bx),-50%);padding:9px 13px 10px;border-radius:12px;background:rgba(12,14,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--c);color:#fff;white-space:nowrap;opacity:0;clip-path:inset(0 100% 0 0);animation:kcoBox .45s .48s cubic-bezier(.3,0,.2,1) forwards;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.kco .bx b{display:block;font:700 15px/1.2 var(--kfont)}
.kco .bx span{display:block;margin-top:4px;font:700 14px/1 var(--knum);color:var(--c);font-variant-numeric:tabular-nums}
.kco.out{opacity:0;transition:opacity .4s}
@keyframes kcoDot{from{transform:scale(0)}to{transform:none}}
@keyframes kcoPing{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
@keyframes kcoLine{to{transform:rotate(var(--a)) scaleX(1)}}
@keyframes kcoBox{to{opacity:1;clip-path:inset(0 0 0 0)}}
/* 원격 측정 그래프 */

#kid .kfoot .kmeter{flex-wrap:wrap;justify-content:center;row-gap:4px}

/* 고르기 버튼 그림 */
.ksw.al{background:linear-gradient(135deg,#f5f6f8,#a3a9b4 55%,#e6e8ec)}

.khpick button.on .ki{color:var(--kacc)}
@media (max-width:980px){

body.kid .lbl.force{padding:4px 10px 4px 8px;gap:6px;font:600 12px/1.2 var(--kfont);letter-spacing:0;background:rgba(12,14,22,.78);border-color:rgba(255,255,255,.14)}

/* ===== 묘사 층 (69-depict.js) ===== */
/* 돋보기 렌즈: 점 → 선 → 원이 홍채처럼 열리고, 그림은 천천히 다가온다 */
.klens{position:absolute;inset:0;pointer-events:none;--c:#a5b4fc}
.klens .d{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 16px var(--c);animation:kcoDot .35s cubic-bezier(.2,1.7,.4,1) both}

.klens .lw{position:absolute;width:calc(var(--r) * 2);height:calc(var(--r) * 2);margin:calc(var(--r) * -1) 0 0 calc(var(--r) * -1);border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--c),0 24px 50px -12px rgba(0,0,0,.75);clip-path:circle(0% at 50% 50%);animation:klIris .55s .35s cubic-bezier(.2,.8,.2,1) forwards}
.klens .lc{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#f8fafc}
.klens .lc svg{display:block;width:100%;height:100%;transform:scale(1.22);animation:klZoom 4.2s .35s cubic-bezier(.2,.6,.2,1) forwards}
.klens .lov{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:klFade .5s 1s forwards;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.klens .ltag{position:absolute;left:50%;top:-12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:#fff;color:var(--ktx);font:700 11px/1 var(--kfont);white-space:nowrap;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}

/* 실험 노트 */

<script type="module">

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { Line2 } from 'three/addons/lines/Line2.js';

// ==== 1 PHYSICS ====
// 힘의 작용: 매달기대(무게·탄성력·부력)와 끌기대(당기는 힘·마찰력·수직항력·알짜힘)의 순수 함수 모듈.
// 모든 길이는 콘솔 상판(TOP) 기준 m, 힘은 N, 질량은 kg. 화면의 숫자·위치·화살표 길이는 전부 여기서 나온다.
const PHYS = (() => {
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const BALANCE = Object.freeze({ MAX_CLIPS: 60, spacing: 0.06, K: 0.0337, thetaMax: Math.PI / 9,
    masses: Object.freeze({ a: 10, b: 20, c: 30, d: 40, e: 50 }) });
  const balanceSide = (p = {}) => ({
    obj: Object.hasOwn(BALANCE.masses, p.obj) ? p.obj : null,
    clips: clamp(Math.round(Number(p.clips) || 0), 0, BALANCE.MAX_CLIPS),
    pos: clamp(Math.round(Number.isFinite(Number(p.pos)) && p.pos != null ? Number(p.pos) : 5), 1, 5),
  });
  function balance({ left, right, g = 9.8 }) {
    const L = balanceSide(left), R = balanceSide(right);
    const momentL = ((BALANCE.masses[L.obj] || 0) + L.clips) * L.pos;
    const momentR = ((BALANCE.masses[R.obj] || 0) + R.clips) * R.pos;
    const tau = 0.001 * g * BALANCE.spacing * (momentR - momentL);
    const level = Math.abs(tau) <= 0.5 * 0.001 * 9.8 * BALANCE.spacing;
    return { tau, thetaTarget: clamp(Math.atan(tau / BALANCE.K), -BALANCE.thetaMax, BALANCE.thetaMax),
      level, heavier: level ? null : tau > 0 ? 'R' : 'L', momentL, momentR };
  }
  function beamStep(state, thetaTarget, dt) {
    let { theta, omega } = state;
    const sub = Math.max(1, Math.ceil(Math.max(0, dt) / 0.004)), h = Math.max(0, dt) / sub;
    for (let i = 0; i < sub; i++) {
      omega += (-36 * (theta - thetaTarget) - 4.2 * omega) * h;
      theta += omega * h;
      if (Math.abs(theta) > BALANCE.thetaMax) { theta = clamp(theta, -BALANCE.thetaMax, BALANCE.thetaMax); if (theta * omega > 0) omega = 0; }
      if (Math.abs(theta - thetaTarget) < 0.0005 && Math.abs(omega) < 0.002) { theta = thetaTarget; omega = 0; }
    }
    return { theta, omega };
  }
  const C = {
    kHang: 20,          // 매달기 용수철저울 용수철 상수 N/m (눈금 0~5 N, 최대 25 cm 늘어남)
    hangMax: 5,
    kTrack: 40,         // 끌기 저울 N/m (눈금 0~6 N, 최대 15 cm)
    trackMax: 6,
    arrow: 0.045,       // 힘 화살표 길이 m/N (과장 스케일: 표현용)
    weightMass: 0.05,   // 황동 추 한 개 50 g
    brass: 8400,        // 황동 밀도 kg/m³
    weightR: 0.02,
    objR: 0.025, objV: 100e-6,          // 원기둥 100 cm³, 반지름 2.5 cm
    M0: 0.30,           // 나무 도막 질량 kg
    loadMass: 0.2,      // 짐 추 한 개 200 g
    nMax: 5, loadMax: 3,
    block: { w: 0.10, h: 0.06, d: 0.08 },
    load: { r: 0.022, h: 0.0157 },
    track: { xmin: -0.10, xmax: 1.00, x0: 0.45, y: 0.025 },
    beaker: { R: 0.07, glass: 0.006, water: 0.13, height: 0.22 },
    hang: { casingTop: 0.84, casing: 0.30, hookY0: 0.51, string: 0.04 },
    jack: { min: 0.03, max: 0.31 },
    gMin: 1.0, gMax: 10.0,
  };
  const OBJECTS = {
    weights: { density: 8400 },
    al: { mass: 0.27, density: 2700 },
    wood: { mass: 0.06, density: 600 },
  };
  const FLUIDS = { water: 1000, brine: 1200, oil: 920 };
  const SURFACES = { glass: { mus: 0.25, muk: 0.18 }, wood: { mus: 0.45, muk: 0.35 }, sand: { mus: 0.80, muk: 0.62 } };
  const PLANETS = [{ id: 'moon', g: 1.6 }, { id: 'mars', g: 3.7 }, { id: 'earth', g: 9.8 }];
  const RANGE = { g: [C.gMin, C.gMax], n: [0, C.nMax], jack: [C.jack.min, C.jack.max], F1: [0, C.trackMax], F2: [0, C.trackMax], load: [0, C.loadMax] };

  const planetOf = (g) => PLANETS.reduce((b, p) => (Math.abs(p.g - g) < Math.abs(b.g - g) ? p : b)).id;
  const nearPlanet = (g) => PLANETS.find((p) => Math.abs(p.g - g) < 0.05);

  // 매단 물체의 질량·부피·모양
  function hangObject(obj, n) {
    if (obj === 'weights') {
      const m = n * C.weightMass, V = m / C.brass, A = Math.PI * C.weightR ** 2;
      return { obj, m, V, A, r: C.weightR, h: V / A, density: C.brass, empty: n === 0 };
    }
    const o = OBJECTS[obj], A = Math.PI * C.objR ** 2;
    return { obj, m: o.mass, V: C.objV, A, r: C.objR, h: C.objV / A, density: o.mass / C.objV, empty: false };
  }

  // 매달기 평형: 줄 장력(= 탄성력 = 저울 눈금) T, 잠긴 깊이 s를 함께 푼다.
  //   T = W − ρgAs,  늘어남 x = T/k,  물체 바닥 y_b = y_b0 − x,  수면 y_w = y_w0 + A·s/A_b (물체가 밀어낸 만큼 수면 상승)
  //   s = clamp(y_w − y_b, 0, h)  →  s·(1 − A/A_b + ρgA/k) = y_w0 − y_b0 + W/k  (구간별 선형이라 닫힌 해)
  function hang(p) {
    const o = hangObject(p.obj, p.n), g = p.g, rho = FLUIDS[p.fluid], k = C.kHang;
    const Ab = Math.PI * C.beaker.R ** 2;
    const W = o.m * g;
    const yTop0 = C.hang.hookY0 - C.hang.string, yb0 = yTop0 - o.h;
    const beakerY = p.jack, yw0 = beakerY + C.beaker.glass + C.beaker.water;
    if (o.empty) return { ...o, g, rho, W: 0, B: 0, T: 0, x: 0, s: 0, frac: 0, Vsub: 0, yb: yb0, ytop: yTop0, yw: yw0, beakerY, floating: false, slack: true, over: false, inFluid: false };
    let s, T, x, yb, yw, floating = false;
    const D = yw0 - yb0 + W / k;
    s = clamp(D / (1 - o.A / Ab + rho * g * o.A / k), 0, o.h);
    T = W - rho * g * o.A * s;
    if (T < 0) {
      // 뜬다: 줄이 느슨해지고 부력 = 무게
      floating = true; T = 0;
      s = Math.min(W / (rho * g * o.A), o.h);
      yw = yw0 + o.A * s / Ab; yb = yw - s; x = 0;
    } else {
      x = T / k; yb = yb0 - x; yw = yw0 + o.A * s / Ab;
    }
    const B = rho * g * o.A * s;
    return { ...o, g, rho, W, B, T, x, s, frac: o.h > 0 ? s / o.h : 0, Vsub: o.A * s, yb, ytop: yb + o.h, yw, beakerY, floating, slack: floating, over: T > C.hangMax + 1e-9, inFluid: s > 1e-5 };
  }
  // 수조를 올릴 수 있는 한계: 물체가 수조 바닥에 닿기 1 cm 전, 뜬 물체가 저울 고리에 닿기 2 cm 전, 수조 테두리가 저울 몸통에 닿기 전
  function jackMax(p) {
    const ok = (j) => {
      const r = hang({ ...p, jack: j });
      if (r.empty) return j + C.beaker.height <= C.hang.casingTop - C.hang.casing - 0.01;
      if (r.yb - (j + C.beaker.glass) < 0.01) return false;
      if (r.floating && r.ytop > C.hang.hookY0 - C.hang.string + 0.02) return false;
      return j + C.beaker.height <= C.hang.casingTop - C.hang.casing - 0.01;
    };
    if (ok(C.jack.max)) return C.jack.max;
    let lo = C.jack.min, hi = C.jack.max;
    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
    return lo;
  }
  // 완전히 잠기는 최소 수조 높이 (투어 안내·검증용)
  function jackForFull(p) {
    const jm = jackMax(p);
    let lo = C.jack.min, hi = jm;
    if (hang({ ...p, jack: hi }).frac < 0.999) return null;
    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (hang({ ...p, jack: mid }).frac >= 0.999) hi = mid; else lo = mid; }
    return hi;
  }

  // ---- 끌기대 ----
  const trackMass = (load) => C.M0 + load * C.loadMass;
  // 도막이 받는 힘들 (오른쪽 +). st = {x, v}
  function trackForces(st, p) {
    const M = trackMass(p.load), N = M * p.g, sf = SURFACES[p.surface];
    const Fa = p.same ? p.F1 + p.F2 : p.F2 - p.F1;
    const fsMax = sf.mus * N, fk = sf.muk * N;
    let f = 0, bump = 0, mode;
    const atMin = st.x <= C.track.xmin + 1e-6, atMax = st.x >= C.track.xmax - 1e-6;
    if (Math.abs(st.v) < 1e-6) {
      if (Math.abs(Fa) <= fsMax + 1e-9) { f = -Fa; mode = Fa === 0 ? 'rest' : 'held'; }
      else { f = -Math.sign(Fa) * fk; mode = 'slide'; }
    } else { f = -Math.sign(st.v) * fk; mode = 'slide'; }
    let net = Fa + f;
    // 범퍼: 벽이 미는 힘이 알짜힘을 0으로 만든다
    if (Math.abs(st.v) < 1e-6 && ((atMin && net < 0) || (atMax && net > 0))) { bump = -net; net = 0; mode = 'bump'; }
    if (mode === 'held' || mode === 'rest') {
      // 평형인 이유를 구분: 두 힘이 서로 상쇄 vs 마찰이 버팀
      if (Fa === 0 && p.F1 > 0 && p.F2 > 0 && !p.same) mode = 'balance';
    }
    return { M, N, W: M * p.g, Fa, f, fsMax, fk, bump, net, a: net / M, mode, mus: sf.mus, muk: sf.muk };
  }
  // 시간 적분 (반암시적 오일러 + 속도 0 통과 시 정지 판정). 이벤트를 돌려준다.
  function trackStep(st, p, dt) {
    const ev = [];
    const sub = Math.max(1, Math.ceil(dt / 0.002)), h = dt / sub;
    for (let i = 0; i < sub; i++) {
      const wasStatic = Math.abs(st.v) < 1e-6;
      const F = trackForces(st, p);
      if (wasStatic && F.mode === 'slide') ev.push({ type: 'start', Fa: Math.abs(F.Fa), fsMax: F.fsMax, N: F.N, surface: p.surface, load: p.load, g: p.g, same: p.same });
      if (F.mode !== 'slide') { st.v = 0; continue; }
      const v0 = st.v;
      st.v += F.a * h;
      if (v0 !== 0 && Math.sign(st.v) !== Math.sign(v0)) {     // 마찰로 멈춤 → 정지 판정은 다음 단계에서
        st.v = 0; ev.push({ type: 'stop' }); continue;
      }
      st.x += st.v * h;
      if (st.x < C.track.xmin) { st.x = C.track.xmin; if (st.v < 0) { ev.push({ type: 'bump', v: st.v }); st.v = 0; } }
      if (st.x > C.track.xmax) { st.x = C.track.xmax; if (st.v > 0) { ev.push({ type: 'bump', v: st.v }); st.v = 0; } }
    }
    return ev;
  }

  // 훅 법칙 직선 맞춤 (원점 통과): k = Σ F·x / Σ x²
  function fitK(pts) {
    let sfx = 0, sxx = 0;
    for (const q of pts) { sfx += q.F * q.x; sxx += q.x * q.x; }
    return sxx > 0 ? sfx / sxx : NaN;
  }

  return { C, BALANCE, balanceSide, balance, beamStep, OBJECTS, FLUIDS, SURFACES, PLANETS, RANGE, planetOf, nearPlanet, hangObject, hang, jackMax, jackForFull, trackMass, trackForces, trackStep, fitK };
})();
// ==== END PHYSICS ====

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261011);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

      new THREE.MeshPhysicalMaterial({ color: 0xdcecf2, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.16, clearcoat: 1, clearcoatRoughness: 0.04, depthWrite: false, envMapIntensity: 1.5 }),

};

function shadowify(o, cast = true, recv = true) {
  o.traverse((m) => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } });
  return o;
}
// 오버레이 깊이 판정에 쓰는 불투명 물체 표시 (유리·물 같은 투명 재질은 제외: 그 안의 입자가 보여야 한다)
function occluder(o) { o.traverse((m) => { if (m.isMesh && !m.material.transparent && !m.isInstancedMesh) m.layers.enable(LAYER_OCC); }); return o; }

function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  t.userData.canvas = c; t.userData.ctx = ctx;
  return t;
}
const FONT = { head: '800 {s}px Outfit, "Noto Sans KR", sans-serif', mono: '500 {s}px "DM Mono", monospace', sans: '500 {s}px "Noto Sans KR", sans-serif' };
const font = (k, s) => FONT[k].replace('{s}', s);

function roundedPanel(w, h, d, r, mat, seg = 4) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// 베벨 테두리 (가운데가 빈 액자형)
function bevelFrame(w, h, t, depth, mat, r = 0.01) {
  const outer = roundedRectShape(w, h, r + t * 0.5);
  const hole = roundedRectShape(w - 2 * t, h - 2 * t, r);

const ARC_START = Math.PI * 1.25, ARC_SWEEP = Math.PI * 1.5;

    for (const [f, txt] of ticks) { const a = ARC_START - f * ARC_SWEEP; c.fillText(txt, W / 2 + Math.cos(a) * W * 0.28, W / 2 - Math.sin(a) * W * 0.28); }

  base.position.z = 0.001; g.add(base);

    uniforms: { uFill: { value: 0.5 }, uColor: { value: new THREE.Color(opts.color || 0x7dd3fc) }, uGain: { value: 3.0 } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform float uFill; uniform vec3 uColor; uniform float uGain; varying vec2 vP;

  const prof = [[0, 0], [R * 0.98, 0], [R, R * 0.06], [R, R * 0.62], [R * 0.96, R * 0.7], [R * 0.82, R * 0.74], [R * 0.78, R * 0.8], [0, R * 0.82]].map(([x, y]) => new THREE.Vector2(x, y));

  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    const m = new THREE.Mesh(ridge, MAT.graphiteD);
    m.position.set(Math.cos(a) * R * 0.99, Math.sin(a) * R * 0.99, R * 0.33); m.rotation.z = a; knob.add(m);

function ledSlider(opts) {

        c.fillStyle = `rgb(${Math.round(118 * t)},${Math.round(84 * t)},${Math.round(58 * t)})`;
        c.fillRect(x, r * H / rows, len, H / rows);
        for (let k = 0; k < 14; k++) { c.fillStyle = `rgba(40,24,12,${0.04 + rand() * 0.06})`; c.fillRect(x, r * H / rows + rand() * H / rows, len, 1 + rand() * 2); }

      c.fillStyle = 'rgba(20,12,6,0.6)'; c.fillRect(0, r * H / rows, W, 2);

}

}

function gaugeFaceTexture(vmin, vmax, nMajor, sub = 5) {
  return canvasTex(512, 512, (c, W) => {
    const g = c.createRadialGradient(W / 2, W / 2, 10, W / 2, W / 2, W / 2);
    g.addColorStop(0, '#f4ecdf'); g.addColorStop(1, '#d9ccb8');
    c.fillStyle = g; c.beginPath(); c.arc(W / 2, W / 2, W / 2, 0, Math.PI * 2); c.fill();
    const a0 = Math.PI * 1.25, sw = Math.PI * 1.5;
    c.strokeStyle = '#2a2420'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a2420';
    for (let i = 0; i <= nMajor * sub; i++) {
      const f = i / (nMajor * sub), a = a0 - f * sw, major = i % sub === 0;
      const r0 = W * (major ? 0.36 : 0.4), r1 = W * 0.44;
      c.lineWidth = major ? 5 : 2; c.beginPath(); c.moveTo(W / 2 + Math.cos(a) * r0, W / 2 - Math.sin(a) * r0); c.lineTo(W / 2 + Math.cos(a) * r1, W / 2 - Math.sin(a) * r1); c.stroke();
      if (major) { c.font = font('mono', 36); c.fillText(String(Math.round(vmin + f * (vmax - vmin))), W / 2 + Math.cos(a) * W * 0.28, W / 2 - Math.sin(a) * W * 0.28); }
    }
    c.strokeStyle = '#b4281a'; c.lineWidth = 8; c.beginPath(); c.arc(W / 2, W / 2, W * 0.44, a0 - sw, a0 - sw * 0.82); c.stroke();
  });
}

function drawDiagramFBD(c, W, H) {
  gridLines(c, W, H, 12, 8);
  const cx = W * 0.46, cy = H * 0.56;
  c.strokeStyle = 'rgba(255,207,154,0.85)'; c.lineWidth = 4; c.strokeRect(cx - 90, cy - 55, 180, 110);
  c.fillStyle = 'rgba(255,207,154,0.08)'; c.fillRect(cx - 90, cy - 55, 180, 110);
  c.strokeStyle = 'rgba(186,230,253,0.4)'; c.beginPath(); c.moveTo(60, cy + 57); c.lineTo(W - 60, cy + 57); c.stroke();
  const arrow = (x0, y0, x1, y1, col) => {
    glowStroke(c, col, 6, 14, (c) => { c.moveTo(x0, y0); c.lineTo(x1, y1); });
    const a = Math.atan2(y1 - y0, x1 - x0); c.fillStyle = col; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x1 - 22 * Math.cos(a - 0.4), y1 - 22 * Math.sin(a - 0.4)); c.lineTo(x1 - 22 * Math.cos(a + 0.4), y1 - 22 * Math.sin(a + 0.4)); c.closePath(); c.fill();
  };
  arrow(cx - 10, cy, cx - 10, cy + 150, 'rgba(255,179,107,0.95)');
  arrow(cx + 10, cy, cx + 10, cy - 150, 'rgba(240,240,240,0.9)');
  arrow(cx + 90, cy, cx + 240, cy, 'rgba(196,181,253,0.95)');
  arrow(cx - 30, cy + 50, cx - 180, cy + 50, 'rgba(252,165,165,0.95)');
}

  up(bx + 26, by - bh * 0.4, by - bh * 0.8, 'rgba(125,211,252,0.95)');

// 나선 용수철: 위(0)에서 아래(−len)로 감긴 관. 길이가 바뀌면 다시 만든다 (철사 굵기 유지)
function helixGeo(r, turns, len, wire) {
  const n = Math.max(24, Math.round(turns * 14)), pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n; pts.push(new THREE.Vector3(Math.cos(t * Math.PI * 2 * turns) * r, -t * len, Math.sin(t * Math.PI * 2 * turns) * r)); }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n * 2, wire, 5);
}
function springMesh(r, turns, wire, mat = MAT.chrome) {
  const m = new THREE.Mesh(helixGeo(r, turns, 0.05, wire), mat); m.castShadow = true;
  const sp = { mesh: m, L: 0.05, set(L) { L = Math.max(L, turns * wire * 2.3); if (Math.abs(L - sp.L) < 0.0006) return; sp.L = L; m.geometry.dispose(); m.geometry = helixGeo(r, turns, L, wire); } };
  return sp;
}
const cyl = (r, h, mat, seg = 16) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat); m.castShadow = true; return m; };
// x축 방향 막대 (시작점 0, 길이 len)
const rodX = (r, len, mat) => { const m = cyl(r, len, mat, 10); m.geometry.rotateZ(Math.PI / 2); return m; };

    for (let i = 0; i <= 50; i++) {

      c.lineWidth = major ? 5 : 2.5; c.beginPath(); c.moveTo(0, py); c.lineTo(major ? 70 : half ? 52 : 34, py); c.stroke();
      if (major) { c.font = font('mono', 54); c.fillText(String(F), 84, py); }

    case ';': case ':': tr(); step('F2', -0.1); break; case "'": case '"': tr(); step('F2', 0.1); break;

    case 'y': case 'Y': window.open('guide.html#assessment', '_blank', 'noopener'); break;
    case 'c': case 'C': setCinematic(!CAM.cine); break;

    case '추': window.open('guide.html#controls', '_blank', 'noopener'); break;

// 소리 (기본 꺼짐): 틱, 버튼, 미끄러지는 소리, 범퍼, 단계 완료
const AUD = { ctx: null };
function ensureAudio() {
  if (!S.sound || AUD.ctx) return;
  const C = new (window.AudioContext || window.webkitAudioContext)();
  AUD.ctx = C; AUD.master = C.createGain(); AUD.master.gain.value = 0.5; AUD.master.connect(C.destination);
  const len = C.sampleRate * 2, buf = C.createBuffer(1, len, C.sampleRate), d = buf.getChannelData(0), Rn = mulberry32(9);
  for (let i = 0; i < len; i++) d[i] = Rn() * 2 - 1;
  AUD.noise = buf;
  const src = C.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = C.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
  const g = C.createGain(); g.gain.value = 0;
  src.connect(bp).connect(g).connect(AUD.master); src.start();
  AUD.slide = g; AUD.bp = bp;
}
function sfx(kind) {
  if (!S.sound || !AUD.ctx) return;
  const C = AUD.ctx, t = C.currentTime, g = C.createGain(); g.connect(AUD.master);
  if (kind === 'tick' || kind === 'click') {
    const o = C.createOscillator(); o.type = 'square'; o.frequency.value = kind === 'tick' ? 2400 : 900;
    g.gain.setValueAtTime(kind === 'tick' ? 0.04 : 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03); o.connect(g); o.start(t); o.stop(t + 0.04);
  } else if (kind === 'clack' || kind === 'scrape') {
    const s = C.createBufferSource(); s.buffer = AUD.noise;
    const f = C.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = kind === 'clack' ? 500 : 1400; f.Q.value = 1.5;
    g.gain.setValueAtTime(kind === 'clack' ? 0.5 : 0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 'clack' ? 0.14 : 0.2));
    s.connect(f).connect(g); s.start(t, rr(0, 1), 0.22);
  } else if (kind === 'win' || kind === 'pick' || kind === 'pop') {
    const notes = kind === 'win' ? [523, 659, 784, 1047] : kind === 'pick' ? [660, 990] : [784, 1175, 1568];
    notes.forEach((f, i) => { const o = C.createOscillator(), gg = C.createGain(), t0 = t + i * (kind === 'win' ? 0.09 : 0.06); o.type = 'triangle'; o.frequency.value = f; gg.gain.setValueAtTime(0.0001, t0); gg.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32); o.connect(gg).connect(AUD.master); o.start(t0); o.stop(t0 + 0.34); });
  } else if (kind === 'swell' || kind === 'whoosh' || kind === 'splash') {
    const s = C.createBufferSource(); s.buffer = AUD.noise; const f = C.createBiquadFilter();
    if (kind === 'swell') {
      f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(220, t + 0.9);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0); s.connect(f).connect(g); s.start(t, rr(0, 1), 1.05);
      const o = C.createOscillator(), og = C.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(92, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.8);
      og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.22, t + 0.05); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.9); o.connect(og).connect(AUD.master); o.start(t); o.stop(t + 0.95);
    } else if (kind === 'whoosh') {
      f.type = 'bandpass'; f.Q.value = 0.9; f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(1500, t + 0.6);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8); s.connect(f).connect(g); s.start(t, rr(0, 1), 0.85);
    } else {
      f.type = 'bandpass'; f.Q.value = 0.7; f.frequency.setValueAtTime(2300, t); f.frequency.exponentialRampToValueAtTime(650, t + 0.4);
      g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); s.connect(f).connect(g); s.start(t, rr(0, 1), 0.55);
    }
  } else if (kind === 'ding') {
    const o = C.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(g); o.start(t); o.stop(t + 0.62);
  }
}

function audioUpdate() {

  document.body.style.setProperty('--kpop-top', `${Math.max(ban?.bottom || 0, hud?.bottom || 0) + 8}px`);
  const slowFloor = Math.min(foot?.top ?? H, dock?.top ?? H, win?.top ?? H, album?.top ?? H);
  document.body.style.setProperty('--kslow-bottom', `${Math.max(16, H - slowFloor + 10)}px`);
  if (!ban && !foot) return;
  const top = Math.max(ban ? ban.bottom : 0, hud ? hud.bottom : 0) + 8;
  const bot = Math.min(dock ? dock.top : H, foot ? foot.top : H) - 8;
  if (bot - top < 120) return;
  const td = (top + bot) / 2 - H / 2, pt = isPortrait(), tz = pt && S.station === 'track' ? 1 : S.station === 'balance' && !pt ? 0.8 : clamp((bot - top) / (H * (pt ? 0.5 : 0.6)), pt ? 0.66 : 0.74, 1);   // 세로 화면의 끌기대는 가로로 길어 줄이지 않는다
  const k = KVIEW.d == null ? 1 : 1 - Math.exp(-dt * 2.4);
  const nd = KVIEW.d == null ? td : KVIEW.d + (td - KVIEW.d) * k, nz = KVIEW.z + (tz - KVIEW.z) * k;
  if (KVIEW.d == null || Math.abs(nd - KVIEW.d) > 0.3 || Math.abs(nz - KVIEW.z) > 0.0005) { KVIEW.d = nd; KVIEW.z = nz; applyViewOffset(); }
}

// ---- 해설선 (텔레스트레이션): 점이 튀어나오고, 선이 그어지고, 이름표가 미끄러져 들어온다 ----
function dirCallout(at, col, dur = 2.8, pic = 'arrowR', val = () => '') {
  const title = ico(pic);
  const L = dirLayer('kcall');
  DIR.callouts.forEach((q) => (q.t = Math.max(q.t, q.dur)));   // 앞의 해설은 비켜 준다
  const el = document.createElement('div'); el.className = 'kco'; el.style.setProperty('--c', col);
  el.innerHTML = `<i class="ln"></i><i class="d"></i><div class="bx"><b>${title}</b><span></span></div>`;
  L.appendChild(el);
  DIR.side = -DIR.side;
  DIR.callouts.push({ el, at, val, t: 0, dur, side: DIR.side });
}
function dirCallouts(dt) {
  DIR.callouts = DIR.callouts.filter((q) => {
    q.t += dt;
    if (q.t > q.dur + 0.45 || !dirOn()) { q.el.remove(); return false; }
    if (q.t > q.dur) q.el.classList.add('out');
    const p = khProj(q.at()), side = p.x > innerWidth * 0.64 ? -1 : p.x < innerWidth * 0.36 ? 1 : q.side;
    const bx = p.x + side * 78, by = p.y - 82, len = Math.hypot(bx - p.x, by - p.y), ang = Math.atan2(by - p.y, bx - p.x);
    const [ln, d, box] = q.el.children;
    ln.style.cssText = `left:${p.x}px;top:${p.y}px;width:${len}px;--a:${ang}rad`;
    d.style.cssText = `left:${p.x}px;top:${p.y}px`;
    box.style.cssText = `left:${bx + side * 4}px;top:${by}px;--bx:${side > 0 ? '0%' : '-100%'}`;
    const v = q.val(), s = box.lastChild; if (s.textContent !== v) s.textContent = v;
    return true;
  });
}

// ---- 입자: 물보라·물결·먼지·충격 고리 (#kfx 캔버스에 KID.frame이 그린다) ----
function dirSplash() {
  const p = khProj(LOOK.obj().clone()), y = p.y + 26;
  for (let i = 0; i < 28; i++) DIR.parts.push({ k: 'drop', x: p.x + rr(-14, 14), y, vx: rr(-2.6, 2.6), vy: rr(-7.5, -2.5), r: rr(1.4, 3.2), life: rr(0.6, 1.0) });
  for (let i = 0; i < 3; i++) DIR.parts.push({ k: 'ripple', x: p.x, y: y + 6, r: 6 + i * 6, life: 1.1 + i * 0.25, t0: 1.1 + i * 0.25 });
}
function dirRing(v) { const p = khProj(v); DIR.parts.push({ k: 'ring', x: p.x, y: p.y, r: 8, life: 0.5, t0: 0.5 }); }
function dirDust() {
  const sg = Math.sign(S.trk.v), p = khProj(V3(blockX(S.trk.x) - sg * PC.block.w * 0.5, TRK_Y + 0.006, TRK.z + 0.03));
  DIR.parts.push({ k: 'dust', x: p.x + rr(-4, 4), y: p.y + rr(-2, 2), vx: -sg * rr(0.3, 1.4), vy: -rr(0.1, 0.6), r: rr(2.5, 5), life: rr(0.6, 1.1), t0: 1, c: S.surface === 'sand' ? '150,110,70' : '185,150,105' });
}
function dirDraw(c, dt) {
  const f = dt * 60;
  for (const q of DIR.parts) {
    q.life -= dt;
    if (q.k === 'drop') { q.vy += 0.32 * f; q.x += q.vx * f; q.y += q.vy * f; c.fillStyle = `rgba(205,236,255,${clamp(q.life * 2, 0, 0.9)})`; c.beginPath(); c.arc(q.x, q.y, q.r, 0, 7); c.fill(); }
    else if (q.k === 'ripple') { const k = 1 - q.life / q.t0; c.strokeStyle = `rgba(220,242,255,${clamp(q.life, 0, 0.7)})`; c.lineWidth = 1.5; c.beginPath(); c.ellipse(q.x, q.y, q.r + k * 60, (q.r + k * 60) * 0.28, 0, 0, 7); c.stroke(); }
    else if (q.k === 'ring') { const k = 1 - q.life / q.t0; c.strokeStyle = `rgba(255,255,255,${q.life * 1.6})`; c.lineWidth = 3 * (1 - k) + 0.5; c.beginPath(); c.arc(q.x, q.y, q.r + k * 46, 0, 7); c.stroke(); }
    else if (q.k === 'sweep') { if ((q.delay -= dt) > 0) { q.life += dt; continue; } const k = 1 - q.life / q.t0; c.fillStyle = `rgba(${q.c},${clamp(q.life * 1.2, 0, 0.85)})`; c.beginPath(); c.ellipse(q.x, q.y - k * 10, q.r * (1 + k), q.r * 0.45 * (1 + k), 0, 0, 7); c.fill(); }
    else if (q.k === 'dust') { q.x += q.vx * f; q.y += q.vy * f; q.r += 0.12 * f; c.fillStyle = `rgba(${q.c},${clamp(q.life * 0.45, 0, 0.35)})`; c.beginPath(); c.arc(q.x, q.y, q.r, 0, 7); c.fill(); }
  }
  DIR.parts = DIR.parts.filter((q) => q.life > 0);
}

// ---- 원격 측정 그래프: 최근 6초의 힘 ----
function dirTele(dt) {
  if (S.station === 'balance') return;
  const cv = document.querySelector('#kid .ktele'); if (!cv) return;
  const st = S.station;
  if (DIR.teleSt !== st) { DIR.teleSt = st; DIR.tele.length = 0; DIR.marks.length = 0; }
  DIR.teleAcc += dt * DIR.ts;
  if (DIR.teleAcc >= 0.05) {
    DIR.teleAcc = 0;
    DIR.tele.push(st === 'track' ? [Math.abs(S.F ? S.F.Fa : 0), Math.abs(S.F ? S.F.f : 0)] : [S.Tlive, S.hang ? S.hang.B : 0]);
    if (DIR.tele.length > 120) { DIR.tele.shift(); DIR.marks = DIR.marks.map((i) => i - 1).filter((i) => i >= 0); }
  }
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight; if (!W) return;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const cols = st === 'track' ? [hex(FCOL.F), hex(FCOL.f)] : [hex(FCOL.T), hex(FCOL.B)];
  const mx = Math.max(st === 'track' ? 3 : 1, ...DIR.tele.map((q) => Math.max(q[0], q[1]))) * 1.15, x0 = 8, x1 = W - 8, y0 = 18, y1 = H - 6;
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, y1); c.lineTo(x1, y1); c.stroke();
  const X = (i) => x0 + (i / 119) * (x1 - x0), Y = (v) => y1 - (v / mx) * (y1 - y0);
  for (const i of DIR.marks) { c.strokeStyle = 'rgba(252,165,165,.55)'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(i), y0 - 4); c.lineTo(X(i), y1); c.stroke(); c.setLineDash([]); }
  for (let s = 1; s >= 0; s--) {
    c.strokeStyle = cols[s]; c.lineWidth = s ? 1.6 : 2; c.beginPath();
    DIR.tele.forEach((q, i) => (i ? c.lineTo(X(i), Y(q[s])) : c.moveTo(X(i), Y(q[s])))); c.stroke();
  }
  // Color samples and directed arrows share the scene's force grammar.
  cols.forEach((col, i) => {
    const x = x0 + i * 40, y = 9;
    c.fillStyle = col; c.beginPath(); c.arc(x + 3, y, 3, 0, Math.PI * 2); c.fill();
    c.strokeStyle = col; c.lineWidth = 2; c.beginPath();
    if (st === 'track') {
      const a = i ? x + 30 : x + 12, b = i ? x + 12 : x + 30, d = i ? 1 : -1;
      c.moveTo(a, y); c.lineTo(b, y); c.moveTo(b + d * 5, y - 4); c.lineTo(b, y); c.lineTo(b + d * 5, y + 4);
    } else { c.moveTo(x + 22, y + 6); c.lineTo(x + 22, y - 6); c.moveTo(x + 18, y - 2); c.lineTo(x + 22, y - 6); c.lineTo(x + 26, y - 2); }
    c.stroke();
  });
}

// ---- 매 프레임 (실제 시간) ----
function dirFrame(dt) {
  const kid = dirOn(), r = S.hang;
  if (!kid) { document.body.classList.remove('kcut', 'kbars', 'kslow'); DIR.parts.length = 0; if (DIR.callouts.length) dirCallouts(dt); dirLensFrame(dt); if (NOTE.el) NOTE.el.classList.remove('on'); return; }
  if (!KID.free && KID.i >= KID.missions.length) { dirTeleReset(); return; }
  if (r && S.station === 'hang') {
    if (DIR.prevIn === false && r.inFluid && !r.empty) dirEvent('splash');
    if (DIR.prevFloat === false && r.floating) dirEvent('float');
    if (DIR.prevDeep === false && r.frac >= 0.6 && !r.floating) dirEvent('deep');
  }
  DIR.prevIn = r ? r.inFluid : null; DIR.prevFloat = r ? r.floating : null; DIR.prevDeep = r ? r.frac >= 0.6 : null;
  // 자유 실험: 끝에 부딪힌 도막은 1.4초 뒤 줄을 풀고 제자리로
  if (DIR.home) { DIR.home.t += dt; if (DIR.home.t > 1.4) { DIR.home = null; if (KID.free && S.station === 'track' && !KH.drag) { setParam('F1', 0, true); setParam('F2', 0, true); resetTrack(); sfx('whoosh'); dirRing(KID_AT.block()); KID.update(true); } } }
  dirDropFrame(dt); dirView(dt);
  if (S.station === 'track' && Math.abs(S.trk.v) > 0.03 && S.surface !== 'glass' && !CAM.fly) {
