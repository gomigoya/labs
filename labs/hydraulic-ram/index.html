<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수격펌프 — 물이 솟는다 | Lumebench</title>
<meta name="theme-color" content="#1a1511">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --warm:#ffb36b; --warm2:#ffcf9a; --cool:#7dd3fc; --cool2:#bae6fd; --violet:#a78bfa;
  --ink:#f4ede4; --quiet:#b9ad9f; --dim:#8a7f73;
  --glass:rgba(24,20,17,.58); --glass-line:rgba(255,255,255,.12); --chip:rgba(255,255,255,.06);
  --good:#86efac; --bad:#fca5a5;
  --mono:"DM Mono",ui-monospace,monospace; --sans:"Noto Sans KR",system-ui,sans-serif; --head:Outfit,"Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1511;color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud *{pointer-events:auto}
.hide-ui .hud,.hide-ui #labels{opacity:0;pointer-events:none!important}
.hide-ui .hud *{pointer-events:none!important}
.hud,#labels{transition:opacity .35s}

/* 좌상단 */
#left{left:28px;top:22px;width:min(400px,34vw)}
#kicker{font:500 13px/1 var(--mono);letter-spacing:.2em;color:#fff;opacity:.92;text-transform:uppercase}
#kicker b{color:var(--cool);font-weight:500}
#hook{font:800 58px/.95 var(--head);color:var(--warm);margin:10px 0 12px;text-shadow:0 0 28px rgba(255,179,107,.35),0 2px 0 rgba(0,0,0,.25);letter-spacing:-.01em}
#lead{color:#e9dfd3;font-size:14.5px;line-height:1.55;margin:0 0 14px;max-width:25em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#lead em{font-style:normal;color:var(--cool2)}
#chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:12px;padding:9px 11px 8px}
.chip .k{font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--quiet);text-transform:uppercase}
.chip .v{font:600 23px/1.15 var(--head);margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .v small{font:500 11px var(--mono);color:var(--quiet);margin-left:3px;letter-spacing:.06em}
.chip .s{font:400 10.5px/1.3 var(--mono);color:var(--dim);margin-top:3px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.c1 .v{color:var(--cool2)} .chip.c2 .v{color:var(--warm2)} .chip.c3 .v{color:#fff}
#caption{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-left:3px solid var(--cool);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.55;min-height:3.4em}
#caption .n{color:var(--cool2);font-weight:700;font-variant-numeric:tabular-nums}
#caption .w{color:var(--warm2);font-weight:700;font-variant-numeric:tabular-nums}
#caption b{color:#fff}
#caption .tag{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.14em;color:var(--quiet);margin-right:6px;vertical-align:1px;text-transform:uppercase}
#energy{margin-top:10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:10px;padding:9px 12px}
#energy .row{display:grid;grid-template-columns:86px 1fr 62px;gap:8px;align-items:center;font:500 10.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--quiet)}
#energy .bar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
#energy .bar i{display:block;height:100%;border-radius:4px}
#energy .val{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}

/* 투어 카드 */
#tour{margin-top:10px;background:rgba(18,30,38,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(125,211,252,.35);border-radius:12px;padding:12px 14px;display:none}
#tour.on{display:block}
#tour .top{display:flex;justify-content:space-between;align-items:center;font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--cool);text-transform:uppercase}
#tour h3{font:700 17px/1.3 var(--sans);margin:8px 0 4px}
#tour p{margin:0;font-size:13.5px;color:#dfe8ee}
#tour .after{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(125,211,252,.3);color:var(--cool2);font-size:13.5px;display:none}
#tour .after.on{display:block}
#tour .nav{display:flex;gap:6px;margin-top:10px;align-items:center}
#tour .dots{flex:1;display:flex;gap:4px}
#tour .dots i{width:16px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#tour .dots i.done{background:var(--cool)} #tour .dots i.cur{background:#fff}
.tbtn{border:1px solid var(--glass-line);background:rgba(255,255,255,.06);border-radius:8px;padding:6px 10px;cursor:pointer;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.tbtn:hover{border-color:var(--cool)} .tbtn.primary{background:var(--cool);color:#06202c;border-color:var(--cool)}
.tbtn:disabled{opacity:.4;cursor:default}

/* 우상단 패널 */
#panel{right:20px;top:20px;width:404px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:14px;padding:12px 14px 12px}
.prow{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prow:last-child{border-bottom:0;padding-bottom:2px}
.prow:first-child{padding-top:2px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--quiet);text-transform:uppercase;margin-bottom:7px}
.lab kbd{font:400 10px var(--mono);color:var(--dim);letter-spacing:.08em;margin-left:6px}
.lab .val{color:var(--ink);font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:rgba(0,0,0,.25);border-radius:9px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 4px 6px;cursor:pointer;font:500 12px/1.2 var(--sans);color:#d9cec2;position:relative}
.seg button kbd{display:block;font:400 9.5px/1 var(--mono);color:var(--dim);margin-top:3px}
.seg button:hover{background:rgba(255,255,255,.06)}
.seg button[aria-pressed="true"]{background:rgba(255,179,107,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,179,107,.55)}
.sl{display:grid;grid-template-columns:1fr;gap:4px;margin-top:9px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fill,#ffb36b) var(--p,50%),rgba(255,255,255,.14) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fill,#ffb36b)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#f3f3f3;border:2px solid #2a2420;margin-top:-6px;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#f3f3f3;border:2px solid #2a2420}
input[type=range]:focus-visible{outline:2px solid var(--cool);outline-offset:2px;border-radius:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;font:500 12px/1 var(--sans);color:#d9cec2}
.tg i{width:8px;height:8px;border-radius:50%;background:#5c544c;flex:none}
.tg kbd{font:400 9.5px var(--mono);color:var(--dim)}
.tg[aria-pressed="true"]{color:#fff;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
.tg[aria-pressed="true"] i{background:var(--dot,#7dd3fc);box-shadow:0 0 8px var(--dot,#7dd3fc)}
.r3{display:flex;gap:8px;align-items:center}
.r3 .seg{flex:1}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--glass-line);background:rgba(255,255,255,.05);cursor:pointer;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{border-color:rgba(255,255,255,.3)}
.ib[aria-pressed="true"]{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.55);color:#fff}
.ib .kb{position:absolute;right:2px;bottom:1px;font:400 8.5px var(--mono);color:var(--dim)}
.speed{display:flex;align-items:center;gap:6px;margin-top:9px}
.speed .seg{flex:1}
.speed .seg button{padding:6px 2px 5px;font:500 11px/1 var(--mono)}
#panelToggle{display:none}

/* 3D 라벨 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:999px;background:rgba(18,15,13,.66);border:1px solid rgba(255,255,255,.12);font:500 10.5px/1.15 var(--mono);letter-spacing:.06em;color:#efe6db;white-space:nowrap;transform:translate(-50%,-50%);will-change:transform;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl i{width:7px;height:7px;border-radius:50%;flex:none}
.lbl b{font-weight:500;color:#fff}
.lbl span{color:var(--cool2);font-variant-numeric:tabular-nums}
.lbl.hidden{display:none}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:var(--stem,0px);background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}

/* 하단 */
#hint{left:50%;bottom:16px;transform:translateX(-50%);font:400 11.5px/1 var(--mono);letter-spacing:.06em;color:rgba(244,237,228,.72);background:rgba(18,15,13,.42);padding:8px 14px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (max-width:1180px){#hint{display:none}} /* 사이트 셸(왼쪽 아래)과 겹치지 않게. 조작법은 도움말(?)에 있다 */
#other{right:20px;bottom:16px;display:flex;gap:8px;align-items:stretch}
#other a.card{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:12px;padding:8px 12px 8px 8px}
#other .thumb{width:44px;height:32px;border-radius:7px;background:radial-gradient(60% 80% at 70% 40%,rgba(125,211,252,.55),transparent 70%),radial-gradient(60% 80% at 25% 70%,rgba(255,179,107,.5),transparent 70%),#0f0d0b}
#other .t{font:500 10px/1.2 var(--mono);letter-spacing:.12em;color:var(--quiet);text-transform:uppercase}
#other .n{font:600 13px/1.3 var(--sans)}
#other .share{width:46px;border-radius:12px;height:auto}

/* 도움말 */
#help{position:fixed;inset:0;z-index:30;background:rgba(10,8,7,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#help.on{display:flex}
#help .box{width:min(760px,100%);max-height:88vh;overflow:auto;background:#1f1a16;border:1px solid var(--glass-line);border-radius:16px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#help h2{font:800 26px/1.1 var(--head);color:var(--warm);margin:0 0 6px}
#help h3{font:700 14px/1.3 var(--sans);color:var(--cool2);margin:18px 0 6px}
#help p,#help li{font-size:14px;color:#e2d8cc;line-height:1.6}
#help ul{margin:4px 0;padding-left:18px}
#help table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
#help th,#help td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top}
#help th{font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--quiet);text-transform:uppercase}
#help .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;font:400 12.5px/1.6 var(--mono);color:#d9cec2}
#help .keys kbd{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--glass-line);border-radius:5px;padding:0 5px;margin-right:6px;color:#fff}
#help .x{float:right}
#help .eq{font:400 13px/1.6 var(--mono);background:rgba(0,0,0,.25);border-radius:8px;padding:8px 12px;color:#e8f6ff}

/* 이벤트 토스트 (특이점·정지 등) */
#event{position:fixed;left:50%;top:18%;transform:translate(-50%,-8px);z-index:12;font:700 15px/1.2 var(--sans);padding:10px 16px;border-radius:999px;background:rgba(18,30,38,.78);border:1px solid rgba(125,211,252,.5);color:#e6f7ff;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#event.on{opacity:1;transform:translate(-50%,0)}
#slowmo{position:fixed;left:50%;top:calc(18% + 48px);transform:translateX(-50%);z-index:12;font:500 10.5px/1 var(--mono);letter-spacing:.2em;color:var(--cool);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#slowmo.on{opacity:.95}

/* 등장 애니메이션 */
.intro #left>*,.intro #panel,.intro #other,.intro #hint{opacity:0;transform:translateY(8px)}
#left>*,#panel,#other,#hint{transition:opacity .7s ease,transform .7s ease}

/* 모바일 */
@media (max-width:980px){
  #left{left:14px;top:12px;width:calc(100vw - 28px)}
  #kicker{font-size:11px} #kicker b{display:none} /* 오른쪽 위 사이트 셸 자리 */
  #hook{font-size:38px;margin:6px 0 6px}
  #lead{display:none}
  #chips{gap:6px;margin-bottom:0}
  .chip{padding:6px 8px 6px;border-radius:10px}
  .chip .v{font-size:17px}
  .chip .s{display:none}
  #caption,#energy{display:none}
  #tour{position:fixed;left:14px;right:14px;bottom:calc(var(--sheet,128px) + 10px);margin:0;padding:10px 12px}
  #tour h3{font-size:15px;margin:6px 0 3px} #tour p,#tour .after{font-size:12.5px;line-height:1.45}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:16px 16px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
  #panel .more{display:none}
  #panel.open .more{display:block}
  #panelToggle{display:flex;width:100%;justify-content:center;border:0;background:none;padding:0 0 6px;cursor:pointer}
  #panelToggle i{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  #hint,#other{display:none}
  .lbl{font-size:9.5px;padding:3px 7px 3px 6px}
  #event{top:auto;bottom:calc(var(--sheet,128px) + 16px);font-size:13px}
  #slowmo{top:auto;bottom:calc(var(--sheet,128px) + 4px)}
}
@media (max-width:980px) and (orientation:landscape){
  #chips{width:60%}
  #panel{max-height:58vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
} }
</script>
</head>
<body class="intro">
<canvas id="gl" tabindex="0" aria-label="수격펌프 3D 실험실 장면"></canvas>
<div id="labels" aria-hidden="true"></div>

<section id="left" class="hud" aria-live="polite">
  <div id="kicker" data-i18n="kicker"></div>
  <h1 id="hook" data-i18n="hook"></h1>
  <p id="lead" data-i18n-html="lead"></p>
  <div id="chips">
    <div class="chip c1"><div class="k" data-i18n="chipQ"></div><div class="v" id="cQ">—</div><div class="s" id="cQs">—</div></div>
    <div class="chip c2"><div class="k" data-i18n="chipEta"></div><div class="v" id="cE">—</div><div class="s" id="cEs">—</div></div>
    <div class="chip c3"><div class="k" data-i18n="chipP"></div><div class="v" id="cP">—</div><div class="s" id="cPs">—</div></div>
  </div>
  <div id="caption"></div>
  <div id="energy" aria-label="energy">
    <div class="row"><span data-i18n="eIn"></span><div class="bar"><i id="eInB" style="background:var(--warm)"></i></div><span class="val" id="eIn">—</span></div>
    <div class="row"><span data-i18n="eOut"></span><div class="bar"><i id="eOutB" style="background:var(--cool)"></i></div><span class="val" id="eOut">—</span></div>
  </div>
  <div id="tour" role="dialog" aria-live="polite">
    <div class="top"><span id="tourStep"></span><button class="tbtn" id="tourClose" data-i18n="close"></button></div>
    <h3 id="tourTitle"></h3>
    <p id="tourBody"></p>
    <div class="after" id="tourAfter"></div>
    <div class="nav"><div class="dots" id="tourDots"></div><button class="tbtn" id="tourPrev" data-i18n="prev"></button><button class="tbtn primary" id="tourNext" data-i18n="next"></button></div>
  </div>
</section>

<section id="panel" class="hud" aria-label="controls">
  <button id="panelToggle" aria-label="expand"><i></i></button>
  <div class="prow">
    <div class="lab"><span data-i18n="scenario"></span><span><kbd>1–4</kbd></span></div>
    <div class="seg" id="presets" role="group"></div>
    <div class="sl">
      <div class="lab" style="margin:0"><span><span data-i18n="supplyH"></span><kbd>[ ]</kbd></span><span class="val" id="vH"></span></div>
      <input type="range" id="sH" min="1" max="4" step="0.05" aria-label="H">
    </div>
  </div>
  <div class="prow more">
    <div class="two">
      <div><div class="lab" style="margin-bottom:2px"><span><span data-i18n="deliveryh"></span><kbd>- =</kbd></span><span class="val" id="vh"></span></div><input type="range" id="sh" min="5" max="40" step="0.5" aria-label="h"></div>
      <div><div class="lab" style="margin-bottom:2px"><span><span data-i18n="weight"></span><kbd>, .</kbd></span><span class="val" id="vm"></span></div><input type="range" id="sm" min="0.1" max="0.9" step="0.01" aria-label="m"></div>
    </div>
    <div class="toggles" id="overlays"></div>
  </div>
  <div class="prow more">
    <div class="r3">
      <div class="seg" id="views" role="group"></div>
      <button class="ib" id="bPlay" aria-label="play"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg><span class="kb">␣</span></button>
    </div>
    <div class="speed">
      <div class="seg" id="speeds" role="group"></div>
      <button class="tg" id="bSlow" aria-pressed="true" style="--dot:#7dd3fc"><i></i><span data-i18n="slowmo"></span><kbd>M</kbd></button>
    </div>
    <div class="r3" style="margin-top:9px;justify-content:flex-end">
      <button class="ib" id="bSound" aria-pressed="false" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span class="kb">N</span></button>
      <button class="ib" id="bTour" aria-pressed="false" aria-label="tour"><svg viewBox="0 0 24 24"><path d="M5 4v16"/><path d="M5 5h11l-2 4 2 4H5"/></svg><span class="kb">T</span></button>

<script type="module">
// 이 파일은 src/의 조각을 tools/assemble.mjs로 이어 붙여 만든다. 수정은 src/에서.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ==== 1 PHYSICS ====
// 수격펌프 물리 모듈. 화면의 모든 숫자·색·문장은 여기서 나온다(순수 함수 + 계산 결과 기록).
// 모델: 구동관 1차원 탄성 수격 — 특성곡선법(MOC). 상류 = 공급 탱크(일정 수두),
//       하류 = 폐수 밸브(열림: 오리피스 / 닫힘) + 송출 체크 밸브(공기실 = 일정 수두 h).
// 기준면: 펌프 밸브 높이. 수두는 모두 m(물기둥), 속도 m/s, 시간 s.
const PHYS = (() => {
  const C = {
    g: 9.81, rho: 1000,
    L: 12, D: 0.05, f: 0.02,     // 구동관: 길이 12 m, 지름 50 mm, 마찰계수
    Kin: 0.5, Kw: 2.0, Kd: 1.5,  // 입구 손실, 폐수 밸브(열림) 손실, 송출 밸브 손실
    a: 1200,                      // 압력파 속도 (강관), m/s
    N: 20,                        // 구간 수 → 노드 21개
    CdAv: 0.003066,               // 폐수 밸브 항력 면적 (400 g 추 → 1.6 m/s에서 닫힘)
    Aseat: 0.002,                 // 폐수 밸브 시트 면적 (재개방 판정)
    tClosing: 0.015,              // 폐수 밸브가 열림 → 닫힘까지 걸리는 시간 (s)
    vBack: 0.06,                  // 송출 체크 밸브가 앉기 전 허용되는 역류 속도 (m/s)
    Hvap: -9.5,                   // 공동 한계 수두 (게이지)
  };
  C.A = Math.PI * C.D * C.D / 4;
  C.dx = C.L / C.N;
  C.dt = C.dx / C.a;
  C.B = C.a / C.g;
  C.R = C.f * C.dx / (2 * C.g * C.D);

  const RANGE = { H: [1, 4], h: [5, 40], m: [0.1, 0.9] };

  // 폐수 밸브가 열린 채 흐를 때의 정상 유속(강체 근사, 해석식)
  const vInf = (H) => Math.sqrt(2 * C.g * H / (1 + C.Kin + C.f * C.L / C.D + C.Kw));
  // 추 무게 m(kg)일 때 밸브를 밀어 올려 닫는 유속: ½ρ·CdAv·v² = m·g
  const closeSpeed = (m) => Math.sqrt(2 * m * C.g / (C.rho * C.CdAv));
  // 닫힌 밸브가 다시 열리는 수두: 시트에 걸리는 압력 힘 < 추 무게
  const reopenHead = (m) => m / (C.rho * C.Aseat);
  // 주코프스키 수격 압력 상승
  const joukowsky = (dv) => C.a * dv / C.g;
  // 강체 근사 한 박자 송출량 (m³)
  const rigidDelivery = (vc, H, h) => C.A * vc * vc * C.L / (2 * C.g * Math.max(h - H, 1e-6));
  // 강체 근사 가속 단계: 시간과 버려지는 부피 (0 → vc)
  function rigidAccel(H, vc) {
    const vi = vInf(H);
    if (vc >= vi) return { t: Infinity, V: Infinity };
    const tau = C.L * vi / (C.g * H);
    const x = Math.atanh(vc / vi);
    return { t: tau * x, V: C.A * vi * tau * Math.log(Math.cosh(x)) };
  }
  // k·V|V| + B·V = c 를 V에 대해 푼다 (k ≥ 0)
  function solveQuad(k, B, c) {
    if (k < 1e-12) return c / B;
    if (c >= 0) return (-B + Math.sqrt(B * B + 4 * k * c)) / (2 * k);
    return (B - Math.sqrt(B * B - 4 * k * c)) / (2 * k);
  }

  // 시뮬레이션: 정지 상태에서 폐수 밸브를 여는 순간(t = 0)부터 한계 주기에 수렴할 때까지.
  // record=true이면 1 ms마다 노드별 수두·속도와 밸브 상태를 기록한다(화면 재생용).
  function simulate(par, opt = {}) {
    const { H, h, m } = par;
    const record = opt.record !== false;
    const maxCycles = opt.maxCycles ?? 14;
    const tMax = opt.tMax ?? 30;
    const every = 2;
    const N = C.N, n1 = N + 1, B = C.B, R = C.R, dt = C.dt;
    const vc = closeSpeed(m), Hre = reopenHead(m);
    const k0 = (1 + C.Kin) / (2 * C.g), kw = C.Kw / (2 * C.g), kd = C.Kd / (2 * C.g);

    let Hn = new Float64Array(n1).fill(H), Vn = new Float64Array(n1);
    let Hp = new Float64Array(n1), Vp = new Float64Array(n1);
    let waste = 1, deliv = 0;
    let psi = 1, closingFrom = -1;   // 폐수 밸브 열림 비율(1 열림 → 0 닫힘), 닫힘 시작 시각
    let lastVw = 0, lastVd = 0;
    // 하류 경계: 수두 hN에서 폐수·송출 유속 (m/s, 구동관 단면 기준)
    const vw = (hN) => psi <= 0 ? 0 : Math.sign(hN) * psi * Math.sqrt(Math.abs(hN) / kw);
    const vd = (hN) => deliv ? Math.sign(hN - h) * Math.sqrt(Math.abs(hN - h) / kd) : 0;
    // C+ 특성선(cp)과 밸브식을 동시에 만족하는 hN (단조 감소 함수 → 이분법)
    function solveEnd(cp) {
      let lo = C.Hvap - 60, hi = Math.max(cp, h) + 60;
      for (let it = 0; it < 48; it++) {
        const mid = 0.5 * (lo + hi);
        if (cp - B * (vw(mid) + vd(mid)) - mid > 0) lo = mid; else hi = mid;
      }
      return 0.5 * (lo + hi);
    }
    let volD = 0, volW = 0;                         // 누적 송출·폐수 부피 (m³)
    const cycles = [];
    let cur = { t0: 0, tClose: NaN, Vd: 0, Vw: 0, peakH: -Infinity, minH: Infinity, vClose: 0 };

    const cap = record ? Math.ceil(tMax / (dt * every)) + 2 : 0;
    const rec = record ? {
      n: 0, dt: dt * every, nodes: n1,
      H: new Float32Array(cap * n1), V: new Float32Array(cap * n1),
      waste: new Uint8Array(cap), deliv: new Uint8Array(cap),
      volD: new Float32Array(cap), volW: new Float32Array(cap),
    } : null;
    const push = () => {
      const i = rec.n++;
      for (let j = 0; j < n1; j++) { rec.H[i * n1 + j] = Hn[j]; rec.V[i * n1 + j] = Vn[j]; }
      rec.waste[i] = waste; rec.deliv[i] = deliv; rec.volD[i] = volD; rec.volW[i] = volW;
    };
    if (record) push();

    let step = 0, t = 0, converged = false, stalled = false, stallReason = '', period = 1;
    const steps = Math.floor(tMax / dt);
    while (step < steps) {
      // 내부 노드
      for (let j = 1; j < N; j++) {
        const cp = Hn[j - 1] + B * Vn[j - 1] - R * Vn[j - 1] * Math.abs(Vn[j - 1]);
        const cm = Hn[j + 1] - B * Vn[j + 1] + R * Vn[j + 1] * Math.abs(Vn[j + 1]);
        let hp = 0.5 * (cp + cm);
        if (hp < C.Hvap) hp = C.Hvap;
        Hp[j] = hp; Vp[j] = (cp - hp) / B;
      }
      // 상류: 공급 탱크 (입구 손실 + 속도 수두)
      {
        const cm = Hn[1] - B * Vn[1] + R * Vn[1] * Math.abs(Vn[1]);
        const v = solveQuad(k0, B, H - cm);
        Vp[0] = v; Hp[0] = cm + B * v;
      }
      // 하류: 펌프 밸브들 (폐수 밸브 부분 열림 + 송출 체크 밸브를 함께 푼다)
      {
        const cp = Hn[N - 1] + B * Vn[N - 1] - R * Vn[N - 1] * Math.abs(Vn[N - 1]);
        if (closingFrom >= 0) psi = Math.max(0, 1 - (t + dt - closingFrom) / C.tClosing);
        // 닫히는 중(부분 열림)일 때만 이분법, 나머지는 닫힌 꼴 해
        const end = (c) => {
          if (psi > 0 && psi < 1) return solveEnd(c);
          if (psi === 1 && !deliv) return c - B * solveQuad(kw, B, c);
          if (psi === 0 && deliv) return c - B * solveQuad(kd, B, c - h);
          if (psi === 0) return c;
          return solveEnd(c);
        };
        let hp = end(cp);
        if (!deliv && hp > h) { deliv = 1; hp = end(cp); }
        if (deliv && vd(hp) < -C.vBack) { deliv = 0; hp = end(cp); }
        if (hp < C.Hvap) hp = C.Hvap;
        lastVw = vw(hp); lastVd = vd(hp);
        Hp[N] = hp; Vp[N] = (cp - hp) / B;
      }
      [Hn, Hp] = [Hp, Hn]; [Vn, Vp] = [Vp, Vn];
      step++; t = step * dt;
      waste = psi > 0 ? 1 : 0;

      const vN = Vn[N], hN = Hn[N];
      if (lastVw > 0) { volW += C.A * lastVw * dt; cur.Vw += C.A * lastVw * dt; }
      if (lastVd !== 0) { volD += C.A * lastVd * dt; cur.Vd += C.A * lastVd * dt; }
      if (hN > cur.peakH) cur.peakH = hN;
      if (hN < cur.minH) cur.minH = hN;

      // 밸브 상태 전이
      if (psi === 1 && closingFrom < 0 && vN >= vc) { closingFrom = t; cur.tClose = t; cur.vClose = vN; }
      else if (psi === 0 && !deliv && hN < Hre) {
        psi = 1; closingFrom = -1; waste = 1;
        cur.tEnd = t; cur.T = t - cur.t0;
        cycles.push(cur);
        cur = { t0: t, tClose: NaN, Vd: 0, Vw: 0, peakH: -Infinity, minH: Infinity, vClose: 0 };
        const k = cycles.length;
        const same = (x, y) => Math.abs(x.T - y.T) < 0.004 * x.T && Math.abs(x.Vd - y.Vd) < 0.004 * Math.max(x.Vd, 1e-9);
        if (k >= 3 && same(cycles[k - 1], cycles[k - 2])) { converged = true; period = 1; }
        else if (k >= 5 && same(cycles[k - 1], cycles[k - 3]) && same(cycles[k - 2], cycles[k - 4])) { converged = true; period = 2; }
      }
      if (record && step % every === 0) push();
      if (converged || cycles.length >= maxCycles) break;
      // 정지 판정: 밸브가 열린 채 닫히지 않음 / 닫힌 채 다시 열리지 않음
      if (closingFrom < 0 && t - cur.t0 > 8) { stalled = true; stallReason = 'noclose'; break; }
      if (psi === 0 && !deliv && t - cur.tClose > 3) { stalled = true; stallReason = 'noreopen'; break; }
    }
    if (record && step % every !== 0) push();
    if (!converged && cycles.length >= 2) period = 2;   // 수렴 못 하면 두 박자 묶음으로 반복(이음매가 덜 튄다)

    const last = cycles[cycles.length - 1];
    let limit;
    if (stalled || !last) {
      const vi = vInf(H);
      limit = {
        stalled: true, reason: stallReason || 'noclose', T: Infinity, bpm: 0, period: 1,
        q: 0, Q: stallReason === 'noreopen' ? 0 : C.A * vi * 60000, eta: 0,
        Vd: 0, Vw: 0, VdBeat: 0, VwBeat: 0, peakH: stallReason === 'noreopen' ? (last ? last.peakH : h) : Hn[N], minH: Hn[N],
        vClose: 0, vMax: Math.max(...Array.from(Vn)), t0: t, tEnd: t,
      };
    } else {
      // 한계 주기 = 마지막 period개 박자 묶음 (주기 2 진동이면 긴 박자·짧은 박자 한 쌍)
      const grp = cycles.slice(-period);
      const T = last.tEnd - grp[0].t0;
      const Vd = grp.reduce((s, c) => s + c.Vd, 0), Vw = grp.reduce((s, c) => s + c.Vw, 0);
      const q = Vd / T * 60000, Q = Vw / T * 60000;   // L/분
      limit = {
        stalled: false, period, T, beatT: T / period, bpm: 60 * period / T, q, Q,
        eta: (q * h) / ((Q + q) * H), Vd, Vw, VdBeat: Vd / period, VwBeat: Vw / period,
        peakH: Math.max(...grp.map((c) => c.peakH)), minH: Math.min(...grp.map((c) => c.minH)),
        vClose: grp.reduce((s, c) => s + c.vClose, 0) / period,
        t0: grp[0].t0, tEnd: last.tEnd, tClose: last.tClose,
      };
    }
    return { par: { H, h, m }, vc, Hre, cycles, limit, converged, stalled, rec, tEnd: t };
  }

  // 녹화된 시뮬레이션의 시각 t 상태 (t > 기록 끝이면 마지막 한계 주기를 반복 재생)
  function loopTime(sim, t) {
    const L = sim.limit;
    if (t <= sim.tEnd || L.stalled) return Math.min(t, sim.tEnd);
    const T = L.T;
    return L.t0 + ((t - L.t0) % T);
  }
  function sampleAt(sim, t, out) {
    const rec = sim.rec, n1 = rec.nodes;
    const tt = loopTime(sim, t);
    const f = tt / rec.dt;
    const i = Math.min(Math.floor(f), rec.n - 2), w = Math.min(Math.max(f - i, 0), 1);
    out.H = out.H || new Float32Array(n1); out.V = out.V || new Float32Array(n1);
    for (let j = 0; j < n1; j++) {
      out.H[j] = rec.H[i * n1 + j] * (1 - w) + rec.H[(i + 1) * n1 + j] * w;
      out.V[j] = rec.V[i * n1 + j] * (1 - w) + rec.V[(i + 1) * n1 + j] * w;
    }
    const k = w < 0.5 ? i : i + 1;
    out.waste = rec.waste[k]; out.deliv = rec.deliv[k];
    // 누적 부피: 반복 구간이면 이전 주기 수만큼 더한다
    const L = sim.limit;
    const laps = !L.stalled && t > sim.tEnd ? Math.floor((t - L.t0) / L.T) : 0;
    out.volD = rec.volD[i] * (1 - w) + rec.volD[i + 1] * w + laps * L.Vd;
    out.volW = rec.volW[i] * (1 - w) + rec.volW[i + 1] * w + laps * L.Vw;
    out.tSim = tt;
    // 주기 안 위치와 단계
    out.phase = phaseOf(sim, tt, out);
    return out;
  }
  // 단계: 'accel' | 'hammer' | 'deliver' | 'recoil' | 'stall'
  function phaseOf(sim, tt, s) {
    if (sim.limit.stalled && tt >= sim.tEnd - 1e-6) return 'stall';
    const c = cycleAt(sim, tt);
    const sinceClose = c && Number.isFinite(c.tClose) ? tt - c.tClose : -1;
    if (sinceClose >= 0 && sinceClose < C.tClosing + 0.03) return 'hammer';
    if (s.waste) return 'accel';
    return s.deliv ? 'deliver' : 'recoil';
  }
  function cycleAt(sim, tt) {
    const cs = sim.cycles;
    for (let i = cs.length - 1; i >= 0; i--) if (tt >= cs[i].t0) return cs[i];
    return null;
  }

  // 양수 높이 h에 따른 양수량·효율 곡선 (화면 B). 한 점씩 계산해 프레임을 나눈다.
  function sweepPoint(H, h, m) {
    const s = simulate({ H, h, m }, { record: false, maxCycles: 10, tMax: 25 });
    return { h, q: s.limit.q, eta: s.limit.eta, stalled: s.limit.stalled };
  }

  // 화면 표시용 높이 축척: 제곱근 압축 (부호 유지). 1 m → 0.23, 40 m → 1.45 (단위: 장면 m)
  const HEIGHT_K = 0.23;
  const visHeight = (head) => Math.sign(head) * HEIGHT_K * Math.sqrt(Math.abs(head));
  const headFromVis = (y) => Math.sign(y) * (y / HEIGHT_K) ** 2;

  // 단위 변환
  const headToBar = (hd) => hd * C.rho * C.g / 1e5;

  return { C, RANGE, vInf, closeSpeed, reopenHead, joukowsky, rigidDelivery, rigidAccel,
    simulate, sampleAt, loopTime, cycleAt, sweepPoint, visHeight, headFromVis, headToBar };
})();
// ==== END PHYSICS ====

// ==== 2 SCENE / RENDERER ====
const QS = new URLSearchParams(location.search);
const LANG = QS.get('lang') === 'en' ? 'en' : 'ko';
document.documentElement.lang = LANG;
const SITE = window.__SITE__ || {};
const QUALITY = { level: (QS.get('lite') === '1' || SITE.quality === 'low') ? 'low' : 'high', ao: true, pr: 1.6 };
if (QUALITY.level === 'low') { QUALITY.ao = false; QUALITY.pr = 1; }

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261011);
const rr = (a, b) => a + (b - a) * rand();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, QUALITY.pr));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.autoUpdate = false; // 그림자는 정적에 가깝다: update()에서 3프레임마다, 움직일 때는 매 프레임 갱신
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x221b16);

function shadowify(o, cast = true, recv = true) {
  o.traverse((m) => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } });
  return o;
}
// 오버레이 깊이 판정에 쓰는 불투명 물체 표시 (유리·물 같은 투명 재질은 제외: 그 안의 입자가 보여야 한다)
function occluder(o) { o.traverse((m) => { if (m.isMesh && !m.material.transparent && !m.isInstancedMesh) m.layers.enable(LAYER_OCC); }); return o; }

function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  t.userData.canvas = c; t.userData.ctx = ctx;
  return t;
}
const FONT = { head: '800 {s}px Outfit, "Noto Sans KR", sans-serif', mono: '500 {s}px "DM Mono", monospace', sans: '500 {s}px "Noto Sans KR", sans-serif' };

function roundedPanel(w, h, d, r, mat, seg = 4) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// 베벨 테두리 (가운데가 빈 액자형)
function bevelFrame(w, h, t, depth, mat, r = 0.01) {
  const outer = roundedRectShape(w, h, r + t * 0.5);
  const hole = roundedRectShape(w - 2 * t, h - 2 * t, r);
  outer.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(outer, { depth, bevelEnabled: true, bevelThickness: Math.min(0.004, depth * 0.4), bevelSize: Math.min(0.004, t * 0.3), bevelSegments: 3, curveSegments: 8 });
  g.translate(0, 0, -depth / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true;
  return m;
}
const _screwHead = new THREE.LatheGeometry([new THREE.Vector2(0, 0.0032), new THREE.Vector2(0.55, 0.003), new THREE.Vector2(0.85, 0.002), new THREE.Vector2(1, 0)].map((p) => new THREE.Vector2(p.x * 0.007, p.y)), 16);
_screwHead.rotateX(Math.PI / 2);
const _screwSlot = new THREE.BoxGeometry(0.0105, 0.0016, 0.0016);
function screw(mat = MAT.chrome, scale = 1, rot = 0) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(_screwHead, mat); g.add(head);
  const slot = new THREE.Mesh(_screwSlot, MAT.slot); slot.position.z = 0.0028; slot.rotation.z = rot; g.add(slot);
  g.scale.setScalar(scale);
  return g;
}
function ventSlits(w, h, n, mat = MAT.slot) {
  const g = new THREE.Group();
  const sh = h / (n * 1.8);
  for (let i = 0; i < n; i++) {
    const s = roundedPanel(w, sh, 0.004, sh * 0.49, mat, 2);
    s.position.y = (i - (n - 1) / 2) * (h / n);
    s.castShadow = false;
    g.add(s);
  }
  return g;
}
// 각인 명판: 황동 판 + 오목하게 새긴 글자 텍스처
function engravedPlate(text, w, h, opts = {}) {
  const g = new THREE.Group();
  const plate = roundedPanel(w, h, opts.depth || 0.006, Math.min(h * 0.3, 0.01), opts.mat || MAT.brass, 3);
  g.add(plate);
  const px = 2048, py = Math.round(px * h / w);
  const tex = canvasTex(px, py, (c, W, H) => {
    c.clearRect(0, 0, W, H);
    const size = Math.round(H * (opts.size || 0.42));
    c.font = font(opts.font || 'mono', size);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    if (opts.letter) c.letterSpacing = `${size * opts.letter}px`;
    const lines = Array.isArray(text) ? text : [text];
    lines.forEach((ln, i) => {
      const y = H / 2 + (i - (lines.length - 1) / 2) * size * 1.25;
      c.fillStyle = 'rgba(255,240,210,0.55)'; c.fillText(ln, W / 2 + 2, y + 2);
      c.fillStyle = 'rgba(40,24,8,0.92)'; c.fillText(ln, W / 2, y);
    });
    if (opts.rule) { c.fillStyle = 'rgba(40,24,8,0.6)'; c.fillRect(W * 0.03, H * 0.12, W * 0.94, 2); c.fillRect(W * 0.03, H * 0.88, W * 0.94, 2); }
  });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.98, h * 0.94), new THREE.MeshStandardMaterial({ map: tex, transparent: true, metalness: 0.7, roughness: 0.45, depthWrite: false }));
  face.position.z = (opts.depth || 0.006) / 2 + 0.0004;
  g.add(face);
  if (opts.screws !== false) {
    for (const sx of [-1, 1]) { const s = screw(MAT.brassD, 0.9); s.position.set(sx * (w / 2 - h * 0.32), 0, (opts.depth || 0.006) / 2); g.add(s); }

// 다이얼: 둥근 노브 + 값만큼 채워지는 발광 원호. 270° 범위, 왼쪽 아래(최소) → 오른쪽 아래(최대)
const ARC_START = Math.PI * 1.25, ARC_SWEEP = Math.PI * 1.5;
function knobWithArc(opts) {
  const R = opts.radius || 0.07;
  const g = new THREE.Group();
  // 바닥 판 (눈금·숫자 인쇄)
  const face = canvasTex(512, 512, (c, W) => {
    c.fillStyle = '#1b1a19'; c.beginPath(); c.arc(W / 2, W / 2, W / 2, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.06)'; c.lineWidth = 3; c.beginPath(); c.arc(W / 2, W / 2, W * 0.47, 0, Math.PI * 2); c.stroke();
    const ticks = opts.ticks || [];
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = 0; i <= 40; i++) {
      const f = i / 40, a = ARC_START - f * ARC_SWEEP;
      const major = i % 10 === 0;
      const r0 = W * (major ? 0.33 : 0.355), r1 = W * 0.385;
      c.strokeStyle = major ? 'rgba(240,232,220,0.85)' : 'rgba(240,232,220,0.35)'; c.lineWidth = major ? 4 : 2;
      c.beginPath(); c.moveTo(W / 2 + Math.cos(a) * r0, W / 2 - Math.sin(a) * r0); c.lineTo(W / 2 + Math.cos(a) * r1, W / 2 - Math.sin(a) * r1); c.stroke();
    }
    c.font = font('mono', 30); c.fillStyle = 'rgba(240,232,220,0.8)';
    for (const [f, txt] of ticks) { const a = ARC_START - f * ARC_SWEEP; c.fillText(txt, W / 2 + Math.cos(a) * W * 0.28, W / 2 - Math.sin(a) * W * 0.28); }
    c.font = font('mono', 26); c.fillStyle = 'rgba(255,179,107,0.9)'; c.fillText(opts.label || '', W / 2, W * 0.86);
  });
  const base = new THREE.Mesh(new THREE.CircleGeometry(R * 2.05, 64), new THREE.MeshStandardMaterial({ map: face, roughness: 0.6, metalness: 0.2 }));
  base.position.z = 0.001; g.add(base);
  // 발광 원호
  const arcMat = new THREE.ShaderMaterial({
    uniforms: { uFill: { value: 0.5 }, uColor: { value: new THREE.Color(opts.color || 0x7dd3fc) }, uGain: { value: 3.0 } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform float uFill; uniform vec3 uColor; uniform float uGain; varying vec2 vP;
      void main(){ float a = atan(vP.y, vP.x); float s = ${ARC_START.toFixed(6)};
        float d = s - a; if (d < 0.0) d += 6.2831853; float f = d / ${ARC_SWEEP.toFixed(6)};
        if (f > 1.0) discard;
        float on = step(f, uFill);
        vec3 c = mix(vec3(0.06,0.07,0.08), uColor * uGain, on);
        float edge = smoothstep(0.0, 0.012, abs(f - uFill)); c += uColor * (1.0 - edge) * on * 1.5;
        gl_FragColor = vec4(c, 1.0); }`,
    toneMapped: false,
  });
  const arc = new THREE.Mesh(new THREE.RingGeometry(R * 1.62, R * 1.82, 128, 1, ARC_START - ARC_SWEEP, ARC_SWEEP), arcMat);
  arc.position.z = 0.002; g.add(arc);
  // 노브 본체 (선반 단면 → 회전체)
  const prof = [[0, 0], [R * 0.98, 0], [R, R * 0.06], [R, R * 0.62], [R * 0.96, R * 0.7], [R * 0.82, R * 0.74], [R * 0.78, R * 0.8], [0, R * 0.82]].map(([x, y]) => new THREE.Vector2(x, y));
  const kg = new THREE.LatheGeometry(prof, 48); kg.rotateX(Math.PI / 2);
  const knob = new THREE.Group();
  const body = new THREE.Mesh(kg, opts.knobMat || MAT.graphiteL); body.castShadow = true; knob.add(body);
  // 손잡이 홈(널링)
  const ridge = new THREE.BoxGeometry(R * 0.06, R * 0.06, R * 0.5);
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    const m = new THREE.Mesh(ridge, MAT.graphiteD);
    m.position.set(Math.cos(a) * R * 0.99, Math.sin(a) * R * 0.99, R * 0.33); m.rotation.z = a; knob.add(m);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.76, R * 0.76, 0.003, 48).rotateX(Math.PI / 2), MAT.chrome);
  cap.position.z = R * 0.82; knob.add(cap);
  const ind = new THREE.Mesh(new THREE.BoxGeometry(R * 0.08, R * 0.5, 0.004), new THREE.MeshBasicMaterial({ color: new THREE.Color(opts.color || 0x7dd3fc).multiplyScalar(3), toneMapped: false }));
  ind.position.set(0, R * 0.4, R * 0.83); knob.add(ind);
  g.add(knob);
  g.userData = { knob, arcMat, R };
  const set = (f) => { arcMat.uniforms.uFill.value = f; knob.rotation.z = ARC_START - f * ARC_SWEEP - Math.PI / 2; };
  return { group: g, knob, set, arcMat };
}

// LED 트랙 물리 슬라이더
function ledSlider(opts) {
  const len = opts.length || 0.5, n = opts.n || 24;
  const g = new THREE.Group();
  const track = roundedPanel(len + 0.05, 0.05, 0.012, 0.006, MAT.graphiteD, 3); g.add(track);
  const groove = roundedPanel(len, 0.008, 0.004, 0.0039, MAT.slot, 2); groove.position.set(0, 0.008, 0.006); g.add(groove);
  const ledGeo = new THREE.BoxGeometry(len / n * 0.62, 0.008, 0.004);
  const ledMat = new THREE.MeshBasicMaterial({ toneMapped: false });
  const leds = new THREE.InstancedMesh(ledGeo, ledMat, n);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < n; i++) { dummy.position.set(-len / 2 + (i + 0.5) * len / n, -0.012, 0.0065); dummy.updateMatrix(); leds.setMatrixAt(i, dummy.matrix); leds.setColorAt(i, new THREE.Color(0x111111)); }
  g.add(leds);
  const handle = new THREE.Group();
  const hb = roundedPanel(0.03, 0.05, 0.03, 0.008, MAT.chrome, 4); hb.position.z = 0.02; handle.add(hb);
  for (let i = -2; i <= 2; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.002, 0.002), MAT.graphiteD); r.position.set(0, i * 0.007, 0.0355); handle.add(r); }
  const tri = new THREE.Mesh(new THREE.ConeGeometry(0.008, 0.012, 3), MAT.brass); tri.rotation.z = 0; tri.position.set(0, -0.038, 0.008); handle.add(tri);
  g.add(handle);
  const colOn = new THREE.Color(opts.color || 0xffb36b).multiplyScalar(2.6), colOff = new THREE.Color(0x15130f);
  const set = (f) => {
    handle.position.x = -len / 2 + f * len;
    for (let i = 0; i < n; i++) leds.setColorAt(i, (i + 0.5) / n <= f ? colOn : colOff);
    leds.instanceColor.needsUpdate = true;
  };
  return { group: g, handle: hb, set, len };
}

// 그래프 화면: 어두운 화면 + 격자 + 발광 곡선 (drawFn이 매번 다시 그림)
function graphScreen(w, h, drawFn, pxW = 768) {
  const g = new THREE.Group();
  const bez = roundedPanel(w + 0.04, h + 0.04, 0.02, 0.012, MAT.graphiteD, 3); bez.position.z = -0.006; g.add(bez);
  const frame = bevelFrame(w + 0.03, h + 0.03, 0.012, 0.008, MAT.graphiteL, 0.008); frame.position.z = 0.006; g.add(frame);
  const pxH = Math.round(pxW * h / w);
  const tex = canvasTex(pxW, pxH, () => {});
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
  scr.position.z = 0.005; g.add(scr);
  const cover = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.22, depthWrite: false }));
  cover.position.z = 0.0075; g.add(cover);
  for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const s = screw(MAT.chrome, 0.75, sx * sy * 0.6); s.position.set(sx * (w / 2 + 0.012), sy * (h / 2 + 0.012), 0.012); g.add(s); }
  const ctx = tex.userData.ctx;
  const redraw = (...args) => { drawFn(ctx, pxW, pxH, ...args); tex.needsUpdate = true; };
  return { group: g, ctx, tex, redraw, screen: scr };
}

function skyTexture() {
  return canvasTex(1024, 768, (c, W, H) => {
    const sky = c.createLinearGradient(0, 0, 0, H * 0.62);
    sky.addColorStop(0, '#7fb6e6'); sky.addColorStop(0.55, '#bcd9ee'); sky.addColorStop(1, '#f3d9b5');
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 6; i++) { const x = rand() * W, y = rand() * H * 0.3 + 30; c.beginPath(); c.ellipse(x, y, 60 + rand() * 90, 10 + rand() * 12, 0, 0, Math.PI * 2); c.fill(); }
    const hill = (y0, amp, col, seed) => {
      const R = mulberry32(seed); c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W; x += 32) c.lineTo(x, y0 - amp * (0.5 + 0.5 * Math.sin(x * 0.006 + seed)) - R() * amp * 0.25);
      c.lineTo(W, H); c.closePath(); c.fill();
    };
    hill(H * 0.62, 80, '#8fae8a', 3); hill(H * 0.72, 60, '#6f9467', 7); hill(H * 0.84, 40, '#577a4f', 11);
    // 개울
    c.strokeStyle = 'rgba(200,232,250,0.85)'; c.lineWidth = 10; c.beginPath(); c.moveTo(W * 0.15, H); c.bezierCurveTo(W * 0.35, H * 0.82, W * 0.55, H * 0.9, W * 0.7, H * 0.76); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 2; c.stroke();
  });
}

function gaugeFaceTexture(unit, vmin, vmax, nMajor, sub = 5) {
  return canvasTex(512, 512, (c, W) => {
    const g = c.createRadialGradient(W / 2, W / 2, 10, W / 2, W / 2, W / 2);
    g.addColorStop(0, '#f4ecdf'); g.addColorStop(1, '#d9ccb8');
    c.fillStyle = g; c.beginPath(); c.arc(W / 2, W / 2, W / 2, 0, Math.PI * 2); c.fill();
    const a0 = Math.PI * 1.25, sw = Math.PI * 1.5;
    c.strokeStyle = '#2a2420'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#2a2420';
    for (let i = 0; i <= nMajor * sub; i++) {
      const f = i / (nMajor * sub), a = a0 - f * sw, major = i % sub === 0;
      const r0 = W * (major ? 0.36 : 0.4), r1 = W * 0.44;
      c.lineWidth = major ? 5 : 2; c.beginPath(); c.moveTo(W / 2 + Math.cos(a) * r0, W / 2 - Math.sin(a) * r0); c.lineTo(W / 2 + Math.cos(a) * r1, W / 2 - Math.sin(a) * r1); c.stroke();
      if (major) { c.font = font('mono', 36); c.fillText(String(Math.round(vmin + f * (vmax - vmin))), W / 2 + Math.cos(a) * W * 0.28, W / 2 - Math.sin(a) * W * 0.28); }
    }
    c.strokeStyle = '#b4281a'; c.lineWidth = 8; c.beginPath(); c.arc(W / 2, W / 2, W * 0.44, a0 - sw, a0 - sw * 0.82); c.stroke();
    c.font = font('mono', 30); c.fillStyle = '#5a5048'; c.fillText(unit, W / 2, W * 0.72);
  });
}

}

function deliveryPath(yn) {
  const P = new THREE.CurvePath();
  const v = (x, y, z) => new THREE.Vector3(x, y, z);
  const y0 = DATUM + 0.04, xr = 0.25, zr = DTANK.z;
  P.add(new THREE.LineCurve3(v(CHAMBER.x, y0, CHAMBER.z - 0.07), v(CHAMBER.x, y0, -0.24)));
  P.add(new THREE.QuadraticBezierCurve3(v(CHAMBER.x, y0, -0.24), v(CHAMBER.x, y0, zr), v(xr + 0.03, y0, zr)));
  P.add(new THREE.QuadraticBezierCurve3(v(xr + 0.03, y0, zr), v(xr, y0, zr), v(xr, y0 + 0.05, zr)));
  P.add(new THREE.LineCurve3(v(xr, y0 + 0.05, zr), v(xr, yn + 0.04, zr)));
  P.add(new THREE.QuadraticBezierCurve3(v(xr, yn + 0.04, zr), v(xr, yn + 0.09, zr), v(xr - 0.05, yn + 0.09, zr)));
  P.add(new THREE.LineCurve3(v(xr - 0.05, yn + 0.09, zr), v(DTANK.x + 0.06, yn + 0.09, zr)));

  return P;
}

function scaleStripTexture(len) {
  const H = 2048, W = 96;
  return canvasTex(W, H, (c) => {
    c.fillStyle = '#d9d0c2'; c.fillRect(0, 0, W, H);
    const yOf = (head) => H - ((DATUM + PHYS.visHeight(head)) - (TOP + 0.02)) / len * H;
    c.fillStyle = '#2a2420'; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let v = 0; v <= 40; v++) {
      const major = v <= 5 || v % 5 === 0; if (!major && v > 5) continue;
      const y = yOf(v), big = v === 0 || v === 1 || v === 2 || v === 5 || v % 10 === 0;
      c.fillRect(0, y - (big ? 2 : 1), big ? 46 : 28, big ? 4 : 2);
      if (big) { c.font = font('mono', 30); c.fillText(v === 40 ? '40m' : String(v), 50, y); }
    }
    c.fillStyle = '#7a6a58'; c.font = font('mono', 22); c.save(); c.translate(W - 14, H * 0.08); c.rotate(Math.PI / 2); c.fillText('√ SCALE', 0, 0); c.restore();
  });
}

// 장치 형상 갱신: H, h가 바뀔 때만 관을 다시 만든다
function updateApparatusGeometry(Hv, hv) {
  const ys = supplySurfaceY(Hv), yb = ys - TANK.depth - 0.008;
  if (!(Math.abs(yb - HERO.cache.tankBottom) <= 1e-4)) {
    HERO.cache.tankBottom = yb;
    HERO.supply.position.set(TANK.x, yb, TANK.z);
    HERO.wheel.rotation.z = -yb * 18;
    const curve = drivePath(yb); HERO.curve = curve;
    HERO.pipeGlass.geometry.dispose(); HERO.pipeGlass.geometry = new THREE.TubeGeometry(curve, 120, PIPE_R, 24, false);
    HERO.pipeCore.geometry.dispose(); HERO.pipeCore.geometry = new THREE.TubeGeometry(curve, 160, CORE_R, 20, false);
    // 관 이음 고리와 받침 (관을 따라 다시 배치)
    HERO.pipeRings.clear(); HERO.supports.clear();
    for (const u of [0.0, 0.33, 0.66, 1.0]) {
      const p = curve.getPointAt(u), tg = curve.getTangentAt(u);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(PIPE_R + 0.004, 0.006, 8, 28), u === 0 || u === 1 ? MAT.brass : MAT.brassD);
      ring.position.copy(p); ring.lookAt(p.clone().add(tg)); ring.castShadow = true; HERO.pipeRings.add(ring);
    }
    for (const u of [0.3, 0.62]) {
      const p = curve.getPointAt(u);
      const hgt = p.y - PIPE_R - TOP;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, hgt, 12), MAT.graphiteL); post.position.set(p.x, TOP + hgt / 2, p.z); post.castShadow = true; HERO.supports.add(post);
      const saddle = new THREE.Mesh(new THREE.TorusGeometry(PIPE_R + 0.008, 0.007, 8, 24, Math.PI), MAT.brassD); saddle.position.set(p.x, p.y, p.z); saddle.rotation.set(0, Math.atan2(curve.getTangentAt(u).x, curve.getTangentAt(u).z), Math.PI); saddle.castShadow = true; HERO.supports.add(saddle);
      const foot = roundedPanel(0.08, 0.012, 0.08, 0.004, MAT.graphiteD, 2); foot.position.set(p.x, TOP + 0.006, p.z); HERO.supports.add(foot);
    }
    occluder(HERO.supports);
    HERO.stream.scale.y = 1.98 - ys; HERO.stream.position.y = (1.98 + ys) / 2;
    HERO.markH.position.y = ys;
  }
  const yn = nozzleY(hv);
  if (!(Math.abs(yn - HERO.cache.yn) <= 1e-4)) {
    HERO.cache.yn = yn;
    const dp = deliveryPath(yn); HERO.dCurve = dp;
    HERO.dPipe.geometry.dispose(); HERO.dPipe.geometry = new THREE.TubeGeometry(dp, 200, 0.013, 14, false);
    HERO.dtank.position.set(DTANK.x, yn - DTANK.h / 2 - 0.03, DTANK.z);
    HERO.nozzle.position.set(DTANK.x + 0.02, yn + 0.03, DTANK.z);
    HERO.markh.position.y = yn;
  }
}

// ==== 7 PHENOMENON SHADERS ====
// 구동관 물기둥: 노드 21개의 수두·속도를 담은 데이터 텍스처를 읽어 압력 → 색, 압력 기울기 → 파면 발광
const PHEN = {};
{
  const NN = PHYS.C.N + 1, TEXW = 32;
  PHEN.data = new Float32Array(TEXW * 4);
  PHEN.tex = new THREE.DataTexture(PHEN.data, TEXW, 1, THREE.RGBAFormat, THREE.FloatType);
  PHEN.tex.minFilter = PHEN.tex.magFilter = THREE.NearestFilter; PHEN.tex.needsUpdate = true;
  PHEN.coreMat = new THREE.ShaderMaterial({
    uniforms: {
      uData: { value: PHEN.tex }, uN: { value: NN }, uTexW: { value: TEXW },
      uH: { value: 2 }, uh: { value: 15 }, uShowP: { value: 1 }, uGain: { value: 1 }, uTime: { value: 0 }, uFlow: { value: 0 },
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
    vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.0); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `uniform sampler2D uData; uniform float uN, uTexW, uH, uh, uShowP, uGain, uTime, uFlow;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      vec2 at(float s){ float f = clamp(s,0.0,1.0)*(uN-1.0); float i = floor(f); float w = f - i;
        vec4 a = texture2D(uData, vec2((i+0.5)/uTexW, 0.5)); vec4 b = texture2D(uData, vec2((min(i+1.0,uN-1.0)+0.5)/uTexW, 0.5));
        return mix(a.xy, b.xy, w); }
      vec3 ramp(float hd){
        vec3 vac = vec3(0.42,0.24,0.95), low = vec3(0.06,0.22,0.62), sup = vec3(0.16,0.72,0.95), mid = vec3(0.62,0.9,1.0), hi = vec3(1.0,1.0,1.0);
        if (hd < 0.0) return mix(low, vac, clamp(-hd/9.0, 0.0, 1.0));
        if (hd < uH) return mix(low, sup, hd/max(uH,1e-3));
        float x = (hd - uH) / max(uh - uH, 1e-3);
        if (x < 0.5) return mix(sup, mid, x/0.5);
        return mix(mid, hi, clamp((x-0.5)/0.5, 0.0, 1.0));
      }
      void main(){
        vec2 d = at(vUv.x); float hd = d.x;
        float ds = 1.0/(uN-1.0);
        float grad = abs(at(vUv.x + ds*0.5).x - at(vUv.x - ds*0.5).x) / max(uh, 1.0);
        float rim = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.6);
        vec3 water = vec3(0.12, 0.5, 0.7);
        vec3 c = mix(water, ramp(hd), uShowP);
        float front = smoothstep(0.08, 0.5, grad) * uShowP;
        float ripple = 0.5 + 0.5*sin((vUv.x*46.0 - uFlow)*6.2831 + vUv.y*6.2831);
        float core = 0.32 + 0.1*ripple*(1.0-uShowP);
        vec3 col = c * (core + 0.85*rim) + vec3(0.75,0.9,1.0) * front * 1.1;
        gl_FragColor = vec4(col * uGain, 1.0);
      }`,
  });
  // 흐름 입자: 관 속을 지역 유속으로 이동하는 짧은 스트릭
  const nP = QUALITY.level === 'low' ? 70 : 150;
  PHEN.nP = nP;
  PHEN.pu = new Float32Array(nP); PHEN.pr = new Float32Array(nP); PHEN.pa = new Float32Array(nP);
  const R = mulberry32(77);
  for (let i = 0; i < nP; i++) { PHEN.pu[i] = R(); PHEN.pr[i] = Math.sqrt(R()) * (CORE_R - 0.008); PHEN.pa[i] = R() * Math.PI * 2; }
  PHEN.particles = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.0035, 0.02, 2, 6).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xd9f4ff).multiplyScalar(1.6), transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }), nP);
  PHEN.particles.frustumCulled = false; PHEN.particles.renderOrder = 4;
  // 분출 입자 (폐수 밸브 / 송출 노즐): 점 셰이더

// 캡션 상태기계: 항상 실제 숫자 2~4개가 들어간 완결 문장
function captionFor(s) {
  const L = SIM.limit, P = SIM.par, en = LANG === 'en';
  const n = (v) => `<span class="n">${v}</span>`, w = (v) => `<span class="w">${v}</span>`;
  const vN = s.V[PHYS.C.N];
  if (!S.started) return en ? `<span class="tag">ready</span>Press the <b>waste valve</b> (the brass disk with weights) to start the first beat. Supply head is ${w(fx(P.H) + ' m')}, lift height ${n(fx(P.h, 0) + ' m')}.`
    : `<span class="tag">대기</span><b>폐수 밸브</b>(추가 얹힌 황동 원판)를 눌러 첫 박자를 시작해 보세요. 지금 공급 낙차는 ${w(fx(P.H) + ' m')}, 양수 높이는 ${n(fx(P.h, 0) + ' m')}입니다.`;
  if (S.needsRestart) return en ? `<span class="tag">stopped</span>The pump is stopped. After changing the setup, <b>press the waste valve</b> to restart it — real rams are started by hand too. New setup: H ${w(fx(S.H.tgt) + ' m')}, h ${n(fx(S.h.tgt, 0) + ' m')}.`
    : `<span class="tag">정지</span>펌프가 멈춰 있습니다. 조건을 바꾼 뒤에는 <b>폐수 밸브를 눌러</b> 다시 시동합니다. 실제 수격펌프도 손으로 눌러 시동합니다. 새 조건: H ${w(fx(S.H.tgt) + ' m')}, h ${n(fx(S.h.tgt, 0) + ' m')}.`;
  if (s.phase === 'stall' || (L.stalled && L.reason === 'noclose')) {
    if (L.reason === 'noreopen') return en ? `<span class="tag">stalled</span>The recoil is too weak: valve-side pressure stays above ${n(fx(SIM.Hre, 2) + ' m')} so the waste valve never reopens. The pump has stopped — lower the supply head or raise the lift height.`
      : `<span class="tag">정지</span>되튐이 약해 밸브 쪽 압력이 ${n(fx(SIM.Hre, 2) + ' m')} 아래로 내려가지 않습니다. 폐수 밸브가 다시 열리지 않아 펌프가 멈췄습니다. 공급 낙차를 낮추거나 양수 높이를 올려 보세요.`;
    return en ? `<span class="tag">stalled</span>The flow tops out at ${n(fx(PHYS.vInf(P.H), 2) + ' m/s')}, but lifting the ${w(Math.round(P.m * 1000) + ' g')} weight needs ${n(fx(SIM.vc, 2) + ' m/s')}. The valve never shuts, so <b>every drop is wasted</b> (${n(fx(L.Q, 0) + ' L/min')}).`
      : `<span class="tag">정지</span>물이 최고 ${n(fx(PHYS.vInf(P.H), 2) + ' m/s')}에 그치는데, ${w(Math.round(P.m * 1000) + ' g')} 추를 들려면 ${n(fx(SIM.vc, 2) + ' m/s')}가 필요합니다. 밸브가 닫히지 않아 <b>물이 전부 버려집니다</b>(${n(fx(L.Q, 0) + ' L/분')}).`;
  }
  const c = PHYS.cycleAt(SIM, s.tSim);
  if (s.phase === 'accel') return en ? `<span class="tag">accelerating</span>Water speeds up down the drive pipe: ${n(fx(Math.max(vN, 0), 2) + ' m/s')} now, the valve slams at ${n(fx(SIM.vc, 2) + ' m/s')}. Meanwhile it spills out — ${w(fL(L.VwBeat * 1000) + ' L')} per beat.`
    : `<span class="tag">가속</span>물이 구동관을 내려가며 빨라지는 중: 지금 ${n(fx(Math.max(vN, 0), 2) + ' m/s')}, 밸브는 ${n(fx(SIM.vc, 2) + ' m/s')}에서 닫힙니다. 그동안 한 박자에 ${w(fL(L.VwBeat * 1000) + ' L')}가 버려집니다.`;
  if (s.phase === 'hammer') {
    const before = c ? PHYS.sampleAt(SIM, Math.max(c.tClose - 0.002, 0), {}).H[PHYS.C.N] : 0;
    const jk = PHYS.joukowsky(SIM.vc);
    return en ? `<span class="tag">water hammer</span>The valve shut: valve-side pressure jumped from ${n(fx(before, 1) + ' m')} to ${w(fx(L.peakH, 1) + ' m')} of head. Without the delivery valve it would hit ${n(fx(jk, 0) + ' m')} (a·Δv/g).`
      : `<span class="tag">수격</span>밸브가 닫히자 밸브 쪽 압력이 ${n(fx(before, 1) + ' m')}에서 ${w(fx(L.peakH, 1) + ' m')} 수두로 뛰었습니다. 송출 밸브가 없었다면 ${n(fx(jk, 0) + ' m')}까지 올랐을 압력입니다(a·Δv/g).`;
  }
  if (s.phase === 'deliver') return en ? `<span class="tag">delivering</span>The slowing water column pushes ${n(fL(L.VdBeat * 1000) + ' L')} per beat up ${w(fx(P.h, 0) + ' m')} — ${fx(P.h / P.H, 1)}× higher than it fell.`
    : `<span class="tag">송출</span>멈춰 가는 물기둥이 한 박자에 ${n(josa(fL(L.VdBeat * 1000) + ' L', '을/를'))} ${w(fx(P.h, 0) + ' m')} 위로 밀어 올리는 중. 떨어진 높이의 ${n(fx(P.h / P.H, 1) + '배')}입니다.`;
  return en ? `<span class="tag">recoil</span>Recoil: pressure at the valve drops to ${n(fx(L.minH, 1) + ' m')}, below the ${w(fx(SIM.Hre, 2) + ' m')} the weight needs, so the waste valve falls open again.`
    : `<span class="tag">되튐</span>되튐으로 밸브 쪽 압력이 ${n(fx(L.minH, 1) + ' m')}까지 떨어집니다. 추가 버티는 ${w(fx(SIM.Hre, 2) + ' m')}보다 낮아 폐수 밸브가 다시 열립니다.`;
}

    if (window.__SITE__ && window.__SITE__.brand) $('bShare').style.display = 'none'; // 사이트 셸에 공유가 있다

    $('tourClose').onclick = () => tourEnd();
    $('tourPrev').onclick = () => tourGo(TOUR.i - 1);

  sheet() { const h = document.getElementById('panel').getBoundingClientRect().height; document.documentElement.style.setProperty('--sheet', `${Math.round(h)}px`); },

function buildWeights(m) {

function valveSeries(sim, tNow, span, n, out) {
  const rec = sim.rec, n1 = rec.nodes, N = n1 - 1;
  for (let k = 0; k < n; k++) {
    const t = tNow - span + (k / (n - 1)) * span;
    if (t < 0) { out[k] = NaN; continue; }
    const tt = PHYS.loopTime(sim, t), f = tt / rec.dt, i = Math.min(Math.floor(f), rec.n - 2), w = clamp(f - i, 0, 1);
    out[k] = rec.H[i * n1 + N] * (1 - w) + rec.H[(i + 1) * n1 + N] * w;
  }
  return out;
}

function inHammerWindow(sim, t) {

function update(dt) {

  time(t) { S.tSim = t; },
  play(b) { S.playing = b; UI.syncButtons(); },
  start() { restart(false); },
  step(n = 1, dt = 1 / 60) { window.__labManual = true; for (let i = 0; i < Math.min(n, 120); i++) update(dt); return { t: S.tSim, phase: S.sample && S.sample.phase }; },
  resume() { window.__labManual = false; lastT = performance.now(); },
  async capture(name) {
    const w = innerWidth, h = innerHeight;
    if (!canvas.width || !canvas.height || Math.abs(canvas.clientWidth - w) > 1 || Math.abs(canvas.clientHeight - h) > 1) onResize();
    update(0);
    const url = canvas.toDataURL('image/jpeg', 0.9);
    const r = await fetch(`/__save/${name}.jpg`, { method: 'POST', body: url });
    return r.ok ? `${name}.jpg` : `fail ${r.status}`;
  },
  quality: setQuality,
  searchHero, evalHero() { camera.updateMatrixWorld(); return evalShot(camera, innerWidth, innerHeight, hudRects(innerWidth, innerHeight)); },
  perf() { return { avg: PERF.last, pr: renderer.getPixelRatio(), ao: PIPE.gtao.enabled, bokeh: PIPE.bokeh.enabled, calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; },
};

async function init() {
  try { await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]); } catch {}
  buildRoom(); buildConsole(); buildHero(); buildWeights(S.m.tgt); buildOverlays(); buildLights(); buildStudio(); buildPipeline(); buildCamera();
  tagPickables();
  UI.init();
  addEventListener('resize', onResize);
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  addEventListener('keydown', onKey); addEventListener('keyup', onKeyUp);
  restart(true);
  onResize();
  updateApparatusGeometry(S.H.cur, S.h.cur);
  frame();
  setTimeout(() => document.body.classList.remove('intro'), 300);
  // 첫 화면: 잠깐 정지 상태를 보여 준 뒤 스스로 시동 (투어 중이 아니면)
  setTimeout(() => { if (!S.started && TOUR.i < 0 && !window.__labManual && !QS.has('idle')) restart(false); }, 1800);
  if (QS.has('tour')) tourGo(0);
}
init().catch((e) => { console.error(e); const d = document.createElement("pre"); d.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99;color:#fca5a5;background:#000a;padding:8px;font:12px monospace;white-space:pre-wrap;max-width:90vw"; d.textContent = String(e && e.stack || e); document.body.appendChild(d); });

</script>
