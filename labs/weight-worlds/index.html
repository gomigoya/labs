function drawGraphs(){
  const i=PHYS.bodyFromRailX(PHYS.bodyRailX(Math.round(S.body.value))), n=Math.round(S.nWeights.value);

  const keys=[`${i}:${n}:${baselineBody}`,`${i}:${S.trial?.runId||0}`];
  GRAPHS.forEach((g,index)=>{
    if(S.graphKeys[index]===keys[index])return;S.graphKeys[index]=keys[index];

    for(let k=0;k<=10;k++){const x=L+(R-L)*k/10;c.beginPath();c.moveTo(x,T);c.lineTo(x,B);c.stroke();}
    for(let k=0;k<=6;k++){const y=T+(B-T)*k/6;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();}
    const dot=(x,y,r,color)=>{c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();};
    const forceColor='#'+new THREE.Color(inkConfig().diagram.force).getHexString(),mint='#'+new THREE.Color(inkConfig().diagram.mint).getHexString();
    if(!index){

        c.strokeStyle=reference?'#'+new THREE.Color(inkConfig().diagram.reference).getHexString():forceColor;c.lineWidth=3;c.setLineDash(reference?[9,7]:[]);c.beginPath();
        let last=null;

          const spring=PHYS.springState(reference?baselineBody:i,k),x=L+PHYS.railX(k)*(R-L),y=B-spring.shownMarks/PHYS.C.springLimit*(B-T);
          if(spring.broken){

            const limitX=L+clamp((limitWeights-PHYS.RANGE.nWeights[0])/(PHYS.RANGE.nWeights[1]-PHYS.RANGE.nWeights[0]),0,1)*(R-L);
            if(last){c.lineTo(limitX,T);c.stroke();}c.setLineDash([]);c.beginPath();c.moveTo(limitX-9,T+7);c.lineTo(limitX+5,T-3);c.moveTo(limitX+1,T+7);c.lineTo(limitX+15,T-3);c.stroke();break;
          }

        }c.stroke();c.setLineDash([]);

      const x=L+PHYS.railX(n)*(R-L),y=B-PHYS.springState(i,n).shownMarks/PHYS.C.springLimit*(B-T);
      c.strokeStyle=forceColor;c.beginPath();c.moveTo(x,T);c.lineTo(x,B);c.stroke();dot(x,y,6,forceColor);
      for(let k=1;k<=5;k++)for(let d=0;d<k;d++)dot(L+PHYS.railX(k)*(R-L)+(d-(k-1)/2)*9,237,3,mint);

  const circle=(x,y,r,dash=false)=>`<circle cx="${x}" cy="${y}" r="${r}"${dash?' stroke-dasharray="4 4"':''}/>`;
  const dots=(x,y,n)=>Array.from({length:n},(_,k)=>circle(x+(k-(n-1)/2)*10,y,3.5)).join('');

    if(i===0)out+=line(`M${x-7} ${y-8}l7 3-3 6 9 4`,false,hex(palette.mint));

    if(i===7)for(let k=0;k<8;k++){const a=k*Math.PI/4;out+=line(`M${x+Math.cos(a)*15} ${y+Math.sin(a)*15}l${Math.cos(a)*4} ${Math.sin(a)*4}`);}

      line(`M${x-36} ${65+tilt}L${x+36} ${65-tilt}`,false,hex(palette.mint))+
      line(`M${x-36} ${65+tilt}v25m-16 0h32M${x+36} ${65-tilt}v25m-16 0h32`,false,hex(palette.ink))+

  setLayer:layer, layerOn:name=>name in GRAMMAR.enabled?GRAMMAR.enabled[name]:S.layers[name]!==false,
  getCloser:()=>S.body.value,
  setCloser(value,immediate=false){
    const playing=this.getPlaying();set('body',value);
    if(A.active&&!S.trial){runTrial();if(!playing)this.play(false);}
    if(immediate)S.body.value=value;
  },
  getPlaying:()=>!!S.playing.target,
  play(on){if(on&&!S.trial)runTrial();S.playing.value=S.playing.target=+on;syncUI();},
  oneFrame(){const on=S.playing.target;this.play(true);step(1);this.play(on);},
  ui(on){S.ui.value=S.ui.target=+on;document.body.classList.toggle('hide-ui',!on);window.__site?.setVisible(on);},
  getUI:()=>!!S.ui.target,
  fly:flyTo,
  shotForStage:row=>S.vertical?SHOTS_VERTICAL[0]:SHOTS[row.shot],
  quests:QUESTS, getQuest:()=>Q.i,
  bindMode(state){Object.defineProperty(Q,'free',{get:()=>state.mode!=='student',set(value){if(state.mode!=='teacher')state.mode=value?'free':'student';},enumerable:true,configurable:true});},
  questMode(free){QUEST.mode(free);},
  selectQuest(i){
    this.frameKey='';T.ab=null;QUEST.go(i);Q.free=true;Q.phase='act';DIRECTOR.clear();
    for(const name of ['body','nWeights'])S[name].value=S[name].target;
    TEACHER.layers([...this.layerOrder.filter(n=>!GRAMMAR.LAYERS.includes(n)),...QUESTS[i].layers,'양의 관계']);
    shot(S.vertical?SHOTS_VERTICAL[0]:SHOTS[1],S.vertical);questUI();
  },
  cardBusy:()=>!Q.free&&['intro','predict','observe','confirm','card'].includes(Q.phase),
  reset(){
    this.frameKey='';
    if(S.drag)endDrag({pointerId:S.drag.id});S.fly=null;controls.enabled=true;
    Q.completed.clear();Q.stars.fill(0);Q.pick=null;S.runId=0;S.sound.value=S.sound.target=0;
    GRAMMAR.unpin();GRAMMAR.resetRecords();DIRECTOR.clear();QUEST.go(0);Q.free=true;Q.phase='act';
    preset(0);for(const name of this.layerOrder.filter(n=>!GRAMMAR.LAYERS.includes(n)))layer(name,true);
    updateHero();GRAMMAR.update(10);shot(S.vertical?0:1,S.vertical);syncUI();
  },
  startStudent(){for(const name of TEACHER_CFG.layerOrder.filter(n=>!GRAMMAR.LAYERS.includes(n)))layer(name,true);QUEST.go(0);},
  refresh(){for(const name of this.layerOrder.filter(n=>!GRAMMAR.LAYERS.includes(n)))layer(name,true);questUI();}, visibilityReset(){S.lastTime=0;},
  frameViewport(){
    const strip=teacherStrip.getBoundingClientRect(),top=document.getElementById('quests').getBoundingClientRect().bottom+12;
    const width=Math.max(100,strip.left-24),height=Math.max(100,innerHeight-top-12);
    camera.setViewOffset(width,height,-12,-top,innerWidth,innerHeight);
    const key=`${innerWidth}:${innerHeight}:${S.vertical}`;
    if(this.frameKey!==key){
      this.frameKey=key;const target=heroBox().getCenter(V3()),direction=camera.position.clone().sub(controls.target).normalize();controls.target.copy(target);
      for(let distance=2;distance<=30;distance+=0.08){
        camera.position.copy(target).addScaledVector(direction,distance);camera.lookAt(target);camera.updateMatrixWorld();
        const b=projectedBox(heroBox());
        if(!b.behind&&b.left>=12&&b.right<=strip.left-12&&b.top>=top&&b.bottom<=innerHeight-12)break;
      }
    }
  },
  scale(value){
    S.lineScale=value;
    if(value===1){camera.clearViewOffset();camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
    for(const grip of [SLIDER.handle,MASS_RAIL.handle,DIAL.knob,RUN_BUTTON,SHELF_HANDLE,LEVER_GRIP,...dragObjects,...specimenHits])grip.scale.setScalar(value);
    scene.traverse(o=>{if(o.isLine)o.material.linewidth=value;});
  },
  ghost(snapshot){if(snapshot)GRAMMAR.pin();else GRAMMAR.unpin();},
  predict(open=false,choice=null,dt=0){
    const d=QUESTS[Q.i];
    if(open){Q.phase='predict';Q.pick=null;Q.flags.classElapsed=0;}
    if(choice!==null){
      Q.pick=d.candidates[choice].key;Q.phase='observe';Q.flags.classElapsed=0;
      const answer=d.candidates.find(c=>c.key===d.answerKey);
      set('body',Q.i===1||Q.i===4?PHYS.C.ids.moon:answer.body);
      S.body.value=S.body.target;
      if(Q.i===4){runTrial();S.t.value=S.t.target=PHYS.timeDots(S.body.target)[PHYS.GRAMMAR_VIEW.trailIntervals/2].time;this.play(false);}
    }
    if(Q.phase==='observe'){Q.flags.classElapsed+=dt;if(Q.flags.classElapsed>=2.5)Q.phase='confirm';}
    return {phase:Q.phase,candidates:d.candidates,picture:c=>CARDS.picture(d.id,c,DIRECTOR.clock),compare:()=>{
      const chosen=d.candidates.find(c=>c.key===Q.pick)||d.candidates[0];
      return `<div class="q-compare">${CARDS.picture(d.id,chosen)}${CARDS.actual(d.id,QUEST.sample())}</div>`;
    }};
  }
};

const T = { mode: 'student', slow: false, spotlight: false, laser: false, numbers: false, ab: null, layerStep: 0 };
TEACHER_CFG.bindMode(T);
// Compatibility view, never a second stored snapshot.
Object.defineProperty(S, 'ab', { get: () => T.ab, set: value => { T.ab = value; } });
const TEACHER_LABELS = {
  teacher: { ko: '교사 시연', en: 'Teacher demonstration' },
  ui: { ko: '화면 조작 숨기기 또는 보이기', en: 'Hide or show controls' },
  frame: { ko: '한 프레임', en: 'One frame' }, slow: { ko: '사분의 일 속도', en: 'Quarter speed' },
  stack: { ko: '다음 표현 층', en: 'Stack next layer' }, ab: { ko: '비교 고정', en: 'Pin comparison' },
  clear: { ko: '비교 해제', en: 'Clear comparison' }, spotlight: { ko: '스포트라이트', en: 'Spotlight' },
  laser: { ko: '레이저 포인터', en: 'Laser pointer' }, numbers: { ko: '수치 층', en: 'Numeric layer' },
  predict: { ko: '학급 예상', en: 'Class prediction' }, close: { ko: '예상 닫기', en: 'Close prediction' },
  play: { ko: '정지 또는 재생', en: 'Pause or play' }, reset: { ko: '처음 상태', en: 'Reset' },

};
Object.assign(LABELS, TEACHER_LABELS);
Object.assign(ICONS, {
  teacher: 'M6 3h12v18H6zM9 6h6M9 10h6M9 15h1m4 0h1M9 18h6',
  frame: 'M4 5v14l8-7zM14 5l8 7-8 7z', slow: 'M3 14h18M6 14V9h12v5M8 9V6m8 3V6M7 18h1m8 0h1',
  ab: 'M3 5h7v14H3zM14 5h7v14h-7zM10 12h4', clear: 'M5 5l14 14M19 5L5 19',
  spotlight: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v10M7 12h10',
  laser: 'M3 21l9-9m-2-2 4 4M16 2v4m2 2h4M18 6l3-3',
  numbers: 'M7 3L5 21M16 3l-2 18M2 9h19M1 15h19', predict: 'M3 4h18v13H3zM8 21l4-4 4 4M7 8h3m4 0h3M7 12h10', close: 'M5 5l14 14M19 5L5 19'
});
const TEACHER_KEYS = { Space: 'play', '.': 'frame', '/': 'ui', Escape: 'reset' };
const teacherStrip = document.createElement('aside'); teacherStrip.id = 'teacher-strip'; document.body.append(teacherStrip);
const numericLayer = document.createElement('div'); numericLayer.id = 'teacher-numbers'; document.body.append(numericLayer);
const classPanel = document.createElement('div'); classPanel.id = 'teacher-class'; classPanel.hidden = true; document.body.append(classPanel);
const spotMask = document.createElement('div'); spotMask.id = 'teacher-spot'; document.body.append(spotMask);
const laserCanvas = document.createElement('canvas'); laserCanvas.id = 'teacher-laser'; document.body.append(laserCanvas);
const laserTrail = [];
function teacherButton(label, symbol, fn, parent, dictionary = TEACHER_LABELS) {
  const b = document.createElement('button'); b.setAttribute('aria-label', dictionary[label][TEACHER_CFG.language]);
  b.innerHTML = TEACHER_CFG.icon(symbol); b.onclick = fn; parent.append(b); return b;
}
const TEACHER = {
  state: T, config: TEACHER_CFG,
  mode(mode) {

    document.documentElement.style.setProperty('--ui-scale', mode === 'teacher' ? '1.4' : '1');
    TEACHER_CFG.scale(mode === 'teacher' ? 1.4 : 1);
    TEACHER_CFG.questMode(mode !== 'student');
    if (mode === 'teacher') this.select(TEACHER_CFG.getQuest());
    this.render();
  },
  layers(names) { for (const name of TEACHER_CFG.layerOrder) TEACHER_CFG.setLayer(name, names.includes(name)); },
  stack() {
    if (T.layerStep >= TEACHER_CFG.layerOrder.length) { T.layerStep = 0; this.layers([]); }
    else { if (!T.layerStep) this.layers([]); TEACHER_CFG.setLayer(TEACHER_CFG.layerOrder[T.layerStep++], true); }
    this.render();
  },
  select(i) { TEACHER_CFG.selectQuest(i); T.layerStep = 0; classPanel.hidden = true; this.render(); },
  reset() {
    const mode = T.mode;
    T.slow = T.spotlight = T.laser = T.numbers = false; T.ab = null; T.layerStep = 0;
    classPanel.hidden = true; laserTrail.length = 0;
    TEACHER_CFG.reset(); T.mode = mode; this.layers([]); TEACHER_CFG.ghost(null); TEACHER_CFG.ui(true);
    if (T.mode === 'student') TEACHER_CFG.startStudent();
    TEACHER_CFG.refresh(); this.render();
  },
  command(name) {
    if (name === 'reset') this.reset();
    else if (name === 'play') TEACHER_CFG.play(!TEACHER_CFG.getPlaying());
    else if (name === 'frame') TEACHER_CFG.oneFrame();
    else if (name === 'stack') this.stack();
    else if (name === 'ab') { T.ab = { closer: TEACHER_CFG.getCloser() }; TEACHER_CFG.ghost(T.ab); }
    else if (name === 'clear') { T.ab = null; TEACHER_CFG.ghost(null); }
    else if (name === 'predict') { TEACHER_CFG.predict(true); classPanel.hidden = false; this.prediction(); }
    else if (['slow', 'spotlight', 'laser', 'numbers'].includes(name)) T[name] = !T[name];
    this.render();
  },
  render() {
    const focusLabel = document.activeElement?.closest('#teacher-strip') ? document.activeElement.getAttribute('aria-label') : null;
    teacherStrip.hidden = T.mode !== 'teacher'; teacherStrip.replaceChildren();
    const section = () => { const g = document.createElement('div'); g.className = 'teacher-grid'; teacherStrip.append(g); return g; };
    let group = section();
    for (const name of ['play', 'frame', 'slow']) {
      const b = teacherButton(name, name === 'play' ? TEACHER_CFG.getPlaying() ? 'pause' : 'play' : name, () => this.command(name), group);
      b.setAttribute('aria-pressed', String(name === 'play' ? TEACHER_CFG.getPlaying() : !!T[name]));
    }
    group = section();
    for (const name of TEACHER_CFG.layerOrder) teacherButton(name, TEACHER_CFG.layerIcons[name], () => {
      TEACHER_CFG.setLayer(name, !TEACHER_CFG.layerOn(name)); this.render();
    }, group, TEACHER_CFG.layerLabels).setAttribute('aria-pressed', String(TEACHER_CFG.layerOn(name)));
    teacherButton('stack', 'next', () => this.stack(), group);
    group = section();
    for (const name of ['ab', 'clear', 'spotlight', 'laser', 'numbers']) teacherButton(name, name, () => this.command(name), group).setAttribute('aria-pressed', String(name === 'ab' ? !!T.ab : !!T[name]));
    group = section();
    TEACHER_CFG.quests.forEach((d, i) => { const b = teacherButton('quest', d.icon, () => this.select(i), group); b.setAttribute('aria-label', `${TEACHER_LABELS.quest[TEACHER_CFG.language]} ${i + 1}`); });
    group = section();
    for (const name of ['predict', 'reset']) teacherButton(name, name, () => this.command(name), group);
    if (focusLabel) [...teacherStrip.querySelectorAll('button')].find(b => b.getAttribute('aria-label') === focusLabel)?.focus({ preventScroll: true });
    this.update(0);
  },
  prediction() {
    const data = TEACHER_CFG.predict(); classPanel.replaceChildren();
    teacherButton('close', 'close', () => { classPanel.hidden = true; }, classPanel);
    if (data.phase === 'predict') data.candidates.forEach((c, i) => {
      const b = teacherButton('choice', 'predict', () => { TEACHER_CFG.predict(false, i); this.prediction(); }, classPanel);
      b.dataset.choice = i; b.setAttribute('aria-label', `${TEACHER_LABELS.choice[TEACHER_CFG.language]} ${i + 1}`); b.innerHTML = data.picture(c);
    });
    else { const compare = document.createElement('div'); compare.className = 'class-result'; compare.innerHTML = data.compare(); classPanel.append(compare); }
    classPanel.querySelector('button')?.focus({ preventScroll: true });
  },
  update(dt) {
    spotMask.hidden = T.mode !== 'teacher' || !T.spotlight;
    laserCanvas.hidden = T.mode !== 'teacher' || !T.laser;
    numericLayer.hidden = T.mode !== 'teacher' || !T.numbers;
    if (!numericLayer.hidden) numericLayer.innerHTML = TEACHER_CFG.numbers.map(row => `<div>${TEACHER_CFG.icon(row.label)}<span data-numeric>${row.fn().toFixed(2)} ${row.unit}</span></div>`).join('');
    if (!classPanel.hidden) {
      const data = TEACHER_CFG.predict(false, null, dt);
      if (data.phase === 'predict') classPanel.querySelectorAll('[data-choice]').forEach(b => { b.innerHTML = data.picture(data.candidates[+b.dataset.choice]); });
      else classPanel.querySelector('.class-result').innerHTML = data.compare();
    }
    if (!laserCanvas.hidden) {
      if (laserCanvas.width !== innerWidth || laserCanvas.height !== innerHeight) { laserCanvas.width = innerWidth; laserCanvas.height = innerHeight; }
      const c = laserCanvas.getContext('2d'), now = performance.now(); c.clearRect(0, 0, innerWidth, innerHeight);
      while (laserTrail.length > 1 && now - laserTrail[0].t > 160) laserTrail.shift();
      if (laserTrail.length) {
        c.strokeStyle = '#ff3838'; c.fillStyle = '#ff3838'; c.lineWidth = 4; c.shadowColor = '#b65450'; c.shadowBlur = 0;
        c.beginPath(); laserTrail.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.stroke();
        const p = laserTrail.at(-1); c.beginPath(); c.arc(p.x, p.y, 5, 0, Math.PI * 2); c.fill();
      }

  }
};
window.addEventListener('pointermove', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('pointerdown', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('keydown', e => {
  if (T.mode !== 'teacher' || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  const command = TEACHER_KEYS[e.code === 'Space' ? 'Space' : e.key];
  // The existing HUD owns the shared slash shortcut in all modes.
  if (command && command !== 'ui') { e.preventDefault(); TEACHER.command(command); }
});
Object.assign(window.__lab, { teacher: TEACHER });

// Portable kiosk controller: only TEACHER_CFG knows the apparatus.
const A = { active: false, t: 0, stage: 0 };
const ATTRACT_LABELS = {
  recover: { ko: '처음부터 다시 시작', en: 'Restart from the beginning' },
  start: { ko: '만져서 시작', en: 'Touch to start' }
};
const recovery = document.createElement('button'); recovery.id = 'kiosk-recover'; recovery.hidden = true;
recovery.setAttribute('aria-label', ATTRACT_LABELS.recover[TEACHER_CFG.language]); recovery.innerHTML = TEACHER_CFG.icon('reset'); document.body.append(recovery);
const touchPulse = document.createElement('div'); touchPulse.id = 'touch-pulse'; touchPulse.hidden = true;
touchPulse.setAttribute('aria-hidden', 'true'); touchPulse.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(touchPulse);
const attractStart = document.createElement('button'); attractStart.id = 'attract-start'; attractStart.hidden = true;
attractStart.setAttribute('aria-label', ATTRACT_LABELS.start[TEACHER_CFG.language]); attractStart.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(attractStart);
let lastInput = performance.now(), stalledFrames = 0, pulseUntil = 0;
const idleOption = Number(new URLSearchParams(location.search).get('idle'));
const idleSeconds = Number.isFinite(idleOption) && idleOption > 0 ? idleOption : TEACHER_CFG.idleSeconds;
const ATTRACT = {
  state: A,
  start(stage = 0) {
    if (!Number.isInteger(stage) || !TEACHER_CFG.attract[stage]) throw new RangeError('stage');
    if (T.mode === 'teacher') return;
    A.active = true; A.t = 0; A.stage = stage;
    document.body.classList.add('attract'); attractStart.hidden = false;
    TEACHER_CFG.questMode(true); TEACHER_CFG.play(true); TEACHER_CFG.ui(false); this.stage();
  },
  stage() {
    const row = TEACHER_CFG.attract[A.stage];
    TEACHER.layers(row.layers); TEACHER_CFG.fly(TEACHER_CFG.shotForStage(row), Math.min(3, row.seconds / 2));
  },
  wake(pulse = true) {
    A.active = false; A.t = 0; A.stage = 0;
    document.body.classList.remove('attract'); attractStart.hidden = true; recovery.hidden = true;
    stalledFrames = 0; lastInput = performance.now();
    TEACHER.reset(); TEACHER.mode('student'); TEACHER_CFG.startStudent();
    if (pulse) { pulseUntil = performance.now() + 800; touchPulse.hidden = false; touchPulse.style.animation = 'none'; void touchPulse.offsetWidth; touchPulse.style.animation = ''; }
  },
  fail() {
    A.active = false; recovery.hidden = false; attractStart.hidden = true;
    document.body.classList.remove('attract'); TEACHER_CFG.play(false);
  },
  health(ms) { stalledFrames = ms > 1000 ? stalledFrames + 1 : 0; if (stalledFrames >= 5) this.fail(); },
  update(dt) {
    if (!touchPulse.hidden && performance.now() >= pulseUntil) touchPulse.hidden = true;
    if (!recovery.hidden) return;
    if (!A.active) {
      if (T.mode !== 'teacher' && !TEACHER_CFG.cardBusy() && performance.now() - lastInput >= idleSeconds * 1000) this.start();
      return;
    }
    const row = TEACHER_CFG.attract[A.stage], before = A.t; A.t = Math.min(row.seconds, A.t + dt);
    const ease = t => { const x = t / row.seconds; return x * x * (3 - 2 * x); };
    const mix = (ease(A.t) - ease(before)) / Math.max(1e-9, 1 - ease(before));
    TEACHER_CFG.setCloser(TEACHER_CFG.getCloser() + (row.closer - TEACHER_CFG.getCloser()) * mix, true);
    if (A.t >= row.seconds) {
      TEACHER_CFG.setCloser(row.closer, true); A.stage = (A.stage + 1) % TEACHER_CFG.attract.length; A.t = 0; this.stage();
    }
  }
};
recovery.onclick = () => ATTRACT.wake(); attractStart.onclick = () => ATTRACT.wake();
for (const name of ['pointerdown', 'pointermove', 'touchstart', 'keydown', 'wheel']) window.addEventListener(name, event => {
  lastInput = performance.now();
  if (!A.active || name === 'pointermove') return;
  event.preventDefault(); event.stopImmediatePropagation(); ATTRACT.wake();
}, { capture: true, passive: false });
window.onerror = () => { ATTRACT.fail(); return false; };
window.addEventListener('unhandledrejection', () => ATTRACT.fail());
window.addEventListener('click', event => {
  if (event.isTrusted && performance.now() < pulseUntil) { event.preventDefault(); event.stopImmediatePropagation(); }
}, { capture: true });
document.addEventListener('visibilitychange', () => { lastInput = performance.now(); stalledFrames = 0; TEACHER_CFG.visibilityReset(); });
Object.assign(window.__lab, { attract: ATTRACT });
boot();
