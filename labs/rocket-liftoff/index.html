<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="quests" class="hud" aria-hidden="true"></div>
<div id="mission" data-mission role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module">
// 이 파일은 src/의 조각을 tools/assemble.mjs로 이어 붙여 만든다. 수정은 src/에서.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const QS=new URLSearchParams(location.search), LANG=QS.get('lang')==='en'?'en':'ko';document.documentElement.lang=LANG;
const THEME=Object.freeze({
  ceramic:0xe6e0d2, thrust:0xb594ff, weight:0xffaa63, support:0xf28db8, speed:0x64ead0,
  brass:0xb79859, graphite:0x303943, chrome:0xbcc7cc, warm:0xffb36b, cool:0x7dd3fc,
  wood:0x644936, wall:0x777a78, navy:0x344958, rubber:0x262a2c,
  sky:0xb5ddec, ground:0x6a432c, background:0x45494d, screen:0x11232e, grid:0x385363,
});
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pair=value=>({value,target:value});
// Independent categorical rails and observation state only; PHYS resolves every view.
const S={engines:pair(0),load:pair(0),g:pair(0),t:pair(0),playing:pair(0),ignited:pair(0),
  sound:pair(0),ui:pair(1),drag:null,snap:null,fly:null,shotIndex:1,
  vertical:innerWidth/innerHeight<.9,quality:'',layers:{},graphKeys:[],frames:0,ms:16.67,lastTime:0,uiKey:''};
function selection(){return PHYS.sceneSelection(S.engines.value,S.load.value,S.g.value);}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=mulberry32(730219),canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(THEME.background);scene.fog=new THREE.Fog(THEME.background,12,30);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.03,50);
const ROOM=new THREE.Group(),CONSOLE=new THREE.Group(),HERO=new THREE.Group();scene.add(ROOM,CONSOLE,HERO);

// ==== 1 PHYSICS ====
// 수직 운동·일정 중력·공기저항 무시. 모든 물리량은 SI(kg, m, s, N)다.
const PHYS = (() => {
  const C = Object.freeze({
    mDry: 9.7e5, mProp: 2.0e6, engineThrust: 6.9e6, ve: 2580, // kg, kg, N, m/s
    earthG: 9.81, moonG: 1.62, dt: 0.01, // m/s², m/s², s
    engineMin: 1, engineMax: 5,
    loads: Object.freeze([0, 2.0e5, 5.0e5]),
    // 추정: 모형 높이 1단위를 1000 m에 대응하는 로그 압축으로 정한다.
    heightScale: 1000,
  });
  const RANGE = Object.freeze({
    engines: Object.freeze([C.engineMin, C.engineMax]),
    load: Object.freeze([C.loads[0], C.loads.at(-1)]),
    g: Object.freeze([C.moonG, C.earthG]),
  });
  const m0 = load => C.mDry + load + C.mProp;
  const thrust = n => n * C.engineThrust;
  const T0W = (n, load, g) => thrust(n) / (m0(load) * g);
  const burnTime = n => C.mProp * C.ve / thrust(n);
  function liftoffTime(n, load, g) {
    // 소진 순간에야 같아지는 경우에는 추력이 곧 꺼지므로 뜨지 못한다.
    if (thrust(n) / (C.mDry + load) <= g) return Infinity;
    return Math.max(0, (m0(load) - thrust(n) / g) * C.ve / thrust(n));
  }
  const enginesNeeded = (load, g) => Math.floor(m0(load) * g / C.engineThrust) + 1;

  function stateAt(n, load, g, t) {
    const Tn = thrust(n), q = Tn / C.ve, tb = burnTime(n);
    const L = liftoffTime(n, load, g), endMass = C.mDry + load;
    const m = t >= tb ? endMass : m0(load) - q * t;
    const T = t < tb ? Tn : 0, W = m * g;
    let h = 0, v = 0, landingT = Infinity;
    let onPad = !Number.isFinite(L) || t < L || (t === L && T <= W);
    if (Number.isFinite(L)) {
      const ml = m0(load) - q * L, duration = tb - L;
      const burnLog = Math.log(ml / endMass);
      const vb = C.ve * burnLog - g * duration;
      const hb = C.ve * (duration - endMass / q * burnLog) - g * duration ** 2 / 2;
      landingT = tb + (vb + Math.sqrt(vb ** 2 + 2 * g * Math.max(0, hb))) / g;
      // 추정: 착지는 반발 없이 멈추고 발사대와 같은 지지가 생긴다.
      if (t >= landingT) onPad = true;
      else if (!onPad) {
        const u = Math.max(0, Math.min(t, tb) - L);
        const mu = t >= tb ? endMass : ml - q * u;
        const log = -Math.log1p(-q * u / ml);
        v = C.ve * log - g * u;
        h = C.ve * (u - mu / q * log) - g * u ** 2 / 2;
        if (t > tb) {
          const coast = t - tb;
          h = hb + vb * coast - g * coast ** 2 / 2;
          v = vb - g * coast;
        }
        h = Math.max(0, h);
      }
    }
    const normal = onPad ? Math.max(0, W - T) : 0;
    return { t, h, v, a: onPad ? 0 : T / m - g, m, T, W, normal, onPad, landingT };
  }

  function simulate(n, load, g, tEnd, dt = C.dt) {
    const result = { t: [], h: [], v: [], a: [], m: [], liftoffT: null, events: [] };
    // 검증은 입력 경계에서만 한다. 빈 자료와 잘못된 실행은 곡선을 만들지 않는다.
    if (!Number.isInteger(n) || n < C.engineMin || n > C.engineMax
      || !Number.isFinite(load) || load < 0 || !Number.isFinite(g) || g <= 0
      || !Number.isFinite(tEnd) || tEnd < 0 || !Number.isFinite(dt) || dt <= 0) return result;
    const L = liftoffTime(n, load, g), tb = burnTime(n);
    result.liftoffT = L;
    const landing = stateAt(n, load, g, 0).landingT;
    // 사건 시각은 표본 격자로 반올림하지 않는다. Infinity는 점으로 찍지 않는다.
    for (const [type, t] of [['liftoff', L], ['burnout', tb], ['landing', landing]]) {
      if (Number.isFinite(t) && t <= tEnd) result.events.push({ type, t });
    }
    // 고정 격자에서 가속도의 해석적 적분값을 표본화해 사건을 가로지르는 오차를 없앤다.
    const steps = Math.floor(tEnd / dt);
    for (let i = 0; i <= steps; i++) {
      const s = stateAt(n, load, g, i * dt);
      for (const key of ['t', 'h', 'v', 'a', 'm']) result[key].push(s[key]);
    }
    if (result.t.at(-1) < tEnd) {
      const s = stateAt(n, load, g, tEnd);
      for (const key of ['t', 'h', 'v', 'a', 'm']) result[key].push(s[key]);
    }
    return result;
  }

  const engineRailX = n => Math.max(0, Math.min(1, (n - C.engineMin) / (C.engineMax - C.engineMin)));
  const enginesFromRailX = x => Math.round(C.engineMin + Math.max(0, Math.min(1, x)) * (C.engineMax - C.engineMin));
  const loadRailX = load => C.loads.indexOf(load) / (C.loads.length - 1);
  const loadFromRailX = x => C.loads[Math.round(Math.max(0, Math.min(1, x)) * (C.loads.length - 1))];
  const gRailX = g => (C.earthG - g) / (C.earthG - C.moonG);
  const gFromRailX = x => x < 0.5 ? C.earthG : C.moonG;
  const DETENTS = Object.freeze({
    engines: Object.freeze(Array.from({ length: C.engineMax - C.engineMin + 1 }, (_, i) => {
      const value = C.engineMin + i;
      return Object.freeze({ value, x: engineRailX(value) });
    })),
    load: Object.freeze(C.loads.map(value => Object.freeze({ value, x: loadRailX(value) }))),
    g: Object.freeze([C.earthG, C.moonG].map(value => Object.freeze({ value, x: gRailX(value) }))),
  });
  const heightVis = h => Math.log1p(Math.max(0, h) / C.heightScale) / Math.LN2;
  const flameVis = T => Math.max(0, T) / C.engineThrust;

  // 실행 번호와 시각은 UI가 보관하는 순수 값이다. 가속도·비율은 다시 계산한다.
  const validRecord = r => r != null && Number.isInteger(r.runId) && r.runId > 0
    && Number.isInteger(r.n) && r.n >= C.engineMin && r.n <= C.engineMax
    && C.loads.includes(r.load) && [C.earthG, C.moonG].includes(r.g)
    && Number.isFinite(r.t) && r.t >= 0;
  const judgeQ1 = (r = {}) => validRecord(r) && r.ignited === true
    && r.n === C.engineMin && r.load === C.loads[0] && r.g === C.earthG
    && liftoffTime(r.n, r.load, r.g) === Infinity && r.t >= burnTime(r.n);

const QUEST = {
 get i(){return Q.i;},get passed(){return Q.completed.has(Q.i);},
 state(){return {...Q,stars:[...Q.stars],completed:[...Q.completed],flags:structuredClone(Q.flags)};},
 sample(){const f=Q.flags,r={...selection(),runId:f.runId||0,t:S.t.value,ignited:!!S.ignited.target,accelerationSeen:!!f.accelerationSeen};return Q.i===3?{before:f.before,after:r,comparisonSeen:!!f.comparisonSeen}:r;},
 phase(phase){if(!['intro','predict','act','observe','confirm','card'].includes(phase))throw new RangeError('phase');Q.phase=phase;Q.flags.elapsed=0;questUI();},
 invalidate(){Q.flags.runId=0;Q.flags.accelerationSeen=false;Q.flags.comparisonSeen=false;Q.flags.hold=0;if(Q.i===2)GRAMMAR.unpin();},
 ignite(){if(!Q.flags.runId){Q.flags.runId=++Q.serial;if(Q.i===2)GRAMMAR.pin();}},
 go(i){
  if(!Number.isInteger(i)||i<0||i>=QUESTS.length)throw new RangeError('quest');
  S.drag=null;controls.enabled=true;Q.i=i;Q.free=false;Q.pick=null;Q.flags={elapsed:0,idle:0,demoLeft:0,hold:0,runId:0};
  const d=QUESTS[i];set('engines',d.startState.n);set('load',d.startState.load);set('g',d.startState.g);
  for(const key of ['engines','load','g'])S[key].value=S[key].target;
  GRAMMAR.unpin();GRAMMAR.set(Object.fromEntries(GRAMMAR.LAYERS.map(n=>[n,d.layers.includes(n)])));
  DIRECTOR.clear();this.phase('intro');DIRECTOR.intro();syncUI();
 },
 pick(k){if(Q.free||Q.phase!=='predict')return;const c=QUESTS[Q.i].candidates[k];if(!c)throw new RangeError('pick');Q.pick=c.key;Q.flags.demoLeft=2.2;this.phase('act');},
 mode(free){if(!free){this.go(Q.i);return;}Q.free=true;DIRECTOR.clear();GRAMMAR.set(GRAMMAR.defaults);questUI();shot(S.vertical?0:1,S.vertical);},
 touch(){Q.flags.idle=0;Q.flags.demoLeft=0;},
 allows(control){
  if(Q.free)return true;
  const name=({plus:'engines',minus:'engines',slider:'engines',dial:'engines',gravity:'g',globe:'g',earth:'g',moon:'g',load0:'load',load1:'load',load2:'load'})[control]||control;
  const ok=Q.phase==='act'&&(control==='reset'||QUESTS[Q.i].controls.includes(name));
  if(!ok&&Q.phase==='predict')document.getElementById('q-pictures').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:220});

 },
 open(name){
  if(!this.allows(name))return;this.touch();const f=Q.flags;
  if(name==='pin'&&Q.i===3){const r={...selection(),t:S.t.value,ignited:!!S.ignited.target};if(!f.runId)f.runId=++Q.serial;f.before=Object.freeze({...r,runId:f.runId});GRAMMAR.pin({...r,t:0,ignited:true});f.comparisonSeen=false;}
  if(name==='inspect'){
   if(Q.i===2&&f.runId&&S.ignited.target&&S.t.value>0&&GRAMMAR.baseline&&GRAMMAR.enabled[GRAMMAR.LAYERS[7]])f.accelerationSeen=true;
   if(Q.i===3&&f.before&&f.runId>f.before.runId&&GRAMMAR.baseline&&GRAMMAR.enabled[GRAMMAR.LAYERS[6]])f.comparisonSeen=true;
  }

 },
 skip(phase){this.phase(phase==='event'?'observe':phase);if(phase==='event')DIRECTOR.event(Q.flags.success||this.sample());},
 update(dt){
  const f=Q.flags;f.elapsed+=dt;f.idle+=dt;if(Q.free)return;
  if(Q.phase==='intro'){if(f.elapsed>=.9&&!f.pushed){f.pushed=true;DIRECTOR.push();}if(f.elapsed>=2.7)this.phase('predict');return;}
  if(Q.phase==='act'){
   f.demoLeft=Math.max(0,f.demoLeft-dt);if(S.drag)this.touch();if(f.idle>=7){f.idle=0;f.demoLeft=2.2;}
   if(!S.ignited.target){f.hold=0;return;}
   this.ignite();const s=this.sample(),valid=QUESTS[Q.i].judge(s);
   // A pending observation is cancelled by scrubbing backwards or manipulation.
   const t=S.t.value,forward=f.lastT===undefined||t>=f.lastT;f.lastT=t;
   f.hold=valid&&!S.drag&&forward?f.hold+dt:0;
   if(valid&&f.hold>=.25){f.success=Object.freeze(structuredClone(s));this.phase('observe');if(QUESTS[Q.i].events(s))DIRECTOR.event(s);}
  }else if(Q.phase==='observe'&&f.elapsed>=1.4){S.playing.value=S.playing.target=0;Q.completed.add(Q.i);Q.stars[Q.i]=Q.pick===null||Q.pick===QUESTS[Q.i].answerKey?3:2;this.phase('confirm');if(Q.stars[Q.i]===3)DIRECTOR.chord();}
  else if(Q.phase==='confirm'&&f.elapsed>=1.4)this.phase('card');
  else if(Q.phase==='card'&&f.elapsed>=7.5){if(Q.i<QUESTS.length-1)this.go(Q.i+1);else this.mode(true);}
 },
 auto(i){
  this.go(i);step(90,1/30);this.pick(QUESTS[i].candidates.findIndex(c=>c.key===QUESTS[i].answerKey));
  const settle=()=>step(30,1/30);
  if(i===1||i===5){set('engines',PHYS.enginesNeeded(QUESTS[i].startState.load,QUESTS[i].startState.g));settle();}
  if(i===3){this.open('pin');set('load',PHYS.C.loads[2]);settle();}
  action('play');settle();
  if(i===0){set('t',PHYS.burnTime(1));for(let n=0;n<4&&Q.phase==='act';n++)step(120,1/30);}
  if(i===2){set('t',PHYS.DISPLAY.dotDt*4);step(60,1/30);this.open('inspect');}
  if(i===3)this.open('inspect');
  for(let n=0;n<4&&Q.phase!=='card';n++)step(90,1/30);
  return {i,passed:this.passed,phase:Q.phase,judge:QUESTS[i].judge(this.sample()),stars:Q.stars[i]};
 }
};

// All candidate loops, actual results and principle equations share this picture vocabulary.
const CARDS=(()=>{
 const svg=body=>`<svg viewBox="0 0 280 140" aria-hidden="true">${body}</svg>`;
 const path=(d,color='#221d18',dash=false)=>`<path d="${d}" stroke="${color}" ${dash?'stroke-dasharray="4 4"':''}/>`;
 const dot=(x,y,r=3)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;
 const equal=path('M143 60h15m-15 10h15');
 function bar(x,force,color,dash=false){
  const n=PHYS.forceGlyph(force).shown;
  return Array.from({length:Math.ceil(n)},(_,i)=>`<rect x="${x}" y="${114-(i+Math.min(1,n-i))*15}" width="15" height="${Math.max(.1,Math.min(1,n-i)*15-2)}" stroke="${color}" ${dash?'stroke-dasharray="3 3"':color==='#c57d24'?`fill="${color}" fill-opacity=".3"`:''}/>`).join('');
 }
 function dots(r,trace){
  const duration=r.t??PHYS.burnTime(r.n),samples=PHYS.simulate(r.n,r.load||0,r.g||9.81,duration,Math.max(.01,duration/8)),span=Math.max(1,samples.h.at(-1));
  return samples.h.map((h,i)=>dot(18+(trace==='equal'?(i/8)**2:trace==='shrinking'?1-(1-i/8)**2:h/span)*240,124,5)).join('');
 }
 const expansion=(x,y)=>path(`M${x-5} ${y+5}l10-10m-10 4v6h6m-2-10h6v6`);
 const up=(x,y,length,color='#37795d',dash=false)=>length>.1?path(`M${x} ${y}v${-length}m-6 7 6-7 6 7`,color,dash):path(`M${x-7} ${y}h14`,color);
 function candidateBar(x,force,color,weight=false){
  const cells=PHYS.forceGlyph(force).shown,length=cells*20;
  let b=`<rect x="${x}" y="${128-length}" width="26" height="${Math.max(.2,length)}" stroke="${color}" fill="${color}" fill-opacity="${weight?.4:.16}"/>`;
  for(let i=1;i<cells;i++)b+=path(`M${x} ${128-i*20}h26`,color);
  return b+(length<.1?path(`M${x} 128h26`,color):weight?path(`M${x+7} 118l6 7 6-7`,color):up(x+13,128-length+12,12,color));
 }
 function motionPicture(trace,positions=PHYS.cardMotion(trace)){
  const xs=positions.map(p=>18+p*204);
  let b='<g opacity=".25">'+path('M18 20v130h204M18 50h204M18 90h204');
  for(let i=0;i<6;i++)b+=path(`M${18+i*40.8} 16v138`,undefined,true);
  b+='</g>';
  b+=`<g stroke-width="4" ${trace==='growing'?'':'stroke-dasharray="5 3"'}>`+path('M18 50h204','#37795d');
  b+=xs.map(x=>`<circle cx="${x}" cy="50" r="6" fill="#37795d"/>`).join('');
  for(let i=1;i<xs.length;i++){
   const gap=xs[i]-xs[i-1],x=xs[i-1];
   b+=path(`M${x} 83h${gap}m-5-5 5 5-5 5`,'#37795d');
   b+=`<rect x="${20+(i-1)*42}" y="${150-gap*.65}" width="28" height="${gap*.65}" fill="#37795d" fill-opacity=".4" stroke="#37795d"/>`;
  }
  return b+'</g>';
 }
 function picture(id,c,time=0){
  // A shallow pulse keeps the three readings distinct at every animation phase.
  const progress=time===0?1:.875+.125*Math.cos(time*Math.PI*2/3),v=PHYS.cardPrediction(id,c,progress);
  if(id===3)return `<svg viewBox="0 0 240 168" preserveAspectRatio="none" aria-hidden="true">${motionPicture(c.trace)}</svg>`;
  return candidatePicture(id,c,v);
 }
 function candidatePicture(id,c,v){
  const base=130-v.lift,rocket=y=>path(`M48 ${y}v-28l14-16 14 16v28z`);
  let b='<g opacity=".24">'+path('M18 14v130h92M130 128h84');
  for(let i=0;i<=6;i++)b+=path(`M14 ${144-i*20}h96M132 ${128-i*20}h80`,undefined,true);
  b+=`<g stroke-dasharray="5 4">${rocket(130)}</g>`+`<rect x="142" y="${128-PHYS.forceGlyph(PHYS.m0(c.load||0)*(c.g||PHYS.C.earthG)).shown*20}" width="62" height="${PHYS.forceGlyph(PHYS.m0(c.load||0)*(c.g||PHYS.C.earthG)).shown*20}" stroke-dasharray="5 4"/>`+'</g>';
  // Equal-height pad silhouettes and dashed trails remain fixed behind the live position.
  b+=`<g opacity=".45" stroke-dasharray="5 4">${rocket(130-v.lift*.5)}${path(`M62 130v${-v.lift}`,undefined,true)}</g>`;
  b+=`<g stroke-width="4" ${v.hypothesis?'stroke-dasharray="6 4"':''}>${rocket(base)}</g>`;
  b+=`<rect x="54" y="${base-26*v.fuel}" width="16" height="${26*v.fuel}" fill="#37795d" stroke="none"/>`;
  if(c.load)b+=`<rect x="80" y="${base-29}" width="22" height="22" fill="#c57d24" fill-opacity=".4"/>`;
  b+=`<g stroke-width="4">${up(29,139,v.lift,'#37795d',v.hypothesis)}${candidateBar(138,v.T,'#7863a6')}<g opacity="${id===1?1:.45}">${candidateBar(178,v.W,'#c57d24',true)}</g></g>`;
  // A separate compressed residual makes the nearly balanced heavy load legible.
  if(id===4)b+=`<g opacity=".35">${up(224,128,v.baselineMargin,'#221d18',true)}</g>`;
  if(id!==1)b+=`<g stroke-width="5">${up(224,128,v.margin)}</g>`+expansion(224,18);
  b+=expansion(108,14);
  b+=`<g stroke-width="3.5">`+Array.from({length:v.nozzles},(_,i)=>path(`M${18+i*16} 151l-4 11h12l-4-11z`,c.extra&&i===v.nozzles-1?'#37795d':'#221d18')).join('')+'</g>';
  if(id===5)b+=`<circle cx="113" cy="153" r="10" stroke-dasharray="3 3"/>`+path('M109 150h1m6 6h1');
  return `<svg viewBox="0 0 240 168" preserveAspectRatio="none" aria-hidden="true">${b}</svg>`;
 }
 function actual(id,s){
  const r=s.after||s,v=PHYS.grammarValues(r.n,r.load,r.g,r.t,true);
  if(id===3){
   const heights=Array.from({length:6},(_,i)=>PHYS.stateAt(r.n,r.load,r.g,r.t*i/5).h),end=Math.max(1,heights.at(-1));
   return `<svg viewBox="0 0 240 168" preserveAspectRatio="none" aria-hidden="true">${motionPicture('growing',heights.map(h=>h/end))}</svg>`;
  }
  return candidatePicture(id,r,{...v,lift:PHYS.cardLift(v.h),nozzles:r.n,hypothesis:false,
   margin:PHYS.cardMargin(v.T-v.W),baselineMargin:PHYS.cardMargin(PHYS.thrust(r.n)-PHYS.m0(PHYS.C.loads[1])*r.g)});

  if(id===2||id===6){const w=PHYS.m0(r.load)*r.g;return svg(Array.from({length:5},(_,i)=>bar(20+i*38,PHYS.thrust(i+1),'#7863a6')+path(`M${16+i*38} ${114-PHYS.forceGlyph(w).shown*15}h25`,'#c57d24',true)).join('')+path('M244 118v-30m-7 7 7-7 7 7')+(id===6?path('M244 20h30v23h-30z'):''));}
  if(id===3)return svg(bar(20,initial.T,'#7863a6')+bar(46,initial.W,'#c57d24',true)+bar(78,v.T,'#7863a6')+bar(104,v.W,'#c57d24')+equal+`<g transform="translate(145 -45)">${dots(r,'growing')}</g>`+path(`M185 120l30 ${-initial.a*3}M235 120l30 ${-v.a*3}`,'#37795d'));
  if(id===4){const a=s.before;if(!a)return '';return svg(path('M20 18h19v15H20zM70 10h27v23H70z')+bar(20,PHYS.thrust(a.n)-PHYS.m0(a.load)*a.g,'#7863a6')+bar(70,initial.T-initial.W,'#7863a6')+equal+bar(205,PHYS.thrust(a.n),'#7863a6')+bar(233,PHYS.thrust(r.n),'#7863a6'));}

 }

})();

    if (T.layerStep >= TEACHER_CFG.layerOrder.length) { T.layerStep = 0; this.layers([]); }

  select(i) { TEACHER_CFG.selectQuest(i); T.layerStep = 0; classPanel.hidden = true; this.render(); },
  reset() {

    classPanel.hidden = true; laserTrail.length = 0;
    TEACHER_CFG.reset(); T.mode = mode; this.layers([]); TEACHER_CFG.ghost(null); TEACHER_CFG.ui(true);
    if (T.mode === 'student') TEACHER_CFG.startStudent();
    TEACHER_CFG.refresh(); this.render();
  },
  command(name) {
    if (name === 'reset') this.reset();

    else if (name === 'stack') this.stack();

  },
  render() {

    let group = section();
    for (const name of ['play', 'frame', 'slow']) {
      const b = teacherButton(name, name === 'play' ? TEACHER_CFG.getPlaying() ? 'pause' : 'play' : name, () => this.command(name), group);
      b.setAttribute('aria-pressed', String(name === 'play' ? TEACHER_CFG.getPlaying() : !!T[name]));
    }
    group = section();

    group = section();
    TEACHER_CFG.quests.forEach((d, i) => { const b = teacherButton('quest', d.icon, () => this.select(i), group); b.setAttribute('aria-label', `${TEACHER_LABELS.quest[TEACHER_CFG.language]} ${i + 1}`); });
    group = section();
    for (const name of ['predict', 'reset']) teacherButton(name, name, () => this.command(name), group);

  },
  prediction() {

    if (data.phase === 'predict') data.candidates.forEach((c, i) => {
      const b = teacherButton('choice', 'predict', () => { TEACHER_CFG.predict(false, i); this.prediction(); }, classPanel);
      b.dataset.choice = i; b.setAttribute('aria-label', `${TEACHER_LABELS.choice[TEACHER_CFG.language]} ${i + 1}`); b.innerHTML = data.picture(c);

  },
  update(dt) {

    laserCanvas.hidden = T.mode !== 'teacher' || !T.laser;
    numericLayer.hidden = T.mode !== 'teacher' || !T.numbers;
    if (!numericLayer.hidden) numericLayer.innerHTML = TEACHER_CFG.numbers.map(row => `<div>${TEACHER_CFG.icon(row.label)}<span data-numeric>${row.fn().toFixed(2)} ${row.unit}</span></div>`).join('');
    if (!classPanel.hidden) {
      const data = TEACHER_CFG.predict(false, null, dt);
      if (data.phase === 'predict') classPanel.querySelectorAll('[data-choice]').forEach(b => { b.innerHTML = data.picture(data.candidates[+b.dataset.choice]); });

    }

      const c = laserCanvas.getContext('2d'), now = performance.now(); c.clearRect(0, 0, innerWidth, innerHeight);
      while (laserTrail.length > 1 && now - laserTrail[0].t > 160) laserTrail.shift();

        c.strokeStyle = '#ff3838'; c.fillStyle = '#ff3838'; c.lineWidth = 4; c.shadowColor = '#b65450'; c.shadowBlur = 0;

window.addEventListener('pointermove', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('pointerdown', e => {
  spotMask.style.setProperty('--pointer-x', `${e.clientX}px`); spotMask.style.setProperty('--pointer-y', `${e.clientY}px`);
  if (T.laser) laserTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
}, { passive: true });
window.addEventListener('keydown', e => {
  if (T.mode !== 'teacher' || e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
  const command = TEACHER_KEYS[e.code === 'Space' ? 'Space' : e.key];
  // The existing HUD owns the shared slash shortcut in all modes.
  if (command && command !== 'ui') { e.preventDefault(); TEACHER.command(command); }
});
Object.assign(window.__lab, { teacher: TEACHER });

// Portable kiosk controller: only TEACHER_CFG knows the apparatus.
const A = { active: false, t: 0, stage: 0 };
const ATTRACT_LABELS = {
  recover: { ko: '처음부터 다시 시작', en: 'Restart from the beginning' },
  start: { ko: '만져서 시작', en: 'Touch to start' }
};
const recovery = document.createElement('button'); recovery.id = 'kiosk-recover'; recovery.hidden = true;
recovery.setAttribute('aria-label', ATTRACT_LABELS.recover[TEACHER_CFG.language]); recovery.innerHTML = TEACHER_CFG.icon('reset'); document.body.append(recovery);
const touchPulse = document.createElement('div'); touchPulse.id = 'touch-pulse'; touchPulse.hidden = true;
touchPulse.setAttribute('aria-hidden', 'true'); touchPulse.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(touchPulse);
const attractStart = document.createElement('button'); attractStart.id = 'attract-start'; attractStart.hidden = true;
attractStart.setAttribute('aria-label', ATTRACT_LABELS.start[TEACHER_CFG.language]); attractStart.innerHTML = TEACHER_CFG.icon('hand'); document.body.append(attractStart);
let lastInput = performance.now(), stalledFrames = 0, pulseUntil = 0;
const idleOption = Number(new URLSearchParams(location.search).get('idle'));
const idleSeconds = Number.isFinite(idleOption) && idleOption > 0 ? idleOption : TEACHER_CFG.idleSeconds;
const ATTRACT = {
  state: A,
  start(stage = 0) {
    if (!Number.isInteger(stage) || !TEACHER_CFG.attract[stage]) throw new RangeError('stage');
    if (T.mode === 'teacher') return;
    A.active = true; A.t = 0; A.stage = stage;
    document.body.classList.add('attract'); attractStart.hidden = false;
    TEACHER_CFG.questMode(true); TEACHER_CFG.play(true); TEACHER_CFG.ui(false); this.stage();
  },
  stage() {
    const row = TEACHER_CFG.attract[A.stage];
    TEACHER.layers(row.layers); TEACHER_CFG.fly(TEACHER_CFG.shotForStage(row), Math.min(3, row.seconds / 2));
  },
  wake(pulse = true) {
    A.active = false; A.t = 0; A.stage = 0;
    document.body.classList.remove('attract'); attractStart.hidden = true; recovery.hidden = true;
    stalledFrames = 0; lastInput = performance.now();
    TEACHER.reset(); TEACHER.mode('student'); TEACHER_CFG.startStudent();
    if (pulse) { pulseUntil = performance.now() + 800; touchPulse.hidden = false; touchPulse.style.animation = 'none'; void touchPulse.offsetWidth; touchPulse.style.animation = ''; }
  },
  fail() {
    A.active = false; recovery.hidden = false; attractStart.hidden = true;
    document.body.classList.remove('attract'); TEACHER_CFG.play(false);
  },
  health(ms) { stalledFrames = ms > 1000 ? stalledFrames + 1 : 0; if (stalledFrames >= 5) this.fail(); },
  update(dt) {
    if (!touchPulse.hidden && performance.now() >= pulseUntil) touchPulse.hidden = true;
    if (!recovery.hidden) return;
    if (!A.active) {
      if (T.mode !== 'teacher' && !TEACHER_CFG.cardBusy() && performance.now() - lastInput >= idleSeconds * 1000) this.start();
      return;
    }
    const row = TEACHER_CFG.attract[A.stage], before = A.t; A.t = Math.min(row.seconds, A.t + dt);
    const ease = t => { const x = t / row.seconds; return x * x * (3 - 2 * x); };
    const mix = (ease(A.t) - ease(before)) / Math.max(1e-9, 1 - ease(before));
    TEACHER_CFG.setCloser(TEACHER_CFG.getCloser() + (row.closer - TEACHER_CFG.getCloser()) * mix, true);
    if (A.t >= row.seconds) {
      TEACHER_CFG.setCloser(row.closer, true); A.stage = (A.stage + 1) % TEACHER_CFG.attract.length; A.t = 0; this.stage();

recovery.onclick = () => ATTRACT.wake(); attractStart.onclick = () => ATTRACT.wake();
for (const name of ['pointerdown', 'pointermove', 'touchstart', 'keydown', 'wheel']) window.addEventListener(name, event => {
  lastInput = performance.now();
  if (!A.active || name === 'pointermove') return;
  event.preventDefault(); event.stopImmediatePropagation(); ATTRACT.wake();
}, { capture: true, passive: false });
window.onerror = () => { ATTRACT.fail(); return false; };
window.addEventListener('unhandledrejection', () => ATTRACT.fail());
window.addEventListener('click', event => {
  if (event.isTrusted && performance.now() < pulseUntil) { event.preventDefault(); event.stopImmediatePropagation(); }
}, { capture: true });
document.addEventListener('visibilitychange', () => { lastInput = performance.now(); stalledFrames = 0; TEACHER_CFG.visibilityReset(); });
Object.assign(window.__lab, { attract: ATTRACT });
boot();

</script>
