<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe3cf">
<title></title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe3cf}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:10;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;border:1.5px solid #221d18;border-radius:18px;background:#f4efe3;box-shadow:none;color:#221d18}
#quests{top:max(16px,env(safe-area-inset-top));pointer-events:none;gap:18px;padding:10px 18px;color:#221d18}
.quest{display:grid;justify-items:center;gap:5px}.quest i{width:4px;height:4px;border-radius:50%;background:currentColor}
#tools{bottom:max(18px,env(safe-area-inset-bottom))}
button{border:1.5px solid #221d18;border-radius:13px;min-width:56px;width:56px;height:56px;display:grid;place-items:center;background:#f4efe3;color:inherit;cursor:pointer;padding:8px;touch-action:manipulation;flex-shrink:0}
button[aria-pressed=true]{background:#e8b23a;color:#221d18}button:focus-visible{outline:2px solid #221d18;outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#engine-dots{display:flex;gap:3px;justify-content:center;width:28px}#engine-dots i{width:3px;height:3px;background:currentColor;border-radius:50%}
.hide-ui .hud{visibility:hidden;pointer-events:none}
@media(max-width:980px){#quests{top:max(78px,env(safe-area-inset-top));gap:18px;padding:9px 12px}#quests svg{width:20px;height:20px}#tools{width:348px;display:grid;grid-template-columns:repeat(6,56px);gap:0;padding:5px;bottom:max(12px,env(safe-area-inset-bottom))}#tools button{width:56px}#engine-dots{position:absolute;left:145px;top:54px}#tool-load0{grid-column:2}#tool-earth{grid-column:5}}

[hidden]{display:none!important}
#quests{pointer-events:auto;display:grid;grid-template-columns:repeat(8,56px);gap:3px;padding:6px;top:max(12px,env(safe-area-inset-top))}
#quests button{position:relative;color:#221d18;gap:1px;padding:5px}
#quests button.current{color:#221d18;box-shadow:none;background:#e8b23a}#quests button.complete{color:#37795d;background:#d8e1ce}
#quests button[aria-disabled=true]{opacity:.35}.q-dots,.q-stars{display:flex;gap:3px;justify-content:center}
.q-dots i{width:3px;height:3px;border-radius:50%;background:currentColor}.q-stars svg{width:9px;height:9px;fill:currentColor}
#tools{max-width:calc(100vw - 20px);display:grid;grid-template-rows:repeat(2,56px);grid-auto-flow:column;grid-auto-columns:56px;overflow-x:auto;justify-content:start;gap:2px;padding:6px}
#q-layers{display:contents}#engine-dots{display:none}.sub{opacity:.32}
#q-pictures{bottom:158px;width:max-content;max-width:calc(100vw - 16px);height:136px;padding:6px;gap:8px;overflow:hidden}
#q-pictures>button[data-candidate]{width:192px;height:120px;padding:2px;background:#f4efe3;border:1.5px solid #221d18}
#q-pictures svg{width:100%;height:100%;stroke-width:1.6}#q-pictures>button:not([data-candidate]){width:56px;height:56px}
#q-pictures>button:not([data-candidate]) svg{width:24px;height:24px}
.q-compare{display:flex;width:390px;height:116px}.q-compare>svg{width:50%}.q-compare.matched>svg:nth-child(2){position:absolute;left:6px;width:192px;opacity:.45;animation:q-overlay-in .5s both}.q-compare.matched>svg:last-child{width:36px;margin:auto;color:#37795d}
.q-principle{width:300px;height:114px}.q-principle>svg{height:90px}.q-principle .q-stars svg{width:18px;height:18px}
#q-overlay{position:fixed;inset:0;z-index:15;pointer-events:none;color:#221d18}#q-overlay>svg{width:100%;height:100%;stroke-width:2}
.q-bars:before,.q-bars:after{content:'';position:fixed;left:0;right:0;height:10vh;background:#f4efe3;z-index:14;pointer-events:none}.q-bars:before{top:0}.q-bars:after{bottom:0}
.q-event #tools,.q-event #quests{opacity:.22}.hide-ui #q-pictures,.hide-ui #q-overlay{visibility:hidden}
@keyframes q-overlay-in{from{transform:translate(160px,35px);opacity:0}to{transform:translate(0,0);opacity:.45}}
@media(max-width:980px){
 #quests{width:350px;max-width:calc(100vw - 16px);grid-template-columns:repeat(6,56px);gap:0;padding:5px;top:max(12px,env(safe-area-inset-top))}
 #quests>button:nth-child(1),#quests>button:nth-child(2){grid-column:span 3;justify-self:center}
 #tools{width:348px;grid-template-columns:none;grid-template-rows:repeat(2,56px);grid-auto-flow:column;grid-auto-columns:56px;bottom:max(12px,env(safe-area-inset-bottom))}
 #tools button{grid-column:auto}#q-pictures{height:90px;bottom:146px;width:350px;gap:3px;padding:4px}
 #q-pictures>button[data-candidate]{width:110px;min-width:56px;height:78px;flex:1}
 .q-compare{width:270px;height:80px}.q-compare.matched>svg:nth-child(2){width:135px;left:4px}
 .q-principle{width:265px;height:80px}.q-principle>svg{height:62px}.q-principle .q-stars svg{width:14px;height:14px}
}
:root{--ui-scale:1}
[hidden]{display:none!important}
body[data-mode=teacher] button{min-width:72px;min-height:72px;height:72px;background:#f4efe3;color:#221d18;border:1.5px solid #221d18}
body[data-mode=teacher] svg{width:calc(24px * var(--ui-scale));height:calc(24px * var(--ui-scale));stroke-width:calc(2 * var(--ui-scale))}
body[data-mode=teacher] svg path,body[data-mode=teacher] svg circle,body[data-mode=teacher] svg rect{vector-effect:non-scaling-stroke}
body[data-mode=teacher] button[aria-pressed=true]{background:#e8b23a;color:#221d18;border-color:#221d18}
body[data-mode=teacher] #quests{width:auto;display:flex;top:12px;padding:4px;left:12px;transform:none;max-width:calc(100vw - 360px);flex-wrap:wrap}
body[data-mode=teacher] #quests button{width:72px;transform:none}
body[data-mode=teacher] #tools,body[data-mode=teacher] #q-extra{display:none}
/* 29 tools, 4 columns, 8 rows: 620px including gaps and border. */
#teacher-strip{position:fixed;z-index:22;right:12px;top:12px;width:316px;max-height:calc(100vh - 24px);display:grid;grid-template-columns:repeat(4,72px);gap:4px;padding:6px;background:#f4efe3;border:1.5px solid #221d18;border-radius:18px}
.teacher-grid{display:contents}
#teacher-strip button{width:72px;padding:10px}
#teacher-numbers{position:fixed;z-index:20;left:14px;top:110px;padding:14px;background:#f4efe3;color:#221d18;border:1.5px solid #221d18;border-radius:14px;pointer-events:none;font:24px 'DM Mono',monospace;font-variant-numeric:tabular-nums}
#teacher-numbers>div{display:flex;align-items:center;gap:12px;min-height:48px}
#teacher-spot{position:fixed;inset:0;z-index:25;pointer-events:none;background:#efe3cfbb;mask-image:radial-gradient(circle 140px at var(--pointer-x,50%) var(--pointer-y,50%),transparent 65%,black 100%)}
#teacher-laser{position:fixed;inset:0;width:100%;height:100%;z-index:26;pointer-events:none}
#teacher-class{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;gap:20px;padding:100px 28px;background:#f4efe3;color:#221d18}
#teacher-class>button:first-child{position:absolute;right:16px;top:16px}
#teacher-class>button[data-choice]{width:30%;height:auto;aspect-ratio:300/160;min-height:160px;padding:12px}
#teacher-class>button[data-choice] svg{width:100%;height:auto}
.class-result{width:90%;max-width:1100px}.class-result .q-compare{position:relative;width:100%;max-width:100%;display:grid;min-height:240px;animation:q-arrive .6s both}
.class-result .q-compare>svg{grid-area:1/1;width:100%!important;height:auto!important;opacity:.65}.class-result .q-compare>svg:first-child{stroke-dasharray:5 5;color:#221d18}
.hide-ui #teacher-strip,.hide-ui #teacher-numbers,.hide-ui #teacher-class{visibility:hidden;pointer-events:none}
#kiosk-recover{position:fixed;inset:0;width:100%;height:100%;z-index:40;background:#f4efe3;color:#221d18}
#kiosk-recover svg{width:72px;height:72px}
#attract-start{position:fixed;bottom:24px;left:calc(50% - 36px);width:72px;height:72px;z-index:30;color:#221d18;background:#f4efe3}
#touch-pulse{position:fixed;z-index:35;left:calc(50% - 48px);top:calc(50% - 48px);width:96px;height:96px;border:3px solid #221d18;border-radius:50%;display:grid;place-items:center;color:#221d18;pointer-events:none;animation:touch-pulse .8s both}
#touch-pulse svg{width:48px;height:48px}
@keyframes touch-pulse{0%{transform:scale(.65);opacity:0}30%{opacity:1}100%{transform:scale(1.4);opacity:0}}
@media(max-width:980px){
 #quests{grid-template-columns:repeat(6,56px);width:348px}
 #quests button:nth-child(n+7){transform:none}
 #teacher-strip{width:168px;right:4px;top:172px;bottom:8px;max-height:none;display:block;overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
 .teacher-grid{display:grid;grid-template-columns:repeat(2,72px);gap:4px;padding-bottom:5px;margin-bottom:5px;border-bottom:1px solid #221d18}
 body[data-mode=teacher] #quests{left:4px;max-width:calc(100vw - 80px);transform:none}
 #teacher-numbers{left:8px;top:100px;font-size:18px;padding:8px}
 #teacher-class{flex-direction:column;gap:10px;padding:90px 16px 16px}
 #teacher-class>button[data-choice]{width:100%;max-width:540px;min-height:72px;flex:1;max-height:28vh}
 #teacher-class>button[data-choice] svg{height:100%;width:auto;max-width:100%}
}
@media(prefers-reduced-motion:reduce){#touch-pulse,.class-result *{animation:none!important}}

#quests{grid-template-columns:repeat(9,56px)}
#q-pictures{height:164px;bottom:150px;background:#f4efe3}
#q-pictures>button[data-candidate]{width:244px;height:150px;padding:0}
#q-pictures svg{stroke-width:3}
.q-event #q-pictures{display:none}
@media(max-width:980px){
 #quests{grid-template-columns:repeat(6,56px);width:350px}
 #quests>button:nth-child(-n+3){grid-column:span 2;justify-self:center}
 #q-pictures{height:90px;bottom:146px}
 #q-pictures>button[data-candidate]{width:110px;height:78px}
}
@media(min-width:981px){
 #q-pictures{left:auto;right:12px;top:92px;bottom:154px;transform:none;width:24vw;height:auto;flex-direction:column;padding:4px}
 #q-pictures>button[data-candidate]{width:100%;height:30%;flex:1;min-height:0}
 #q-pictures .q-compare{width:100%;height:100%;flex-direction:column}
 #q-pictures .q-compare>svg{width:100%;height:45%}
 .q-principle{width:100%;height:180px}
}
#mission{position:fixed;z-index:16;left:50%;top:var(--mission-top,92px);transform:translateX(-50%);width:max-content;max-width:min(600px,calc(100vw - 24px));padding:8px 16px;border:2px solid #221d18;border-radius:999px;background:#f4efe3;color:#221d18;font:500 17px/1.4 system-ui,sans-serif;text-align:center;word-break:keep-all;overflow-wrap:break-word;pointer-events:none}
body[data-mode=teacher] #mission,.hide-ui #mission{display:none}
@media(max-width:980px){#mission{top:var(--mission-top,148px);max-width:calc(100vw - 24px);font-size:15px;padding:7px 12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="quests" class="hud" aria-hidden="true"></div>
<div id="mission" data-mission role="status" aria-live="polite" aria-atomic="true"></div>
<div id="tools" class="hud"></div>
